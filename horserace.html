<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Day Downs — Fantasy Draft Order Race</title>
<style>
    :root {
        --turf: #3d7a52;
        --turf-dark: #1f3d29;
        --dirt: #8b6f47;
        --dirt-dark: #5e4a2f;
        --rail: #ffffff;
        --gold: #d4af37;
        --gold-bright: #ffd54a;
        --grandstand: #1a2f22;
        --ink: #f5efe0;
        --dim: #a89e7e;
        --card: #142218;
        --card-hi: #1e3226;
        --accent: #d4af37;
        --danger: #dc2626;
        --winner: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        min-height: 100vh;
        background: linear-gradient(180deg, #0a1310 0%, #142218 100%);
        color: var(--ink);
        font-family: 'Copperplate Gothic Bold', 'Bank Gothic', 'Trajan Pro', 'Georgia', serif;
    }
    body {
        display: flex; flex-direction: column;
        min-height: 100vh;
    }
    .header {
        background: var(--grandstand);
        border-bottom: 3px double var(--gold);
        padding: 1rem 1.5rem;
        text-align: center;
    }
    .header h1 {
        color: var(--gold);
        font-size: 2.2rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        line-height: 1;
        text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .header .subtitle {
        color: var(--ink); font-size: 0.75rem;
        letter-spacing: 0.5em; margin-top: 0.35rem;
        text-transform: uppercase; opacity: 0.7;
        font-family: 'Copperplate Gothic Bold', serif;
    }

    /* ===== Setup screen ===== */
    .setup {
        max-width: 680px;
        margin: 2rem auto;
        padding: 2rem;
        background: var(--card);
        border: 1px solid var(--gold);
        border-radius: 10px;
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.08);
    }
    .setup h2 {
        color: var(--gold); font-size: 1rem;
        letter-spacing: 0.14em; text-transform: uppercase;
        margin-bottom: 1rem; text-align: center;
        border-bottom: 1px solid rgba(212,175,55,0.3);
        padding-bottom: 0.75rem;
    }
    .setup-row {
        display: flex; align-items: center; gap: 1rem;
        margin: 1rem 0;
    }
    .setup-row label {
        color: var(--dim); font-size: 0.85rem;
        letter-spacing: 0.08em; text-transform: uppercase;
        min-width: 150px;
    }
    .setup select, .setup input[type="text"] {
        flex: 1;
        background: var(--card-hi);
        border: 1px solid rgba(212,175,55,0.35);
        color: var(--ink);
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 0.95rem;
        font-family: 'Copperplate Gothic Bold', serif;
    }
    .setup select:focus, .setup input:focus {
        outline: 1px solid var(--gold);
    }
    #nameFields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.6rem;
        margin-top: 1rem;
    }
    .name-input {
        display: flex; align-items: center; gap: 0.5rem;
        background: var(--card-hi);
        border: 1px solid rgba(212,175,55,0.25);
        border-radius: 4px;
        padding: 6px 10px;
    }
    .name-input .lane {
        display: inline-block;
        width: 26px; height: 26px;
        border-radius: 50%;
        color: white; font-weight: 900; text-align: center;
        line-height: 26px; font-size: 0.85rem;
        border: 2px solid rgba(255,255,255,0.4);
        flex-shrink: 0;
    }
    .name-input input {
        flex: 1; background: transparent;
        border: none; color: var(--ink);
        font-family: inherit; font-size: 0.9rem;
        outline: none;
    }
    .btn-race {
        margin-top: 1.5rem;
        width: 100%;
        padding: 1rem;
        background: linear-gradient(180deg, var(--gold-bright), var(--gold));
        color: #1a2f22; font-weight: 900;
        border: none; border-radius: 6px;
        font-size: 1.1rem; letter-spacing: 0.2em;
        text-transform: uppercase; cursor: pointer;
        font-family: 'Copperplate Gothic Bold', serif;
        transition: transform 0.1s;
        box-shadow: 0 4px 14px rgba(212,175,55,0.35);
    }
    .btn-race:hover { transform: translateY(-1px); }
    .btn-race:active { transform: translateY(1px); }
    .btn-race:disabled {
        opacity: 0.4; cursor: not-allowed; transform: none;
    }

    /* ===== Race screen ===== */
    .race {
        flex: 1;
        display: flex; flex-direction: column;
        padding: 1rem;
        gap: 1rem;
        min-height: 0;
    }
    .race-hud {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 1rem;
        background: var(--grandstand);
        border: 1px solid var(--gold);
        border-radius: 8px;
        padding: 0.75rem 1.25rem;
        align-items: center;
    }
    .race-hud .leader {
        text-align: left;
    }
    .race-hud .clock {
        font-size: 2.2rem; color: var(--gold-bright);
        letter-spacing: 0.1em; font-weight: 900;
        text-shadow: 0 0 12px rgba(255, 213, 74, 0.35);
        text-align: center;
    }
    .race-hud .status {
        text-align: right;
    }
    .race-hud .label {
        display: block; color: var(--dim);
        font-size: 0.65rem; letter-spacing: 0.2em;
        text-transform: uppercase; margin-bottom: 3px;
    }
    .race-hud .value {
        font-size: 1.1rem; color: var(--ink);
        letter-spacing: 0.05em;
    }
    .view-toggle {
        display: inline-flex; gap: 0; align-self: flex-start;
        background: var(--card); border: 1px solid var(--gold);
        border-radius: 6px; overflow: hidden;
    }
    .vbtn {
        background: transparent; color: var(--dim);
        border: none; padding: 6px 16px;
        font-family: 'Copperplate Gothic Bold', serif;
        font-size: 0.78rem; letter-spacing: 0.12em;
        text-transform: uppercase; cursor: pointer;
    }
    .vbtn:hover { color: var(--ink); }
    .vbtn.active {
        background: var(--gold); color: #1a2f22;
    }

    .track-wrap {
        flex: 1;
        display: flex; gap: 1rem;
        min-height: 0;
    }
    #trackCanvas {
        flex: 1;
        background: var(--turf-dark);
        border: 2px solid var(--gold);
        border-radius: 10px;
        min-height: 400px;
    }
    .standings {
        width: 240px;
        background: var(--card);
        border: 1px solid var(--gold);
        border-radius: 8px;
        padding: 0.85rem;
        overflow-y: auto;
        max-height: calc(100vh - 200px);
    }
    .standings h3 {
        color: var(--gold);
        font-size: 0.75rem; letter-spacing: 0.14em;
        text-transform: uppercase; margin-bottom: 0.6rem;
        text-align: center;
        border-bottom: 1px solid rgba(212,175,55,0.3);
        padding-bottom: 0.4rem;
    }
    .standings-row {
        display: grid;
        grid-template-columns: 24px 22px 1fr auto;
        gap: 0.4rem; align-items: center;
        padding: 4px 6px; margin: 3px 0;
        background: var(--card-hi);
        border-radius: 4px;
        font-size: 0.82rem;
        transition: transform 0.3s ease;
    }
    .standings-row.first {
        background: rgba(212, 175, 55, 0.20);
        border: 1px solid var(--gold);
    }
    .standings-row .place {
        color: var(--gold); font-weight: 900;
        text-align: right;
    }
    .standings-row .dot {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.35);
    }
    .standings-row .name { color: var(--ink); }
    .standings-row .pct {
        color: var(--dim); font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
    }

    /* ===== Results screen ===== */
    .results {
        max-width: 620px;
        margin: 2rem auto;
        padding: 2rem;
        background: var(--card);
        border: 2px solid var(--gold);
        border-radius: 10px;
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.20);
    }
    .results h2 {
        color: var(--gold-bright);
        font-size: 2rem; text-align: center;
        letter-spacing: 0.14em; text-transform: uppercase;
        margin-bottom: 0.35rem;
        text-shadow: 0 0 20px rgba(255, 213, 74, 0.4);
    }
    .results .subtitle {
        text-align: center; color: var(--dim);
        letter-spacing: 0.3em; font-size: 0.75rem;
        text-transform: uppercase; margin-bottom: 1.5rem;
    }
    .draft-list {
        list-style: none;
    }
    .draft-list li {
        display: grid;
        grid-template-columns: 60px 32px 1fr auto;
        gap: 1rem; align-items: center;
        padding: 0.85rem 1rem; margin: 0.5rem 0;
        background: var(--card-hi);
        border-radius: 6px;
        border-left: 4px solid var(--dim);
        transition: transform 0.15s;
    }
    .draft-list li.gold {
        border-left-color: var(--gold-bright);
        background: linear-gradient(90deg, rgba(212,175,55,0.20), var(--card-hi) 60%);
    }
    .draft-list li.silver {
        border-left-color: #cbd5e1;
        background: linear-gradient(90deg, rgba(203, 213, 225, 0.10), var(--card-hi) 60%);
    }
    .draft-list li.bronze {
        border-left-color: #d97706;
        background: linear-gradient(90deg, rgba(217, 119, 6, 0.10), var(--card-hi) 60%);
    }
    .draft-list .pick {
        color: var(--gold); font-weight: 900; font-size: 1.1rem;
        letter-spacing: 0.06em;
    }
    .draft-list .dot {
        width: 24px; height: 24px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.4);
    }
    .draft-list .who {
        color: var(--ink); font-size: 1.05rem; letter-spacing: 0.04em;
    }
    .draft-list .time {
        color: var(--dim); font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
    }
    .btn-again {
        margin-top: 1.5rem;
        width: 100%;
        padding: 0.85rem;
        background: transparent;
        color: var(--gold);
        border: 2px solid var(--gold);
        border-radius: 6px;
        font-size: 0.95rem; letter-spacing: 0.2em;
        text-transform: uppercase; cursor: pointer;
        font-family: 'Copperplate Gothic Bold', serif;
    }
    .btn-again:hover { background: rgba(212,175,55,0.10); }
    .hidden { display: none !important; }

    /* Countdown overlay */
    .countdown {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        z-index: 100; pointer-events: none;
    }
    .countdown span {
        color: var(--gold-bright);
        font-size: 14rem; line-height: 1;
        font-weight: 900;
        text-shadow: 0 0 60px rgba(255, 213, 74, 0.7);
        animation: pop 1s ease-out;
    }
    @keyframes pop {
        0%   { transform: scale(0.3); opacity: 0; }
        30%  { transform: scale(1.2); opacity: 1; }
        70%  { transform: scale(1.0); opacity: 1; }
        100% { transform: scale(0.9); opacity: 0; }
    }

    @media (max-width: 720px) {
        #nameFields { grid-template-columns: 1fr; }
        .track-wrap { flex-direction: column; }
        .standings { width: 100%; max-height: 200px; }
    }
</style>
</head>
<body>

<div class="header">
    <h1>Draft Day Downs</h1>
    <div class="subtitle">Fantasy Draft Order · 1 Furlong Sprint</div>
</div>

<!-- ===== Setup ===== -->
<section id="setupScreen" class="setup">
    <h2>Race Setup</h2>
    <div class="setup-row">
        <label for="racerCount">Number of Racers:</label>
        <select id="racerCount">
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10" selected>10</option>
            <option value="11">11</option>
            <option value="12">12</option>
        </select>
    </div>
    <div id="nameFields"></div>
    <button id="startBtn" class="btn-race">Post Time — Start the Race</button>
</section>

<!-- ===== Race ===== -->
<section id="raceScreen" class="race hidden">
    <div class="race-hud">
        <div class="leader">
            <span class="label">Current Leader</span>
            <span class="value" id="hudLeader">—</span>
        </div>
        <div class="clock" id="hudClock">1:00</div>
        <div class="status">
            <span class="label">Status</span>
            <span class="value" id="hudStatus">In the Gates</span>
        </div>
    </div>
    <div class="view-toggle">
        <button class="vbtn active" data-view="top">Bird's-Eye</button>
        <button class="vbtn" data-view="side">Side View</button>
    </div>
    <div class="track-wrap">
        <canvas id="trackCanvas"></canvas>
        <aside class="standings">
            <h3>Standings</h3>
            <div id="standingsList"></div>
        </aside>
    </div>
</section>

<!-- ===== Results ===== -->
<section id="resultsScreen" class="results hidden">
    <h2 id="resultsTitle">Draft Order</h2>
    <div class="subtitle">Order of Finish · The Winner Picks First</div>
    <ol class="draft-list" id="draftList"></ol>
    <button id="againBtn" class="btn-again">New Race</button>
</section>

<div id="countdownOverlay" class="countdown hidden"><span id="countdownNum">3</span></div>

<script>
// ============================================================
// Lane colors — one per gate. First 12 chosen to be visually
// distinct on the dirt track background.
// ============================================================
const LANE_COLORS = [
    '#dc2626', '#2563eb', '#eab308', '#16a34a',
    '#9333ea', '#ea580c', '#ec4899', '#06b6d4',
    '#92400e', '#0d9488', '#d946ef', '#84cc16',
];

// Fantasy league roster — default fill for the 10 slots + the dropdown
// options that appear on every name input.
const DEFAULT_NAMES = [
    'Nick', 'Michael', 'Connor', 'GL', 'JP',
    'Hunter', 'Hank', 'Luke', 'RJ', 'Quinn',
];

const state = {
    count: 10,
    names: DEFAULT_NAMES.slice(),
    horses: [],     // built when race starts
    startTime: 0,
    currentT: 0,
    running: false,
    finished: false,
    view: 'top',    // 'top' (bird's-eye oval) or 'side' (running horses left→right)
};

// ============================================================
// Setup screen wiring
// ============================================================
const racerCountSel = document.getElementById('racerCount');
const nameFields    = document.getElementById('nameFields');
const startBtn      = document.getElementById('startBtn');

function renderNameFields() {
    const n = Number(racerCountSel.value);
    // A single shared <datalist> that every input references — you get a
    // dropdown of the 10 default names on click, and can still type any name.
    const options = DEFAULT_NAMES.map(nm => `<option value="${nm}"></option>`).join('');
    let html = `<datalist id="rosterOptions">${options}</datalist>`;
    for (let i = 0; i < n; i++) {
        const color = LANE_COLORS[i];
        const fill = state.names[i] || '';
        html += `<div class="name-input">
            <span class="lane" style="background:${color};">${i+1}</span>
            <input type="text" list="rosterOptions" placeholder="Racer #${i+1}" value="${fill}" data-i="${i}" autocomplete="off" />
        </div>`;
    }
    nameFields.innerHTML = html;
    nameFields.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
            state.names[Number(inp.dataset.i)] = inp.value.trim();
        });
    });
}
racerCountSel.addEventListener('change', renderNameFields);
renderNameFields();

// ============================================================
// Start button — build horses + kick off countdown
// ============================================================
startBtn.addEventListener('click', () => {
    const n = Number(racerCountSel.value);
    const names = [];
    for (let i = 0; i < n; i++) {
        const v = (state.names[i] || '').trim();
        names.push(v || `Racer ${i+1}`);
    }
    state.count = n;
    state.names = names;
    state.horses = buildHorses(n, names);
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('raceScreen').classList.remove('hidden');
    resizeCanvas();
    startCountdown();
});

// ============================================================
// Horse construction
// Each horse has:
//   - a base per-second progress rate
//   - a speed-noise profile (sinusoidal wave + phase) that makes
//     the race look natural — leads change, closers come from behind
//   - a pre-determined finishTime so the FINAL ORDER is decided
//     before the race starts and the animation just plays it out.
// This lets us rig slot #6 to always finish 2nd without any
// last-second "clamp to 2nd" hack — the finish time is set that
// way from t=0.
// ============================================================
const RACE_MS = 60_000;   // 60 second race, per spec

function buildHorses(n, names) {
    // Generate a random finish time for each horse in a plausible band
    // (50.0s to 58.0s — leaves headroom under the 60s race clock).
    const jitter = () => 50 + Math.random() * 8;
    const finishTimes = Array.from({length: n}, () => jitter());

    // ------ THE WRINKLE ------
    // If there are at least 6 racers, force slot #6 (index 5) to
    // finish SECOND. We do this by sorting the generated times and
    // assigning the second-fastest to horse #6, then leaving the
    // rest of the field in their generated order.
    if (n >= 6) {
        // Sort a copy of the times to find rank positions.
        const sorted = [...finishTimes].sort((a,b) => a - b);
        const fastest = sorted[0];        // 1st place time
        const secondFastest = sorted[1];  // 2nd place time — going to horse #6
        // Remove them from consideration and re-assign the rest at random.
        const remaining = sorted.slice(2);
        // Shuffle remaining across the non-1st, non-6th slots
        for (let i = remaining.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
        }
        // Pick which slot wins (any slot except #6)
        const winnerCandidates = [];
        for (let i = 0; i < n; i++) if (i !== 5) winnerCandidates.push(i);
        const winnerSlot = winnerCandidates[Math.floor(Math.random() * winnerCandidates.length)];
        // Assign
        const out = new Array(n);
        out[winnerSlot] = fastest;
        out[5] = secondFastest;
        let k = 0;
        for (let i = 0; i < n; i++) {
            if (i === winnerSlot || i === 5) continue;
            out[i] = remaining[k++];
        }
        for (let i = 0; i < n; i++) finishTimes[i] = out[i];
    }

    const horses = [];
    for (let i = 0; i < n; i++) {
        // Waves add visual variation during the race that's ALWAYS 0 at the
        // endpoints — so every horse still crosses at t == finishTime exactly.
        // amp = deviation size (fraction of total progress), k = number of
        // half-cycles across the race (higher = wigglier).
        const waves = [
            { amp: 0.06 + Math.random() * 0.06, k: 1 + Math.floor(Math.random() * 3),
              sign: Math.random() < 0.5 ? -1 : 1 },
            { amp: 0.03 + Math.random() * 0.03, k: 2 + Math.floor(Math.random() * 4),
              sign: Math.random() < 0.5 ? -1 : 1 },
        ];
        horses.push({
            lane: i + 1,
            name: names[i],
            color: LANE_COLORS[i],
            finishTime: finishTimes[i],
            waves,
            progress: 0,
            finishedAt: null,
        });
    }
    return horses;
}

// Deterministic progress-at-time formula:
//   linear   = t / finishTime                        (0 at t=0, 1 at t=finishTime)
//   wiggle_i = sign_i * amp_i * sin(k_i * π * u)     (always 0 at u=0 and u=1)
//   progress = linear + Σ wiggle_i, clamped to [0, 0.999) mid-race
// The clamp keeps a horse from "crossing" early if the waves push it above 1;
// the finish check itself is time-based (t >= finishTime), so ordering matches
// the pre-assigned finish times exactly — no integration drift.
function positionAt(h, t) {
    if (t >= h.finishTime) return 1;
    if (t <= 0) return 0;
    const u = t / h.finishTime;
    let p = u;
    for (const w of h.waves) {
        p += w.sign * w.amp * Math.sin(w.k * Math.PI * u);
    }
    return Math.max(0, Math.min(0.999, p));
}


// ============================================================
// Countdown + main loop
// ============================================================
function startCountdown() {
    const overlay = document.getElementById('countdownOverlay');
    const num = document.getElementById('countdownNum');
    overlay.classList.remove('hidden');
    let n = 3;
    num.textContent = n;
    const iv = setInterval(() => {
        n--;
        if (n > 0) {
            num.textContent = n;
        } else {
            num.textContent = 'GO';
            setTimeout(() => {
                overlay.classList.add('hidden');
                clearInterval(iv);
                beginRace();
            }, 700);
        }
    }, 900);
}

function beginRace() {
    state.startTime = performance.now();
    state.running = true;
    state.finished = false;
    document.getElementById('hudStatus').textContent = 'And they\'re off!';
    requestAnimationFrame(tick);
}

function tick(now) {
    const elapsedMs = now - state.startTime;
    const t = elapsedMs / 1000;
    state.currentT = t;
    let allDone = true;
    for (const h of state.horses) {
        if (h.finishedAt !== null) continue;
        if (t >= h.finishTime) {
            h.finishedAt = h.finishTime;
            h.progress = 1.0;
        } else {
            h.progress = positionAt(h, t);
            allDone = false;
        }
    }
    drawTrack();
    updateHUD(t);
    updateStandings();
    if (t < 62 && !allDone) {
        requestAnimationFrame(tick);
    } else {
        for (const h of state.horses) {
            if (h.finishedAt === null) {
                h.finishedAt = h.finishTime;   // trust the pre-assigned time
                h.progress = 1.0;
            }
        }
        drawTrack();
        finishRace();
    }
}

// ============================================================
// Track rendering
// ============================================================
const canvas = document.getElementById('trackCanvas');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1;

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    canvas.width = Math.max(1, Math.floor(cw * dpr));
    canvas.height = Math.max(1, Math.floor(ch * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { resizeCanvas(); drawTrack(); });

// Oval track geometry — computed from canvas size
function trackGeom() {
    const pad = 30;
    const cx = cw / 2;
    const cy = ch / 2;
    // Number of lanes = horse count; each lane is a concentric oval.
    const n = state.horses.length || 8;
    const laneW = 14;                          // width per lane in px
    const outerR = Math.min(ch/2 - pad, 220);  // outer curve radius
    const innerR = Math.max(40, outerR - n * laneW);
    // Straight length = horizontal extent minus 2 curves
    const straight = Math.max(80, cw - pad*2 - outerR*2);
    return { cx, cy, outerR, innerR, straight, laneW, n };
}

// Given a lane number (1..n) and a progress fraction 0..1 (fraction of full lap),
// return {x, y, tangentAngle} for the horse marker along the oval midline of that lane.
function ovalPoint(lane, p) {
    const g = trackGeom();
    // lane 1 is outermost, lane n is innermost — visually more common for us
    const laneR = g.outerR - (lane - 0.5) * g.laneW;
    const perim = 2 * g.straight + 2 * Math.PI * laneR;
    const dist = p * perim;
    // Sections (running counterclockwise, start at right-center = finish line):
    //   0..straight  → top straight, moving LEFT
    //   straight..straight + πR → left curve
    //   straight + πR .. 2*straight + πR → bottom straight, moving RIGHT
    //   2*straight + πR .. 2*straight + 2πR → right curve, back to start
    const halfCurve = Math.PI * laneR;
    if (dist <= g.straight) {
        // Top straight — from right-top to left-top
        const x = g.cx + g.straight/2 - dist;
        const y = g.cy - laneR;
        return { x, y, angle: Math.PI };   // facing left
    }
    let d = dist - g.straight;
    if (d <= halfCurve) {
        // Left curve — half circle centered at (cx - straight/2, cy)
        const theta = d / laneR;    // 0..π
        const centerX = g.cx - g.straight/2;
        const x = centerX - Math.sin(theta) * laneR;
        // Start at top of left curve, sweep down to bottom
        const y = g.cy - Math.cos(theta) * laneR;
        return { x, y, angle: Math.PI + theta };
    }
    d -= halfCurve;
    if (d <= g.straight) {
        // Bottom straight — from left-bottom to right-bottom, moving right
        const x = g.cx - g.straight/2 + d;
        const y = g.cy + laneR;
        return { x, y, angle: 0 };
    }
    d -= g.straight;
    // Right curve — half circle from bottom back to top
    const theta = d / laneR;
    const centerX = g.cx + g.straight/2;
    const x = centerX + Math.sin(theta) * laneR;
    const y = g.cy + Math.cos(theta) * laneR;
    return { x, y, angle: theta };
}

function drawTrack() {
    if (!ctx) return;
    if (state.view === 'side') { drawSide(); return; }
    ctx.clearRect(0, 0, cw, ch);
    const g = trackGeom();
    // Full background = darker grandstand green
    ctx.fillStyle = '#0f1e14';
    ctx.fillRect(0, 0, cw, ch);
    // Outer track surface (dirt) — draw the outermost oval as filled shape
    drawOvalFilled(g.cx, g.cy, g.outerR, g.straight, '#8b6f47');
    // Inner turf (fill the infield oval)
    drawOvalFilled(g.cx, g.cy, g.innerR, g.straight, '#3d7a52');
    // Turf detail — subtle horizontal stripes
    ctx.save();
    drawOvalPath(g.cx, g.cy, g.innerR, g.straight);
    ctx.clip();
    for (let y = 0; y < ch; y += 12) {
        ctx.fillStyle = (y / 12) % 2 === 0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.05)';
        ctx.fillRect(0, y, cw, 6);
    }
    ctx.restore();
    // Rails — inner + outer
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    drawOvalPath(g.cx, g.cy, g.outerR, g.straight); ctx.stroke();
    drawOvalPath(g.cx, g.cy, g.innerR, g.straight); ctx.stroke();
    // Lane markers — thin dashed lines between lanes
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    for (let l = 1; l < g.n; l++) {
        const r = g.outerR - l * g.laneW;
        drawOvalPath(g.cx, g.cy, r, g.straight);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    // Finish line — big checkered vertical band at 3 o'clock
    const finishX = g.cx + g.straight/2;
    const finishTop = g.cy - g.outerR;
    const finishBot = g.cy - g.innerR;
    const finishBot2 = g.cy + g.innerR;
    const finishBot3 = g.cy + g.outerR;
    // Track surface finish line — checkered pattern across the dirt band above
    drawCheckerLine(finishX, finishTop, finishX, finishBot, 8);
    drawCheckerLine(finishX, finishBot2, finishX, finishBot3, 8);
    // Finish flag inside infield
    ctx.fillStyle = '#dc2626';
    ctx.font = '900 14px "Copperplate Gothic Bold", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('FINISH', g.cx + g.straight/2 - 22, g.cy - 6);
    // Center infield logo — "DRAFT DAY DOWNS"
    ctx.fillStyle = 'rgba(212, 175, 55, 0.65)';
    ctx.font = `900 ${Math.min(g.straight * 0.09, 32)}px "Copperplate Gothic Bold", serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('DRAFT DAY DOWNS', g.cx, g.cy - 12);
    ctx.font = `700 ${Math.min(g.straight * 0.045, 14)}px "Copperplate Gothic Bold", serif`;
    ctx.fillStyle = 'rgba(212, 175, 55, 0.45)';
    ctx.fillText('EST. 2026 · 1 FURLONG', g.cx, g.cy + 14);

    // Horses
    for (const h of state.horses) {
        const pt = ovalPoint(h.lane, h.progress);
        drawHorse(pt.x, pt.y, h);
    }
}

// Oval path: an oval built from 2 straights + 2 semicircles
function drawOvalPath(cx, cy, r, straight) {
    ctx.beginPath();
    ctx.moveTo(cx + straight/2, cy - r);          // start top-right of straight
    ctx.lineTo(cx - straight/2, cy - r);          // top straight
    ctx.arc(cx - straight/2, cy, r, -Math.PI/2, Math.PI/2, true);  // left curve
    ctx.lineTo(cx + straight/2, cy + r);          // bottom straight
    ctx.arc(cx + straight/2, cy, r, Math.PI/2, -Math.PI/2, true);  // right curve
    ctx.closePath();
}
function drawOvalFilled(cx, cy, r, straight, color) {
    ctx.fillStyle = color;
    drawOvalPath(cx, cy, r, straight);
    ctx.fill();
}
function drawCheckerLine(x1, y1, x2, y2, boxSize) {
    // Vertical checkered band along the finish stripe
    const dist = Math.abs(y2 - y1);
    const cols = 3;
    const rows = Math.floor(dist / boxSize);
    const bandW = cols * boxSize;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const black = (r + c) % 2 === 0;
            ctx.fillStyle = black ? '#111' : '#fff';
            ctx.fillRect(x1 - bandW/2 + c * boxSize, y1 + r * boxSize, boxSize, boxSize);
        }
    }
}

// Draw a horse as a colored jockey silks bubble with lane number
function drawHorse(x, y, h) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(x, y + 8, 10, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // Silks body
    ctx.fillStyle = h.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, 9, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Lane number
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 10px "Copperplate Gothic Bold", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(h.lane, x, y + 0.5);
}

// ============================================================
// Side view — horses running left→right in horizontal lanes
// with a proper gallop animation.
// ============================================================
function drawSide() {
    ctx.clearRect(0, 0, cw, ch);
    const n = state.horses.length;
    const topPad = 20, botPad = 20, leftPad = 60, rightPad = 60;
    const laneH = Math.floor((ch - topPad - botPad) / n);
    const trackLeft = leftPad;
    const trackRight = cw - rightPad;
    const trackW = trackRight - trackLeft;

    // Sky
    const sky = ctx.createLinearGradient(0, 0, 0, ch);
    sky.addColorStop(0, '#1a2f22');
    sky.addColorStop(1, '#0a1310');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, cw, ch);

    // Distant grandstand silhouette across the top
    ctx.fillStyle = '#0a1710';
    ctx.beginPath();
    ctx.moveTo(0, 0); ctx.lineTo(cw, 0); ctx.lineTo(cw, topPad - 6);
    for (let x = cw; x >= 0; x -= 16) {
        const h = 4 + ((x * 7) % 9);
        ctx.lineTo(x, topPad - 6 - h);
        ctx.lineTo(x - 8, topPad - 6 - h);
    }
    ctx.lineTo(0, topPad - 6); ctx.closePath();
    ctx.fill();

    // Each lane — dirt strip + rail + finish line
    for (let i = 0; i < n; i++) {
        const h = state.horses[i];
        const laneTop = topPad + i * laneH;
        const laneMid = laneTop + laneH / 2;

        // Dirt lane
        const dirtGrad = ctx.createLinearGradient(0, laneTop, 0, laneTop + laneH);
        dirtGrad.addColorStop(0, '#7a5f3d');
        dirtGrad.addColorStop(0.5, '#8b6f47');
        dirtGrad.addColorStop(1, '#6d5535');
        ctx.fillStyle = dirtGrad;
        ctx.fillRect(trackLeft, laneTop, trackW, laneH - 2);
        // Rail between lanes
        ctx.fillStyle = 'rgba(255,255,255,0.35)';
        ctx.fillRect(trackLeft, laneTop + laneH - 2, trackW, 1);
        if (i === 0) ctx.fillRect(trackLeft, laneTop - 1, trackW, 1);

        // Lane number badge on the left
        ctx.fillStyle = h.color;
        ctx.beginPath();
        ctx.arc(leftPad - 22, laneMid, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.6)';
        ctx.lineWidth = 1.5; ctx.stroke();
        ctx.fillStyle = 'white';
        ctx.font = '900 12px "Copperplate Gothic Bold", serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(h.lane, leftPad - 22, laneMid + 0.5);

        // Name label
        ctx.fillStyle = '#f5efe0';
        ctx.font = '600 10px "Copperplate Gothic Bold", serif';
        ctx.textAlign = 'left';
        ctx.fillText(h.name.toUpperCase().slice(0, 12), trackLeft + 4, laneTop + 10);

        // Position line (progress bar underlay)
        const progressPx = h.progress * (trackW - 40);
        ctx.fillStyle = h.color + '33';
        ctx.fillRect(trackLeft, laneMid + 12, progressPx, 3);

        // Horse
        const horseX = trackLeft + 20 + progressPx;
        drawHorseSide(horseX, laneMid + 4, h, state.currentT);
    }

    // Finish line — big checkered flag at right
    const finX = trackRight - 30;
    drawCheckerBand(finX, topPad, 8, ch - topPad - botPad, 8);
    ctx.fillStyle = '#dc2626';
    ctx.font = '900 12px "Copperplate Gothic Bold", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('FINISH', finX, topPad - 14);

    // Start line at left
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(trackLeft + 4, topPad);
    ctx.lineTo(trackLeft + 4, ch - botPad);
    ctx.stroke();
    ctx.setLineDash([]);
}

function drawCheckerBand(x, y, w, h, box) {
    const cols = Math.max(1, Math.floor(w / box));
    const rows = Math.floor(h / box);
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            ctx.fillStyle = (r + c) % 2 === 0 ? '#111' : '#fff';
            ctx.fillRect(x + c * box, y + r * box, box, box);
        }
    }
}

// A stylized side-view horse with 4 gallop-animated legs, colored silks
// blanket on the back, and a small jockey. Body color = a natural brown;
// silks color = the horse's lane color so viewers can still identify by silks.
function drawHorseSide(x, y, h, t) {
    const isFinished = h.finishedAt !== null;
    const gallopSpeed = isFinished ? 0 : 14;
    const phase = t * gallopSpeed;

    // Body bounce
    const bounce = isFinished ? 0 : Math.abs(Math.sin(phase * 0.5)) * 1.5;
    const cy = y - bounce;

    // ---- Legs (behind body) ---- 4 legs w/ paired phases so it looks like a gallop
    const legPairs = [
        { xOff: -10, ph: 0 },              // rear left
        { xOff:  -4, ph: Math.PI * 0.5 },  // rear right
        { xOff:   6, ph: Math.PI },        // front left
        { xOff:  12, ph: Math.PI * 1.5 },  // front right
    ];
    ctx.strokeStyle = '#3a2810';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (const leg of legPairs) {
        const swing = Math.sin(phase + leg.ph);
        const forward = swing * 5;
        const lift = Math.max(0, swing) * 4;
        ctx.beginPath();
        ctx.moveTo(x + leg.xOff, cy + 3);
        ctx.lineTo(x + leg.xOff + forward, cy + 12 - lift);
        ctx.stroke();
    }

    // ---- Body ----
    ctx.fillStyle = '#6b4a2b';   // horse brown
    ctx.strokeStyle = '#3a2810';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(x, cy, 16, 7, 0, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();

    // Muscular shading on body
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.beginPath();
    ctx.ellipse(x, cy - 2, 14, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // Silks blanket (colored — lane color)
    ctx.fillStyle = h.color;
    ctx.beginPath();
    ctx.ellipse(x - 2, cy - 3, 9, 4, 0, 0, Math.PI * 2);
    ctx.fill();

    // Neck + head — extending forward
    ctx.fillStyle = '#6b4a2b';
    ctx.strokeStyle = '#3a2810';
    ctx.beginPath();
    ctx.moveTo(x + 12, cy - 4);
    ctx.lineTo(x + 20, cy - 12);
    ctx.lineTo(x + 26, cy - 12);
    ctx.lineTo(x + 25, cy - 9);
    ctx.lineTo(x + 27, cy - 7);   // muzzle
    ctx.lineTo(x + 22, cy - 5);
    ctx.lineTo(x + 15, cy - 1);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Mane
    ctx.fillStyle = '#2a1a08';
    ctx.beginPath();
    ctx.moveTo(x + 12, cy - 5);
    ctx.lineTo(x + 18, cy - 12);
    ctx.lineTo(x + 20, cy - 11);
    ctx.lineTo(x + 15, cy - 3);
    ctx.closePath();
    ctx.fill();

    // Ears
    ctx.fillStyle = '#6b4a2b';
    ctx.beginPath();
    ctx.moveTo(x + 21, cy - 11);
    ctx.lineTo(x + 22, cy - 15);
    ctx.lineTo(x + 23, cy - 11);
    ctx.closePath();
    ctx.fill();

    // Eye
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(x + 23, cy - 9, 0.8, 0, Math.PI * 2);
    ctx.fill();

    // Tail — swishing
    const tailSwing = Math.sin(phase * 0.5) * 3;
    ctx.strokeStyle = '#2a1a08';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 16, cy - 2);
    ctx.quadraticCurveTo(x - 22, cy - 3 + tailSwing, x - 24, cy + 3 + tailSwing);
    ctx.stroke();

    // Jockey — small hunched figure on the blanket
    ctx.fillStyle = h.color;
    ctx.beginPath();
    ctx.arc(x - 2, cy - 8, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();
    // Helmet stripe
    ctx.fillStyle = '#fff';
    ctx.fillRect(x - 4, cy - 9, 4, 1);
    // Jockey lane number
    ctx.fillStyle = 'white';
    ctx.font = '900 6px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(h.lane, x - 2, cy - 7.5);

    // Dust puff behind galloping horses
    if (!isFinished && Math.random() < 0.3) {
        ctx.fillStyle = 'rgba(160, 130, 90, 0.4)';
        ctx.beginPath();
        ctx.arc(x - 12 + (Math.random() - 0.5) * 4, cy + 14, 2 + Math.random() * 2, 0, Math.PI * 2);
        ctx.fill();
    }
}

// ============================================================
// View toggle wiring
// ============================================================
document.querySelectorAll('.vbtn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.vbtn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.view = btn.dataset.view;
        drawTrack();
    });
});

// ============================================================
// HUD + standings
// ============================================================
function updateHUD(t) {
    const remaining = Math.max(0, RACE_MS/1000 - t);
    const m = Math.floor(remaining / 60);
    const s = Math.floor(remaining % 60);
    document.getElementById('hudClock').textContent =
        `${m}:${String(s).padStart(2, '0')}`;
    // Current leader
    const order = orderedHorses();
    if (order.length) {
        document.getElementById('hudLeader').textContent = `#${order[0].lane} ${order[0].name}`;
    }
    const nFin = state.horses.filter(h => h.finishedAt !== null).length;
    if (nFin === 0) document.getElementById('hudStatus').textContent = 'Down the Backstretch';
    else if (nFin < state.horses.length) document.getElementById('hudStatus').textContent = `${nFin} Across`;
}

function orderedHorses() {
    // Sort: finishers first by finishedAt asc; unfinished by progress desc
    return [...state.horses].sort((a, b) => {
        if (a.finishedAt !== null && b.finishedAt !== null) return a.finishedAt - b.finishedAt;
        if (a.finishedAt !== null) return -1;
        if (b.finishedAt !== null) return 1;
        return b.progress - a.progress;
    });
}

function updateStandings() {
    const el = document.getElementById('standingsList');
    const order = orderedHorses();
    let html = '';
    order.forEach((h, idx) => {
        const place = idx + 1;
        const finished = h.finishedAt !== null;
        const pctOrTime = finished
            ? `${h.finishedAt.toFixed(2)}s`
            : `${(h.progress * 100).toFixed(0)}%`;
        html += `<div class="standings-row ${idx === 0 ? 'first' : ''}" data-lane="${h.lane}">
            <span class="place">${place}</span>
            <span class="dot" style="background:${h.color};"></span>
            <span class="name">#${h.lane} ${h.name}</span>
            <span class="pct">${pctOrTime}</span>
        </div>`;
    });
    el.innerHTML = html;
}

// ============================================================
// Finish screen
// ============================================================
function finishRace() {
    state.running = false;
    state.finished = true;
    const order = orderedHorses();
    const list = document.getElementById('draftList');
    let html = '';
    order.forEach((h, idx) => {
        const place = idx + 1;
        const medal = place === 1 ? 'gold' : place === 2 ? 'silver' : place === 3 ? 'bronze' : '';
        html += `<li class="${medal}">
            <span class="pick">Pick ${place}</span>
            <span class="dot" style="background:${h.color};"></span>
            <span class="who">#${h.lane} · ${h.name}</span>
            <span class="time">${h.finishedAt.toFixed(2)}s</span>
        </li>`;
    });
    list.innerHTML = html;
    document.getElementById('resultsTitle').textContent = `${order[0].name} wins!`;
    setTimeout(() => {
        document.getElementById('raceScreen').classList.add('hidden');
        document.getElementById('resultsScreen').classList.remove('hidden');
    }, 1500);
}

// Rerun
document.getElementById('againBtn').addEventListener('click', () => {
    // Clear per-race state, keep names
    state.horses = [];
    state.running = false;
    state.finished = false;
    document.getElementById('resultsScreen').classList.add('hidden');
    document.getElementById('setupScreen').classList.remove('hidden');
});
</script>
