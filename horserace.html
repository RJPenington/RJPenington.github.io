<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Day Downs — Fantasy Draft Order Race</title>
<style>
    :root {
        --turf: #3d7a52;
        --turf-dark: #1f3d29;
        --dirt: #8b6f47;
        --dirt-dark: #5e4a2f;
        --rail: #ffffff;
        --gold: #d4af37;
        --gold-bright: #ffd54a;
        --grandstand: #1a2f22;
        --ink: #f5efe0;
        --dim: #a89e7e;
        --card: #142218;
        --card-hi: #1e3226;
        --accent: #d4af37;
        --danger: #dc2626;
        --winner: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
        min-height: 100vh;
        background: linear-gradient(180deg, #0a1310 0%, #142218 100%);
        color: var(--ink);
        font-family: 'Copperplate Gothic Bold', 'Bank Gothic', 'Trajan Pro', 'Georgia', serif;
    }
    body {
        display: flex; flex-direction: column;
        min-height: 100vh;
    }
    .header {
        background: var(--grandstand);
        border-bottom: 3px double var(--gold);
        padding: 1rem 1.5rem;
        text-align: center;
    }
    .header h1 {
        color: var(--gold);
        font-size: 2.2rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        line-height: 1;
        text-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    .header .subtitle {
        color: var(--ink); font-size: 0.75rem;
        letter-spacing: 0.5em; margin-top: 0.35rem;
        text-transform: uppercase; opacity: 0.7;
        font-family: 'Copperplate Gothic Bold', serif;
    }

    /* ===== Setup screen ===== */
    .setup {
        max-width: 680px;
        margin: 2rem auto;
        padding: 2rem;
        background: var(--card);
        border: 1px solid var(--gold);
        border-radius: 10px;
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.08);
    }
    .setup h2 {
        color: var(--gold); font-size: 1rem;
        letter-spacing: 0.14em; text-transform: uppercase;
        margin-bottom: 1rem; text-align: center;
        border-bottom: 1px solid rgba(212,175,55,0.3);
        padding-bottom: 0.75rem;
    }
    .setup-row {
        display: flex; align-items: center; gap: 1rem;
        margin: 1rem 0;
    }
    .setup-row label {
        color: var(--dim); font-size: 0.85rem;
        letter-spacing: 0.08em; text-transform: uppercase;
        min-width: 150px;
    }
    .setup select, .setup input[type="text"] {
        flex: 1;
        background: var(--card-hi);
        border: 1px solid rgba(212,175,55,0.35);
        color: var(--ink);
        padding: 8px 12px;
        border-radius: 4px;
        font-size: 0.95rem;
        font-family: 'Copperplate Gothic Bold', serif;
    }
    .setup select:focus, .setup input:focus {
        outline: 1px solid var(--gold);
    }
    #nameFields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.6rem;
        margin-top: 1rem;
    }
    .name-input {
        display: flex; align-items: center; gap: 0.5rem;
        background: var(--card-hi);
        border: 1px solid rgba(212,175,55,0.25);
        border-radius: 4px;
        padding: 6px 10px;
    }
    .name-input .lane {
        display: inline-block;
        width: 26px; height: 26px;
        border-radius: 50%;
        color: white; font-weight: 900; text-align: center;
        line-height: 26px; font-size: 0.85rem;
        border: 2px solid rgba(255,255,255,0.4);
        flex-shrink: 0;
    }
    .name-input input {
        flex: 1; background: transparent;
        border: none; color: var(--ink);
        font-family: inherit; font-size: 0.9rem;
        outline: none;
    }
    .btn-race {
        margin-top: 1.5rem;
        width: 100%;
        padding: 1rem;
        background: linear-gradient(180deg, var(--gold-bright), var(--gold));
        color: #1a2f22; font-weight: 900;
        border: none; border-radius: 6px;
        font-size: 1.1rem; letter-spacing: 0.2em;
        text-transform: uppercase; cursor: pointer;
        font-family: 'Copperplate Gothic Bold', serif;
        transition: transform 0.1s;
        box-shadow: 0 4px 14px rgba(212,175,55,0.35);
    }
    .btn-race:hover { transform: translateY(-1px); }
    .btn-race:active { transform: translateY(1px); }
    .btn-race:disabled {
        opacity: 0.4; cursor: not-allowed; transform: none;
    }

    /* ===== Race screen ===== */
    .race {
        flex: 1;
        display: flex; flex-direction: column;
        padding: 1rem;
        gap: 1rem;
        min-height: 0;
    }
    .race-hud {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        gap: 1rem;
        background: var(--grandstand);
        border: 1px solid var(--gold);
        border-radius: 8px;
        padding: 0.75rem 1.25rem;
        align-items: center;
    }
    .race-hud .leader {
        text-align: left;
    }
    .race-hud .clock {
        font-size: 2.2rem; color: var(--gold-bright);
        letter-spacing: 0.1em; font-weight: 900;
        text-shadow: 0 0 12px rgba(255, 213, 74, 0.35);
        text-align: center;
    }
    .race-hud .status {
        text-align: right;
    }
    .race-hud .label {
        display: block; color: var(--dim);
        font-size: 0.65rem; letter-spacing: 0.2em;
        text-transform: uppercase; margin-bottom: 3px;
    }
    .race-hud .value {
        font-size: 1.1rem; color: var(--ink);
        letter-spacing: 0.05em;
    }
    .track-wrap {
        flex: 1;
        display: flex; gap: 1rem;
        min-height: 0;
    }
    #trackCanvas {
        flex: 1;
        background: var(--turf-dark);
        border: 2px solid var(--gold);
        border-radius: 10px;
        min-height: 400px;
    }
    .standings {
        width: 240px;
        background: var(--card);
        border: 1px solid var(--gold);
        border-radius: 8px;
        padding: 0.85rem;
        overflow-y: auto;
        max-height: calc(100vh - 200px);
    }
    .standings h3 {
        color: var(--gold);
        font-size: 0.75rem; letter-spacing: 0.14em;
        text-transform: uppercase; margin-bottom: 0.6rem;
        text-align: center;
        border-bottom: 1px solid rgba(212,175,55,0.3);
        padding-bottom: 0.4rem;
    }
    .standings-row {
        display: grid;
        grid-template-columns: 24px 22px 1fr auto;
        gap: 0.4rem; align-items: center;
        padding: 4px 6px; margin: 3px 0;
        background: var(--card-hi);
        border-radius: 4px;
        font-size: 0.82rem;
        transition: transform 0.3s ease;
    }
    .standings-row.first {
        background: rgba(212, 175, 55, 0.20);
        border: 1px solid var(--gold);
    }
    .standings-row .place {
        color: var(--gold); font-weight: 900;
        text-align: right;
    }
    .standings-row .dot {
        width: 18px; height: 18px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.35);
    }
    .standings-row .name { color: var(--ink); }
    .standings-row .pct {
        color: var(--dim); font-size: 0.72rem;
        font-variant-numeric: tabular-nums;
    }

    /* ===== Results screen ===== */
    .results {
        max-width: 620px;
        margin: 2rem auto;
        padding: 2rem;
        background: var(--card);
        border: 2px solid var(--gold);
        border-radius: 10px;
        box-shadow: 0 0 40px rgba(212, 175, 55, 0.20);
    }
    .results h2 {
        color: var(--gold-bright);
        font-size: 2rem; text-align: center;
        letter-spacing: 0.14em; text-transform: uppercase;
        margin-bottom: 0.35rem;
        text-shadow: 0 0 20px rgba(255, 213, 74, 0.4);
    }
    .results .subtitle {
        text-align: center; color: var(--dim);
        letter-spacing: 0.3em; font-size: 0.75rem;
        text-transform: uppercase; margin-bottom: 1.5rem;
    }
    .draft-list {
        list-style: none;
    }
    .draft-list li {
        display: grid;
        grid-template-columns: 60px 32px 1fr auto;
        gap: 1rem; align-items: center;
        padding: 0.85rem 1rem; margin: 0.5rem 0;
        background: var(--card-hi);
        border-radius: 6px;
        border-left: 4px solid var(--dim);
        transition: transform 0.15s;
    }
    .draft-list li.gold {
        border-left-color: var(--gold-bright);
        background: linear-gradient(90deg, rgba(212,175,55,0.20), var(--card-hi) 60%);
    }
    .draft-list li.silver {
        border-left-color: #cbd5e1;
        background: linear-gradient(90deg, rgba(203, 213, 225, 0.10), var(--card-hi) 60%);
    }
    .draft-list li.bronze {
        border-left-color: #d97706;
        background: linear-gradient(90deg, rgba(217, 119, 6, 0.10), var(--card-hi) 60%);
    }
    .draft-list .pick {
        color: var(--gold); font-weight: 900; font-size: 1.1rem;
        letter-spacing: 0.06em;
    }
    .draft-list .dot {
        width: 24px; height: 24px; border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.4);
    }
    .draft-list .who {
        color: var(--ink); font-size: 1.05rem; letter-spacing: 0.04em;
    }
    .draft-list .time {
        color: var(--dim); font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
    }
    .btn-again {
        margin-top: 1.5rem;
        width: 100%;
        padding: 0.85rem;
        background: transparent;
        color: var(--gold);
        border: 2px solid var(--gold);
        border-radius: 6px;
        font-size: 0.95rem; letter-spacing: 0.2em;
        text-transform: uppercase; cursor: pointer;
        font-family: 'Copperplate Gothic Bold', serif;
    }
    .btn-again:hover { background: rgba(212,175,55,0.10); }
    .hidden { display: none !important; }

    /* Countdown overlay */
    .countdown {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, 0.6);
        z-index: 100; pointer-events: none;
    }
    .countdown span {
        color: var(--gold-bright);
        font-size: 14rem; line-height: 1;
        font-weight: 900;
        text-shadow: 0 0 60px rgba(255, 213, 74, 0.7);
        animation: pop 1s ease-out;
    }
    @keyframes pop {
        0%   { transform: scale(0.3); opacity: 0; }
        30%  { transform: scale(1.2); opacity: 1; }
        70%  { transform: scale(1.0); opacity: 1; }
        100% { transform: scale(0.9); opacity: 0; }
    }

    @media (max-width: 720px) {
        #nameFields { grid-template-columns: 1fr; }
        .track-wrap { flex-direction: column; }
        .standings { width: 100%; max-height: 200px; }
    }
</style>
</head>
<body>

<div class="header">
    <h1>Draft Day Downs</h1>
    <div class="subtitle">Fantasy Draft Order · 1 Furlong Sprint</div>
</div>

<!-- ===== Setup ===== -->
<section id="setupScreen" class="setup">
    <h2>Race Setup</h2>
    <div class="setup-row">
        <label for="racerCount">Number of Racers:</label>
        <select id="racerCount">
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10" selected>10</option>
            <option value="11">11</option>
            <option value="12">12</option>
        </select>
    </div>
    <div id="nameFields"></div>
    <button id="startBtn" class="btn-race">Post Time — Start the Race</button>
</section>

<!-- ===== Race ===== -->
<section id="raceScreen" class="race hidden">
    <div class="race-hud">
        <div class="leader">
            <span class="label">Current Leader</span>
            <span class="value" id="hudLeader">—</span>
        </div>
        <div class="clock" id="hudClock">1:00</div>
        <div class="status">
            <span class="label">Status</span>
            <span class="value" id="hudStatus">In the Gates</span>
        </div>
    </div>
    <div class="track-wrap">
        <canvas id="trackCanvas"></canvas>
        <aside class="standings">
            <h3>Standings</h3>
            <div id="standingsList"></div>
        </aside>
    </div>
</section>

<!-- ===== Results ===== -->
<section id="resultsScreen" class="results hidden">
    <h2 id="resultsTitle">Draft Order</h2>
    <div class="subtitle">Order of Finish · The Winner Picks First</div>
    <ol class="draft-list" id="draftList"></ol>
    <button id="againBtn" class="btn-again">New Race</button>
</section>

<div id="countdownOverlay" class="countdown hidden"><span id="countdownNum">3</span></div>

<script>
// ============================================================
// Lane colors — one per gate. First 12 chosen to be visually
// distinct on the dirt track background.
// ============================================================
const LANE_COLORS = [
    '#dc2626', '#2563eb', '#eab308', '#16a34a',
    '#9333ea', '#ea580c', '#ec4899', '#06b6d4',
    '#92400e', '#0d9488', '#d946ef', '#84cc16',
];

const state = {
    count: 10,
    names: [],
    horses: [],     // built when race starts
    startTime: 0,
    running: false,
    finished: false,
};

// ============================================================
// Setup screen wiring
// ============================================================
const racerCountSel = document.getElementById('racerCount');
const nameFields    = document.getElementById('nameFields');
const startBtn      = document.getElementById('startBtn');

function renderNameFields() {
    const n = Number(racerCountSel.value);
    let html = '';
    for (let i = 0; i < n; i++) {
        const color = LANE_COLORS[i];
        html += `<div class="name-input">
            <span class="lane" style="background:${color};">${i+1}</span>
            <input type="text" placeholder="Racer #${i+1}" value="${state.names[i] || ''}" data-i="${i}" />
        </div>`;
    }
    nameFields.innerHTML = html;
    nameFields.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
            state.names[Number(inp.dataset.i)] = inp.value.trim();
        });
    });
}
racerCountSel.addEventListener('change', renderNameFields);
renderNameFields();

// ============================================================
// Start button — build horses + kick off countdown
// ============================================================
startBtn.addEventListener('click', () => {
    const n = Number(racerCountSel.value);
    const names = [];
    for (let i = 0; i < n; i++) {
        const v = (state.names[i] || '').trim();
        names.push(v || `Racer ${i+1}`);
    }
    state.count = n;
    state.names = names;
    state.horses = buildHorses(n, names);
    document.getElementById('setupScreen').classList.add('hidden');
    document.getElementById('raceScreen').classList.remove('hidden');
    resizeCanvas();
    startCountdown();
});

// ============================================================
// Horse construction
// Each horse has:
//   - a base per-second progress rate
//   - a speed-noise profile (sinusoidal wave + phase) that makes
//     the race look natural — leads change, closers come from behind
//   - a pre-determined finishTime so the FINAL ORDER is decided
//     before the race starts and the animation just plays it out.
// This lets us rig slot #6 to always finish 2nd without any
// last-second "clamp to 2nd" hack — the finish time is set that
// way from t=0.
// ============================================================
const RACE_MS = 60_000;   // 60 second race, per spec

function buildHorses(n, names) {
    // Generate a random finish time for each horse in a plausible band
    // (55.0s to 60.0s — fastest horse crosses just under a minute).
    const jitter = () => 55 + Math.random() * 5;
    const finishTimes = Array.from({length: n}, () => jitter());

    // ------ THE WRINKLE ------
    // If there are at least 6 racers, force slot #6 (index 5) to
    // finish SECOND. We do this by sorting the generated times and
    // assigning the second-fastest to horse #6, then leaving the
    // rest of the field in their generated order.
    if (n >= 6) {
        // Sort a copy of the times to find rank positions.
        const sorted = [...finishTimes].sort((a,b) => a - b);
        const fastest = sorted[0];        // 1st place time
        const secondFastest = sorted[1];  // 2nd place time — going to horse #6
        // Remove them from consideration and re-assign the rest at random.
        const remaining = sorted.slice(2);
        // Shuffle remaining across the non-1st, non-6th slots
        for (let i = remaining.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [remaining[i], remaining[j]] = [remaining[j], remaining[i]];
        }
        // Pick which slot wins (any slot except #6)
        const winnerCandidates = [];
        for (let i = 0; i < n; i++) if (i !== 5) winnerCandidates.push(i);
        const winnerSlot = winnerCandidates[Math.floor(Math.random() * winnerCandidates.length)];
        // Assign
        const out = new Array(n);
        out[winnerSlot] = fastest;
        out[5] = secondFastest;
        let k = 0;
        for (let i = 0; i < n; i++) {
            if (i === winnerSlot || i === 5) continue;
            out[i] = remaining[k++];
        }
        for (let i = 0; i < n; i++) finishTimes[i] = out[i];
    }

    const horses = [];
    for (let i = 0; i < n; i++) {
        // Give each horse a couple of speed-noise waves so the visual
        // race has lead changes even though the final time is fixed.
        const waves = [
            { amp: 0.15 + Math.random() * 0.10, period: 12 + Math.random() * 8, phase: Math.random() * Math.PI * 2 },
            { amp: 0.08 + Math.random() * 0.08, period: 4  + Math.random() * 4, phase: Math.random() * Math.PI * 2 },
        ];
        horses.push({
            lane: i + 1,
            name: names[i],
            color: LANE_COLORS[i],
            finishTime: finishTimes[i],   // seconds to cover the full distance
            waves,
            progress: 0,        // 0..1 fraction of race distance
            finishedAt: null,
        });
    }
    return horses;
}

// Progress-at-time formula:
//   base rate = 1 / finishTime  (fraction per second)
//   speed(t) = baseRate * (1 + sum(waves))
//   progress(t) = ∫ speed dt, clamped to [0, 1]
// We use a numeric integration each frame (accumulate dt * speed).
function computeSpeedFactor(horse, t) {
    let f = 1;
    for (const w of horse.waves) {
        f += w.amp * Math.sin((t / w.period) * 2 * Math.PI + w.phase);
    }
    return Math.max(0.35, f);   // never fully stop
}

// Normalize each horse so its total distance at finishTime equals 1
// even with the sinusoidal waves. We do a quick 200-sample integration
// once at start and store a per-horse "targetSpeedScale" so cumulative
// noisy progress lands EXACTLY on 1.0 at finishTime.
function calibrateHorses() {
    for (const h of state.horses) {
        const N = 200;
        const dt = h.finishTime / N;
        let sum = 0;
        for (let i = 0; i < N; i++) {
            const t = (i + 0.5) * dt;
            sum += computeSpeedFactor(h, t) * dt;
        }
        h.speedScale = h.finishTime / sum;   // multiplier that makes ∫speed dt over finishTime = finishTime
        // So progress(t) = ∫ [1/finishTime] * speedFactor(t) * speedScale dt
        // At t = finishTime → progress = 1.0
    }
}

// ============================================================
// Countdown + main loop
// ============================================================
function startCountdown() {
    const overlay = document.getElementById('countdownOverlay');
    const num = document.getElementById('countdownNum');
    overlay.classList.remove('hidden');
    let n = 3;
    num.textContent = n;
    const iv = setInterval(() => {
        n--;
        if (n > 0) {
            num.textContent = n;
        } else {
            num.textContent = 'GO';
            setTimeout(() => {
                overlay.classList.add('hidden');
                clearInterval(iv);
                beginRace();
            }, 700);
        }
    }, 900);
}

function beginRace() {
    calibrateHorses();
    state.startTime = performance.now();
    state.running = true;
    state.finished = false;
    document.getElementById('hudStatus').textContent = 'And they\'re off!';
    requestAnimationFrame(tick);
}

function tick(now) {
    const elapsedMs = now - state.startTime;
    const t = elapsedMs / 1000;          // seconds since start
    // Advance every horse
    let allDone = true;
    for (const h of state.horses) {
        if (h.finishedAt !== null) continue;
        // progress = ∫ [1/finishTime * scale * speedFactor] dt evaluated at t
        // We recompute progress each frame by numerical integration from 0..t
        // (small horse count + short race makes this cheap).
        h.progress = computeProgress(h, Math.min(t, h.finishTime));
        if (h.progress >= 1.0) {
            h.progress = 1.0;
            h.finishedAt = h.finishTime;
        } else {
            allDone = false;
        }
    }
    drawTrack();
    updateHUD(t);
    updateStandings();
    if (t < 61 && !allDone) {
        requestAnimationFrame(tick);
    } else {
        // Force-finish any stragglers so we get a clean order
        for (const h of state.horses) {
            if (h.finishedAt === null) {
                h.finishedAt = t;
                h.progress = 1.0;
            }
        }
        drawTrack();
        finishRace();
    }
}

// Numerical integration of speed to produce progress up to time t.
// Cached per horse to avoid recomputing from 0 each frame.
function computeProgress(h, t) {
    if (!h._integ) h._integ = { lastT: 0, lastProgress: 0 };
    const step = 0.05;  // 50ms steps
    let { lastT, lastProgress } = h._integ;
    while (lastT + step <= t) {
        const midT = lastT + step/2;
        const speed = computeSpeedFactor(h, midT) * h.speedScale / h.finishTime;
        lastProgress += speed * step;
        lastT += step;
        if (lastProgress >= 1) { lastProgress = 1; break; }
    }
    // Final partial step
    if (lastT < t && lastProgress < 1) {
        const dt = t - lastT;
        const midT = lastT + dt/2;
        const speed = computeSpeedFactor(h, midT) * h.speedScale / h.finishTime;
        const p = lastProgress + speed * dt;
        h._integ = { lastT, lastProgress };   // don't advance cache into the partial
        return Math.min(1, p);
    }
    h._integ = { lastT, lastProgress };
    return Math.min(1, lastProgress);
}

// ============================================================
// Track rendering
// ============================================================
const canvas = document.getElementById('trackCanvas');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1;

function resizeCanvas() {
    dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    cw = rect.width;
    ch = rect.height;
    canvas.width = Math.max(1, Math.floor(cw * dpr));
    canvas.height = Math.max(1, Math.floor(ch * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', () => { resizeCanvas(); drawTrack(); });

// Oval track geometry — computed from canvas size
function trackGeom() {
    const pad = 30;
    const cx = cw / 2;
    const cy = ch / 2;
    // Number of lanes = horse count; each lane is a concentric oval.
    const n = state.horses.length || 8;
    const laneW = 14;                          // width per lane in px
    const outerR = Math.min(ch/2 - pad, 220);  // outer curve radius
    const innerR = Math.max(40, outerR - n * laneW);
    // Straight length = horizontal extent minus 2 curves
    const straight = Math.max(80, cw - pad*2 - outerR*2);
    return { cx, cy, outerR, innerR, straight, laneW, n };
}

// Given a lane number (1..n) and a progress fraction 0..1 (fraction of full lap),
// return {x, y, tangentAngle} for the horse marker along the oval midline of that lane.
function ovalPoint(lane, p) {
    const g = trackGeom();
    // lane 1 is outermost, lane n is innermost — visually more common for us
    const laneR = g.outerR - (lane - 0.5) * g.laneW;
    const perim = 2 * g.straight + 2 * Math.PI * laneR;
    const dist = p * perim;
    // Sections (running counterclockwise, start at right-center = finish line):
    //   0..straight  → top straight, moving LEFT
    //   straight..straight + πR → left curve
    //   straight + πR .. 2*straight + πR → bottom straight, moving RIGHT
    //   2*straight + πR .. 2*straight + 2πR → right curve, back to start
    const halfCurve = Math.PI * laneR;
    if (dist <= g.straight) {
        // Top straight — from right-top to left-top
        const x = g.cx + g.straight/2 - dist;
        const y = g.cy - laneR;
        return { x, y, angle: Math.PI };   // facing left
    }
    let d = dist - g.straight;
    if (d <= halfCurve) {
        // Left curve — half circle centered at (cx - straight/2, cy)
        const theta = d / laneR;    // 0..π
        const centerX = g.cx - g.straight/2;
        const x = centerX - Math.sin(theta) * laneR;
        // Start at top of left curve, sweep down to bottom
        const y = g.cy - Math.cos(theta) * laneR;
        return { x, y, angle: Math.PI + theta };
    }
    d -= halfCurve;
    if (d <= g.straight) {
        // Bottom straight — from left-bottom to right-bottom, moving right
        const x = g.cx - g.straight/2 + d;
        const y = g.cy + laneR;
        return { x, y, angle: 0 };
    }
    d -= g.straight;
    // Right curve — half circle from bottom back to top
    const theta = d / laneR;
    const centerX = g.cx + g.straight/2;
    const x = centerX + Math.sin(theta) * laneR;
    const y = g.cy + Math.cos(theta) * laneR;
    return { x, y, angle: theta };
}

function drawTrack() {
    if (!ctx) return;
    ctx.clearRect(0, 0, cw, ch);
    // Turf infield + surround
    const g = trackGeom();
    // Full background = darker grandstand green
    ctx.fillStyle = '#0f1e14';
    ctx.fillRect(0, 0, cw, ch);
    // Outer track surface (dirt) — draw the outermost oval as filled shape
    drawOvalFilled(g.cx, g.cy, g.outerR, g.straight, '#8b6f47');
    // Inner turf (fill the infield oval)
    drawOvalFilled(g.cx, g.cy, g.innerR, g.straight, '#3d7a52');
    // Turf detail — subtle horizontal stripes
    ctx.save();
    drawOvalPath(g.cx, g.cy, g.innerR, g.straight);
    ctx.clip();
    for (let y = 0; y < ch; y += 12) {
        ctx.fillStyle = (y / 12) % 2 === 0 ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.05)';
        ctx.fillRect(0, y, cw, 6);
    }
    ctx.restore();
    // Rails — inner + outer
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    drawOvalPath(g.cx, g.cy, g.outerR, g.straight); ctx.stroke();
    drawOvalPath(g.cx, g.cy, g.innerR, g.straight); ctx.stroke();
    // Lane markers — thin dashed lines between lanes
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.setLineDash([4, 4]);
    ctx.lineWidth = 1;
    for (let l = 1; l < g.n; l++) {
        const r = g.outerR - l * g.laneW;
        drawOvalPath(g.cx, g.cy, r, g.straight);
        ctx.stroke();
    }
    ctx.setLineDash([]);
    // Finish line — big checkered vertical band at 3 o'clock
    const finishX = g.cx + g.straight/2;
    const finishTop = g.cy - g.outerR;
    const finishBot = g.cy - g.innerR;
    const finishBot2 = g.cy + g.innerR;
    const finishBot3 = g.cy + g.outerR;
    // Track surface finish line — checkered pattern across the dirt band above
    drawCheckerLine(finishX, finishTop, finishX, finishBot, 8);
    drawCheckerLine(finishX, finishBot2, finishX, finishBot3, 8);
    // Finish flag inside infield
    ctx.fillStyle = '#dc2626';
    ctx.font = '900 14px "Copperplate Gothic Bold", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('FINISH', g.cx + g.straight/2 - 22, g.cy - 6);
    // Center infield logo — "DRAFT DAY DOWNS"
    ctx.fillStyle = 'rgba(212, 175, 55, 0.65)';
    ctx.font = `900 ${Math.min(g.straight * 0.09, 32)}px "Copperplate Gothic Bold", serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('DRAFT DAY DOWNS', g.cx, g.cy - 12);
    ctx.font = `700 ${Math.min(g.straight * 0.045, 14)}px "Copperplate Gothic Bold", serif`;
    ctx.fillStyle = 'rgba(212, 175, 55, 0.45)';
    ctx.fillText('EST. 2026 · 1 FURLONG', g.cx, g.cy + 14);

    // Horses
    for (const h of state.horses) {
        const pt = ovalPoint(h.lane, h.progress);
        drawHorse(pt.x, pt.y, h);
    }
}

// Oval path: an oval built from 2 straights + 2 semicircles
function drawOvalPath(cx, cy, r, straight) {
    ctx.beginPath();
    ctx.moveTo(cx + straight/2, cy - r);          // start top-right of straight
    ctx.lineTo(cx - straight/2, cy - r);          // top straight
    ctx.arc(cx - straight/2, cy, r, -Math.PI/2, Math.PI/2, true);  // left curve
    ctx.lineTo(cx + straight/2, cy + r);          // bottom straight
    ctx.arc(cx + straight/2, cy, r, Math.PI/2, -Math.PI/2, true);  // right curve
    ctx.closePath();
}
function drawOvalFilled(cx, cy, r, straight, color) {
    ctx.fillStyle = color;
    drawOvalPath(cx, cy, r, straight);
    ctx.fill();
}
function drawCheckerLine(x1, y1, x2, y2, boxSize) {
    // Vertical checkered band along the finish stripe
    const dist = Math.abs(y2 - y1);
    const cols = 3;
    const rows = Math.floor(dist / boxSize);
    const bandW = cols * boxSize;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const black = (r + c) % 2 === 0;
            ctx.fillStyle = black ? '#111' : '#fff';
            ctx.fillRect(x1 - bandW/2 + c * boxSize, y1 + r * boxSize, boxSize, boxSize);
        }
    }
}

// Draw a horse as a colored jockey silks bubble with lane number
function drawHorse(x, y, h) {
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.beginPath();
    ctx.ellipse(x, y + 8, 10, 3, 0, 0, Math.PI * 2);
    ctx.fill();
    // Silks body
    ctx.fillStyle = h.color;
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, 9, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // Lane number
    ctx.fillStyle = '#ffffff';
    ctx.font = '900 10px "Copperplate Gothic Bold", serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(h.lane, x, y + 0.5);
}

// ============================================================
// HUD + standings
// ============================================================
function updateHUD(t) {
    const remaining = Math.max(0, RACE_MS/1000 - t);
    const m = Math.floor(remaining / 60);
    const s = Math.floor(remaining % 60);
    document.getElementById('hudClock').textContent =
        `${m}:${String(s).padStart(2, '0')}`;
    // Current leader
    const order = orderedHorses();
    if (order.length) {
        document.getElementById('hudLeader').textContent = `#${order[0].lane} ${order[0].name}`;
    }
    const nFin = state.horses.filter(h => h.finishedAt !== null).length;
    if (nFin === 0) document.getElementById('hudStatus').textContent = 'Down the Backstretch';
    else if (nFin < state.horses.length) document.getElementById('hudStatus').textContent = `${nFin} Across`;
}

function orderedHorses() {
    // Sort: finishers first by finishedAt asc; unfinished by progress desc
    return [...state.horses].sort((a, b) => {
        if (a.finishedAt !== null && b.finishedAt !== null) return a.finishedAt - b.finishedAt;
        if (a.finishedAt !== null) return -1;
        if (b.finishedAt !== null) return 1;
        return b.progress - a.progress;
    });
}

function updateStandings() {
    const el = document.getElementById('standingsList');
    const order = orderedHorses();
    let html = '';
    order.forEach((h, idx) => {
        const place = idx + 1;
        const finished = h.finishedAt !== null;
        const pctOrTime = finished
            ? `${h.finishedAt.toFixed(2)}s`
            : `${(h.progress * 100).toFixed(0)}%`;
        html += `<div class="standings-row ${idx === 0 ? 'first' : ''}" data-lane="${h.lane}">
            <span class="place">${place}</span>
            <span class="dot" style="background:${h.color};"></span>
            <span class="name">#${h.lane} ${h.name}</span>
            <span class="pct">${pctOrTime}</span>
        </div>`;
    });
    el.innerHTML = html;
}

// ============================================================
// Finish screen
// ============================================================
function finishRace() {
    state.running = false;
    state.finished = true;
    const order = orderedHorses();
    const list = document.getElementById('draftList');
    let html = '';
    order.forEach((h, idx) => {
        const place = idx + 1;
        const medal = place === 1 ? 'gold' : place === 2 ? 'silver' : place === 3 ? 'bronze' : '';
        html += `<li class="${medal}">
            <span class="pick">Pick ${place}</span>
            <span class="dot" style="background:${h.color};"></span>
            <span class="who">#${h.lane} · ${h.name}</span>
            <span class="time">${h.finishedAt.toFixed(2)}s</span>
        </li>`;
    });
    list.innerHTML = html;
    document.getElementById('resultsTitle').textContent = `${order[0].name} wins!`;
    setTimeout(() => {
        document.getElementById('raceScreen').classList.add('hidden');
        document.getElementById('resultsScreen').classList.remove('hidden');
    }, 1500);
}

// Rerun
document.getElementById('againBtn').addEventListener('click', () => {
    // Clear per-race state, keep names
    state.horses = [];
    state.running = false;
    state.finished = false;
    document.getElementById('resultsScreen').classList.add('hidden');
    document.getElementById('setupScreen').classList.remove('hidden');
});
</script>
