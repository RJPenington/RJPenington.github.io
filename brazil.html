<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rio 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04070a;
    --card: #0a1410;
    --card2: #0d1a14;
    --line: #15402a;
    --green: #009c3b;
    --neon: #39ff7a;
    --neon-dim: rgba(57, 255, 122, 0.35);
    --yellow: #ffdf00;
    --blue: #1d4ed8;
    --blue-deep: #002776;
    --ink: #eaf7ee;
    --dim: #8fb39c;
    --red: #ff5d5d;
    --forest: #0e3b22;
    --forest-hi: #145431;
    --glow-blue: #2563eb;
    --glow-blue-soft: rgba(37, 99, 235, 0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { scrollbar-color: #1a2a20 #050806; scrollbar-width: thin; }
  ::-webkit-scrollbar { width: 10px; height: 8px; }
  ::-webkit-scrollbar-track { background: #050806; }
  ::-webkit-scrollbar-thumb { background: #1a2a20; border-radius: 6px; border: 2px solid #050806; }
  ::-webkit-scrollbar-thumb:hover { background: #24402f; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 0%, rgba(0, 156, 59, 0.18), transparent 55%),
      radial-gradient(ellipse at 80% 100%, rgba(0, 39, 118, 0.25), transparent 55%);
  }
  a { color: var(--neon); }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 14px 60px; }

  /* ===== Header: waving flag + dancer ===== */
  header {
    display: flex; align-items: center; justify-content: center; gap: 22px;
    padding: 26px 10px 22px; flex-wrap: wrap;
  }
  /* Header portrait, left of the flag: transparent cutout, bottom edge
     fades into the page so the crop line never shows */
  .guy-box {
    width: 182px; height: 182px; flex: 0 0 auto;
    filter: drop-shadow(0 0 14px var(--neon-dim)) drop-shadow(0 0 3px rgba(255, 223, 0, 0.35));
  }
  .guy-box img {
    width: 100%; height: 100%; object-fit: contain; display: block;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 78%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 78%, transparent 100%);
  }
  .flag-box {
    width: 260px; height: 182px; flex: 0 0 auto;
    filter: drop-shadow(0 0 18px var(--neon-dim)) drop-shadow(0 0 2px rgba(255, 223, 0, 0.5));
    animation: flagSway 5s ease-in-out infinite;
    transform-origin: left center;
  }
  .flag-box svg { width: 100%; height: 100%; overflow: visible; }
  @keyframes flagSway {
    0%   { transform: rotate(-1.2deg) skewY(0.6deg); }
    50%  { transform: rotate(1.2deg) skewY(-0.6deg); }
    100% { transform: rotate(-1.2deg) skewY(0.6deg); }
  }
  .title-box { text-align: center; min-width: 220px; }
  .title-box h1 {
    font-family: 'Bebas Neue', Impact, sans-serif;
    font-size: clamp(2.6rem, 8vw, 4.6rem); letter-spacing: 0.08em; margin: 0; line-height: 1;
    color: var(--yellow);
    text-shadow: 0 0 12px rgba(255, 223, 0, 0.45), 0 0 30px var(--neon-dim);
  }
  .title-box .sub {
    font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.2em; font-size: 1.1rem;
    color: var(--neon); text-shadow: 0 0 10px var(--neon-dim);
  }
  .title-box .dates { color: var(--dim); font-size: 0.85rem; margin-top: 6px; }
  /* Pole dancer: stylized silhouette orbiting a pole */
  .dancer {
    width: 96px; height: 182px; flex: 0 0 auto; position: relative;
    perspective: 420px;
    filter: drop-shadow(0 0 14px var(--neon-dim));
  }
  .dancer .pole {
    position: absolute; left: 50%; top: 4px; bottom: 4px; width: 5px; margin-left: -2.5px;
    background: linear-gradient(90deg, #6b7a6f, #e8f5ee 45%, #6b7a6f);
    border-radius: 3px; box-shadow: 0 0 10px rgba(255, 255, 255, 0.35);
  }
  .dancer .pole::before, .dancer .pole::after {
    content: ''; position: absolute; left: -9px; width: 23px; height: 6px; border-radius: 50%;
    background: #9fb5a6;
  }
  .dancer .pole::before { top: -3px; }
  .dancer .pole::after { bottom: -3px; }
  .dancer .figure {
    position: absolute; left: 50%; top: 22px; width: 90px; height: 120px; margin-left: -45px;
    transform-style: preserve-3d;
    animation: orbit 3.2s linear infinite;
  }
  .dancer .figure svg { width: 100%; height: 100%; fill: var(--yellow); filter: drop-shadow(0 0 6px rgba(255, 223, 0, 0.5)); }
  .dancer .glow {
    position: absolute; left: 50%; bottom: -2px; width: 80px; height: 14px; margin-left: -40px;
    border-radius: 50%; background: var(--neon); opacity: 0.35; filter: blur(8px);
    animation: glowPulse 3.2s ease-in-out infinite;
  }
  @keyframes orbit {
    0%   { transform: rotateY(0deg) translateZ(26px); }
    100% { transform: rotateY(360deg) translateZ(26px); }
  }
  @keyframes glowPulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) {
    .flag-box, .dancer .figure, .dancer .glow { animation: none; }
  }

  /* ===== Tabs ===== */
  .tabs { display: flex; gap: 10px; justify-content: center; margin: 22px 0 28px; flex-wrap: wrap; }
  .tab {
    font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.12em; font-size: 1.25rem;
    padding: 10px 22px; border-radius: 999px; cursor: pointer; user-select: none;
    background: var(--card); color: var(--dim); border: 1px solid var(--line);
    transition: all 0.15s ease;
  }
  .tab:hover { color: var(--ink); border-color: var(--glow-blue); }
  .tab.active {
    color: var(--ink); background: linear-gradient(180deg, var(--forest-hi), var(--forest));
    border: 2px solid var(--glow-blue);
    box-shadow: 0 0 18px var(--glow-blue-soft), 0 0 42px rgba(37, 99, 235, 0.3), inset 0 0 14px rgba(57, 255, 122, 0.12);
    text-shadow: 0 0 8px rgba(57, 255, 122, 0.35);
  }
  .subtabs {
    display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 12px; margin-bottom: 18px;
    -webkit-overflow-scrolling: touch; scrollbar-width: thin;
  }
  .subtab {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 8px; cursor: pointer; font-size: 0.82rem; font-weight: 600;
    background: var(--card); color: var(--dim); border: 1px solid var(--line); white-space: nowrap;
  }
  .subtab { text-align: center; }
  .subtab small { display: block; font-weight: 400; font-size: 0.68rem; color: var(--dim); }
  .subtab.active {
    color: var(--ink); border-color: var(--glow-blue); background: linear-gradient(180deg, var(--forest-hi), var(--forest));
    box-shadow: 0 0 12px var(--glow-blue-soft), 0 0 26px rgba(37, 99, 235, 0.25);
  }
  .subtab.active small { color: var(--neon); }
  .subtab.add { border-color: var(--neon); color: var(--neon); }
  .subtab.add.active { color: var(--ink); }
  .subtab .cnt { display: inline-block; min-width: 18px; margin-left: 6px; padding: 0 5px; border-radius: 9px; font-size: 0.68rem; background: var(--line); color: var(--ink); text-align: center; }

  /* ===== Cards ===== */
  .card {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--line); border-radius: 14px; padding: 16px 16px 14px; margin-bottom: 14px;
    box-shadow: 0 0 0 1px rgba(57, 255, 122, 0.08), 0 0 24px rgba(57, 255, 122, 0.10), inset 0 0 40px rgba(0, 156, 59, 0.06);
  }
  .card h2 {
    font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.1em; font-size: 1.7rem; margin: 0 0 4px;
    color: var(--ink);
  }
  .card h2 .wk { color: var(--yellow); }
  .card h2 .d { color: var(--neon); }
  .card .meta { color: var(--dim); font-size: 0.8rem; margin-bottom: 10px; }
  .stripe { height: 3px; border-radius: 2px; margin: 0 0 12px; background: linear-gradient(90deg, var(--green), var(--yellow) 50%, var(--blue)); opacity: 0.9; }

  /* Activities */
  .act { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid rgba(21, 64, 42, 0.7); }
  .act:first-of-type { border-top: 0; }
  .act .time {
    flex: 0 0 auto; min-width: 64px; text-align: center; padding: 3px 8px; border-radius: 6px; font-size: 0.72rem; font-weight: 700;
    background: rgba(29, 78, 216, 0.25); color: #9fc0ff; border: 1px solid rgba(29, 78, 216, 0.5);
  }
  .act .time.none { opacity: 0.45; }
  .act .body { flex: 1 1 auto; min-width: 0; line-height: 1.45; font-size: 0.95rem; white-space: pre-wrap; word-wrap: break-word; }
  .act .by { color: var(--dim); font-size: 0.7rem; margin-top: 3px; }
  .act .btns { flex: 0 0 auto; display: flex; gap: 4px; }
  .ibtn {
    width: 30px; height: 30px; border-radius: 7px; border: 1px solid var(--line); background: #0a120e; color: var(--dim);
    cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; justify-content: center;
  }
  .ibtn:hover { color: var(--ink); border-color: var(--glow-blue); background: var(--forest); box-shadow: 0 0 8px var(--glow-blue-soft); }
  .ibtn.del:hover { color: var(--red); border-color: var(--red); }
  .act textarea { width: 100%; }
  .act .editbar { display: flex; gap: 6px; margin-top: 6px; }
  .empty { color: var(--dim); font-style: italic; padding: 8px 0; }

  /* Forms */
  label.f { display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); margin: 10px 0 4px; }
  input, select, textarea, button {
    font-family: inherit; font-size: 1rem; color: var(--ink);
  }
  input, select, textarea {
    width: 100%; background: #060d09; border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px;
    outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--neon); box-shadow: 0 0 0 2px var(--neon-dim); }
  textarea { min-height: 96px; resize: vertical; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    display: inline-block; padding: 11px 20px; border-radius: 10px; border: 2px solid var(--glow-blue); cursor: pointer;
    background: linear-gradient(180deg, var(--forest-hi), var(--forest)); color: var(--ink); font-weight: 800; letter-spacing: 0.04em; margin-top: 12px;
    box-shadow: 0 0 16px var(--glow-blue-soft), 0 0 34px rgba(37, 99, 235, 0.25);
    text-shadow: 0 0 8px rgba(57, 255, 122, 0.35);
  }
  .btn:hover { background: linear-gradient(180deg, #1a6a3e, var(--forest-hi)); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn.ghost { background: transparent; color: var(--ink); box-shadow: none; border-color: var(--line); }
  .btn.ghost:hover { border-color: var(--glow-blue); }
  .btn.small { padding: 6px 12px; font-size: 0.85rem; margin-top: 0; }
  .toast { margin-top: 10px; color: var(--neon); font-size: 0.9rem; min-height: 1.2em; }

  /* Money */
  .money-head { display: grid; grid-template-columns: 34px 1fr 108px 108px 28px 30px; gap: 8px; padding: 0 2px 6px; color: var(--dim); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .mrow { display: grid; grid-template-columns: 34px 1fr 108px 108px 28px 30px; gap: 8px; align-items: center; margin: 6px 0; }
  .mrow .ibtn, .prow .ibtn { width: 30px; height: 30px; }
  .mrow input.amt.derived { color: var(--dim); border-style: dashed; }
  .mrow input.amt::placeholder { color: #3f5a49; }
  /* No spinner arrows on any number box */
  input[type="number"] { -moz-appearance: textfield; appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button, input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .ptotal .pair { text-align: right; }
  .ptotal .pair .big { display: block; line-height: 1; }
  .ptotal .pair .brl { display: block; color: var(--neon); font-size: 0.95rem; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .tscroll table.data th, .tscroll table.data td { white-space: nowrap; }
  .sub2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 4px 0 10px; }
  .sub2 .box { background: rgba(0, 0, 0, 0.3); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .sub2 .lbl { color: var(--dim); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
  .sub2 .val { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 1.8rem; letter-spacing: 0.04em; line-height: 1.1; }
  .sub2 .val.usd { color: var(--yellow); } .sub2 .val.brl { color: var(--neon); }
  .sub2 .each { color: var(--dim); font-size: 0.78rem; }
  .mrow .n { color: var(--dim); font-size: 0.8rem; text-align: right; }
  .mrow input, .mrow select { padding: 8px 10px; }
  .mrow input.amt { text-align: right; font-variant-numeric: tabular-nums; }
  .mrow .st { width: 22px; height: 22px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.8rem; }
  .st.saved { color: var(--neon); }
  .st.saving { color: var(--yellow); }
  .st.err { color: var(--red); }
  .ptotal { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .ptotal .big { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 1.9rem; color: var(--yellow); letter-spacing: 0.05em; }
  table.data { width: 100%; border-collapse: collapse; margin-top: 6px; }
  table.data th, table.data td { padding: 9px 8px; text-align: left; border-bottom: 1px solid rgba(21, 64, 42, 0.7); font-size: 0.92rem; }
  table.data th { color: var(--dim); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; }
  table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pos { color: var(--neon); } .neg { color: var(--red); } .zero { color: var(--dim); }
  .settle { margin-top: 10px; }
  .settle .line { padding: 8px 10px; border-radius: 8px; background: rgba(29, 78, 216, 0.15); border: 1px solid rgba(29, 78, 216, 0.4); margin: 6px 0; }
  .who { font-weight: 800; }
  .who.mike { color: var(--yellow); } .who.rj { color: var(--neon); } .who.tyler { color: #7fa7ff; }
  .rate { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .rate > div { flex: 1 1 140px; }
  .hint { color: var(--dim); font-size: 0.78rem; margin-top: 6px; }

  /* Pack list */
  .prow { display: grid; grid-template-columns: 34px 30px 1fr 28px 30px; gap: 8px; align-items: center; margin: 6px 0; }
  .prow .n { color: var(--dim); font-size: 0.8rem; text-align: right; }
  .prow input[type="checkbox"] { width: 22px; height: 22px; accent-color: var(--neon); cursor: pointer; margin: 0 auto; display: block; }
  .prow input.item { padding: 8px 10px; }
  .prow.packed input.item { color: var(--dim); text-decoration: line-through; }
  .packbar { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .packbar .big { font-family: 'Bebas Neue', Impact, sans-serif; font-size: 1.6rem; color: var(--neon); letter-spacing: 0.05em; }
  .banner { padding: 10px 14px; border-radius: 10px; font-size: 0.85rem; margin: 0 0 12px; border: 1px solid; }
  .banner.warn { background: rgba(255, 223, 0, 0.08); border-color: rgba(255, 223, 0, 0.5); color: #ffe866; }
  .banner.err { background: rgba(255, 93, 93, 0.08); border-color: rgba(255, 93, 93, 0.5); color: #ff9c9c; }
  .notes h3 { font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.1em; font-size: 1.25rem; color: var(--yellow); margin: 14px 0 4px; }
  .notes ul { margin: 0 0 6px 18px; padding: 0; line-height: 1.6; }
  footer { text-align: center; color: var(--dim); font-size: 0.75rem; margin-top: 30px; }
  .hidden { display: none !important; }

  @media (max-width: 640px) {
    header { gap: 10px; padding: 18px 10px 16px; }
    .tabs { margin: 16px 0 22px; }
    .flag-box { width: 200px; height: 140px; }
    .guy-box { width: 140px; height: 140px; }
    .dancer { width: 70px; height: 140px; }
    .dancer .figure { width: 66px; height: 90px; margin-left: -33px; top: 18px; }
    .row2 { grid-template-columns: 1fr; }
    .money-head { display: none; }
    .mrow { grid-template-columns: 20px 1fr 78px 78px 16px 28px; gap: 4px; }
    .mrow .ibtn, .prow .ibtn { width: 28px; height: 28px; }
    .mrow .n { font-size: 0.7rem; }
    .mrow input, .mrow select { padding: 8px 6px; font-size: 0.9rem; }
    .prow { grid-template-columns: 22px 26px 1fr 18px 28px; gap: 4px; }
    .act .time { min-width: 54px; font-size: 0.66rem; }
  }
</style>
</head>

/* ===== Helpers ===== */
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function dayParts(iso) {
  const m = String(iso).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
  return { weekday: WEEKDAYS[d.getDay()], month: MONTHS[d.getMonth()], dom: d.getDate(), short: WEEKDAYS[d.getDay()].slice(0, 3) };
}
function dayLabel(iso) { const p = dayParts(iso); return `${p.weekday}, ${p.month} ${p.dom}`; }
function dayShort(iso) { const p = dayParts(iso); return `${p.short} ${p.dom}`; }
function money(n) {
  const v = Number(n) || 0;
  return (v < 0 ? '-' : '') + '$' + Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function reais(n) {
  const v = Number(n) || 0;
  return (v < 0 ? '-' : '') + 'R$ ' + Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fromUsd(usd, currency, rate) {
  const a = Number(usd) || 0;
  return currency === 'BRL' ? a * rate : a;
}
// Cash-register entry: digits fill in from the right, so typing 1 2 5 0
// reads 0.01, 0.12, 1.25, 12.50. Returns the display string ('' when empty).
function centsDisplay(raw) {
  const digits = String(raw || '').replace(/\D/g, '').replace(/^0+/, '');
  if (!digits) return '';
  return (Number(digits) / 100).toFixed(2);
}
function todayIso() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function toUsd(amount, currency, rate) {
  const a = Number(amount) || 0;
  if (currency === 'BRL') return rate > 0 ? a / rate : 0;
  return a;
}

/* ===== Storage: shared Supabase first, this-device fallback ===== */
async function sb(path, opts) {
  opts = opts || {};
  const headers = {
    'apikey': SUPABASE_ANON_KEY,
    'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
    'Content-Type': 'application/json',
    'Prefer': opts.prefer || 'return=representation',
  };
  const res = await fetch(SUPABASE_URL + path, {
    method: opts.method || 'GET', headers,
    body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
  });
  if (!res.ok) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 300); } catch (e) { /* unreadable */ }
    const err = new Error('Supabase ' + res.status + (detail ? ': ' + detail : ''));
    err.status = res.status; err.detail = detail;
    throw err;
  }
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

const LS = {
  get(k, fallback) { try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};

const store = {
  mode: 'checking',   // 'live' | 'local'
  reason: '',
  async probe() {
    try {
      await sb('/rest/v1/brazil_activities?select=id&limit=1');
      await sb('/rest/v1/brazil_charges?select=id&limit=1');
      await sb('/rest/v1/brazil_settings?select=key&limit=1');
      await sb('/rest/v1/brazil_packing?select=id&limit=1');
      this.mode = 'live';
    } catch (e) {
      this.mode = 'local';
      this.reason = (e && (e.status === 404 || /PGRST205|does not exist|relation/i.test(e.detail || '')))
        ? 'The shared tables are not set up yet (run SUPABASE_SETUP.sql in the Supabase SQL editor). Saving on this device only until then.'
        : 'Could not reach the shared database. Saving on this device only until it is back.';
      if (LS.get('brazil_activities', null) === null) {
        LS.set('brazil_activities', SEED.map((s, i) => ({ id: 'seed-' + (i + 1), ...s, created_at: '2026-11-12T00:00:00Z' })));
      }
      if (LS.get('brazil_packing', null) === null) {
        LS.set('brazil_packing', PACK_SEED.map((item, i) => ({ owner: 'group', slot: i + 1, item, packed: false })));
      }
    }
  },

  /* activities */
  async listActivities() {
    if (this.mode === 'live') return await sb('/rest/v1/brazil_activities?select=*&order=day.asc,created_at.asc');
    return LS.get('brazil_activities', []);
  },
  async addActivity(a) {
    if (this.mode === 'live') return await sb('/rest/v1/brazil_activities', { method: 'POST', body: [a] });
    const list = LS.get('brazil_activities', []);
    list.push({ id: 'loc-' + Date.now(), created_at: new Date().toISOString(), ...a });
    LS.set('brazil_activities', list);
  },
  async updateActivity(id, fields) {
    if (this.mode === 'live') return await sb('/rest/v1/brazil_activities?id=eq.' + encodeURIComponent(id), { method: 'PATCH', body: fields });
    const list = LS.get('brazil_activities', []);
    const i = list.findIndex(x => String(x.id) === String(id));
    if (i >= 0) { Object.assign(list[i], fields); LS.set('brazil_activities', list); }
  },
  async deleteActivity(id) {
    if (this.mode === 'live') return await sb('/rest/v1/brazil_activities?id=eq.' + encodeURIComponent(id), { method: 'DELETE', prefer: 'return=minimal' });
    LS.set('brazil_activities', LS.get('brazil_activities', []).filter(x => String(x.id) !== String(id)));
  },

  /* charges: one row per (person, slot) */
  async listCharges() {
    if (this.mode === 'live') return await sb('/rest/v1/brazil_charges?select=*&order=person.asc,slot.asc');
    return LS.get('brazil_charges', []);
  },
  async upsertCharge(row) {
    if (this.mode === 'live') {
      return await sb('/rest/v1/brazil_charges?on_conflict=person,slot', {
        method: 'POST', body: [row], prefer: 'resolution=merge-duplicates,return=representation',
      });
    }
    const list = LS.get('brazil_charges', []).filter(x => !(x.person === row.person && x.slot === row.slot));
    list.push({ ...row, updated_at: new Date().toISOString() });
    LS.set('brazil_charges', list);
  },
  async deleteCharge(person, slot) {
    if (this.mode === 'live') {
      return await sb('/rest/v1/brazil_charges?person=eq.' + encodeURIComponent(person) + '&slot=eq.' + slot, { method: 'DELETE', prefer: 'return=minimal' });
    }
    LS.set('brazil_charges', LS.get('brazil_charges', []).filter(x => !(x.person === person && x.slot === slot)));
  },

  /* packing: one row per (owner, slot) */
  async listPacking() {
    if (this.mode === 'live') return await sb('/rest/v1/brazil_packing?select=*&order=owner.asc,slot.asc');
    return LS.get('brazil_packing', []);
  },
  async upsertPacking(row) {
    if (this.mode === 'live') {
      return await sb('/rest/v1/brazil_packing?on_conflict=owner,slot', {
        method: 'POST', body: [row], prefer: 'resolution=merge-duplicates,return=representation',
      });
    }
    const list = LS.get('brazil_packing', []).filter(x => !(x.owner === row.owner && x.slot === row.slot));
    list.push({ ...row });
    LS.set('brazil_packing', list);
  },
  async deletePacking(owner, slot) {
    if (this.mode === 'live') {
      return await sb('/rest/v1/brazil_packing?owner=eq.' + encodeURIComponent(owner) + '&slot=eq.' + slot, { method: 'DELETE', prefer: 'return=minimal' });
    }
    LS.set('brazil_packing', LS.get('brazil_packing', []).filter(x => !(x.owner === owner && x.slot === slot)));
  },

  /* settings */
  async getRate() {
    if (this.mode === 'live') {
      const rows = await sb('/rest/v1/brazil_settings?key=eq.brl_rate&select=value');
      const v = rows && rows[0] ? Number(rows[0].value) : NaN;
      return isNaN(v) || v <= 0 ? DEFAULT_RATE : v;
    }
    const v = Number(LS.get('brazil_rate', DEFAULT_RATE));
    return isNaN(v) || v <= 0 ? DEFAULT_RATE : v;
  },
  async setRate(v) {
    if (this.mode === 'live') {
      return await sb('/rest/v1/brazil_settings?on_conflict=key', {
        method: 'POST', body: [{ key: 'brl_rate', value: String(v) }], prefer: 'resolution=merge-duplicates,return=representation',
      });
    }
    LS.set('brazil_rate', v);
  },
};

    ${rows}
    <div class="ptotal"><span class="meta" style="margin:0">Total paid by ${esc(p.name)}</span>
      <span class="pair"><span class="big" id="ptotal-${p.key}">${money(paid)}</span><span class="brl" id="ptotalbrl-${p.key}">${reais(paid * RATE)}</span></span></div>
  </div>`;
}
function subtotalHtml() {
  const paid = PEOPLE.map(p => ({ ...p, paid: personPaidUsd(p.key) }));
  const total = paid.reduce((s, p) => s + p.paid, 0);
  const share = total / PEOPLE.length;
  const bal = paid.map(p => ({ ...p, bal: p.paid - share }));
  const cls = v => Math.abs(v) < 0.005 ? 'zero' : (v > 0 ? 'pos' : 'neg');
  const sgn = v => (v > 0.005 ? '+' : '');
  const rows = bal.map(p => `<tr>
      <td><span class="who ${p.key}">${esc(p.name)}</span></td>
      <td class="num">${money(p.paid)}</td>
      <td class="num">${reais(p.paid * RATE)}</td>
      <td class="num ${cls(p.bal)}">${sgn(p.bal)}${money(p.bal)}</td>
      <td class="num ${cls(p.bal)}">${sgn(p.bal)}${reais(p.bal * RATE)}</td>
      <td>${Math.abs(p.bal) < 0.005 ? 'even' : (p.bal > 0 ? 'is owed' : 'owes')}</td>
    </tr>`).join('');
  // Settle up: whoever is below their share pays whoever is above it
  const debtors = bal.filter(p => p.bal < -0.005).map(p => ({ ...p, left: -p.bal })).sort((a, b) => b.left - a.left);
  const creditors = bal.filter(p => p.bal > 0.005).map(p => ({ ...p, left: p.bal })).sort((a, b) => b.left - a.left);
  const lines = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const amt = Math.min(debtors[i].left, creditors[j].left);
    if (amt > 0.005) lines.push(`<div class="line"><span class="who ${debtors[i].key}">${esc(debtors[i].name)}</span> pays <span class="who ${creditors[j].key}">${esc(creditors[j].name)}</span> <strong>${money(amt)}</strong> <span class="zero">(${reais(amt * RATE)})</span></div>`);
    debtors[i].left -= amt; creditors[j].left -= amt;
    if (debtors[i].left < 0.005) i++;
    if (creditors[j].left < 0.005) j++;
  }
  const nCharges = CHARGES.filter(c => (Number(c.amount) || 0) > 0).length;
  return `<div class="card">
    <h2>Who is <span class="d">up</span>, who <span class="wk">owes</span></h2>
    <div class="meta">${nCharges} charges logged, converted at R$ ${esc(RATE)} per dollar.</div>
    <div class="stripe"></div>
    <div class="sub2">
      <div class="box"><div class="lbl">Group total, USD</div><div class="val usd">${money(total)}</div><div class="each">${money(share)} each</div></div>
      <div class="box"><div class="lbl">Group total, R$</div><div class="val brl">${reais(total * RATE)}</div><div class="each">${reais(share * RATE)} each</div></div>
    </div>
    <div class="tscroll"><table class="data">
      <thead><tr><th>Person</th><th class="num">Paid $</th><th class="num">Paid R$</th><th class="num">Balance $</th><th class="num">Balance R$</th><th></th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
    <div class="settle">
      ${lines.length ? lines.join('') : '<div class="empty">Everyone is square.</div>'}
    </div>
  </div>
  <div class="card">
    <h2>Exchange <span class="d">rate</span></h2>
    <div class="meta">Reais per 1 US dollar. Every R$ figure on the money tabs uses this number.</div>
    <div class="stripe"></div>
    <div class="rate">
      <div><label class="f">Reais per 1 USD</label><input id="rateInput" type="number" step="0.01" min="0.5" inputmode="decimal" value="${esc(RATE)}"></div>
      <div><button class="btn" style="margin-top:0" onclick="saveRate()">Save rate</button></div>
    </div>
    <div class="hint">R$ 100 is ${money(toUsd(100, 'BRL', RATE))} and $100 is ${reais(100 * RATE)} at this rate. <span id="rateToast" class="pos"></span></div>
  </div>`;
}
window.saveRate = async function() {
  const v = Number(document.getElementById('rateInput').value);
  const t = document.getElementById('rateToast');
  if (!(v > 0)) { t.textContent = 'Enter a rate above zero.'; return; }
  try { await store.setRate(v); RATE = v; renderMoney(); }
  catch (e) { t.textContent = 'Could not save: ' + (e.message || e); }
};

const SAVE_DEBOUNCE_MS = 700;
function wireMoneyRows() {
  document.querySelectorAll('.mrow').forEach(row => {
    const brl = row.querySelector('.amt.brl');
    const usd = row.querySelector('.amt.usd');
    const schedule = () => {
      clearTimeout(row._t);
      setSt(row, 'saving');
      row._t = setTimeout(() => saveMoneyRow(row), SAVE_DEBOUNCE_MS);
    };
    row.querySelector('.desc').addEventListener('input', schedule);
    const onAmount = (srcEl, otherEl, srcCur) => () => {
      // Cash-register formatting on the box being typed in
      srcEl.value = centsDisplay(srcEl.value);
      srcEl.classList.remove('derived');
      if (srcEl.value === '') {
        otherEl.value = ''; otherEl.classList.remove('derived'); row.dataset.src = '';
      } else {
        const v = Number(srcEl.value);
        const other = srcCur === 'BRL' ? (RATE > 0 ? v / RATE : 0) : v * RATE;
        otherEl.value = other.toFixed(2);
        otherEl.classList.add('derived');
        row.dataset.src = srcCur;
      }
      schedule();
    };
    brl.addEventListener('input', onAmount(brl, usd, 'BRL'));
    usd.addEventListener('input', onAmount(usd, brl, 'USD'));
  });
}
function setSt(row, state) {
  const el = row.querySelector('.st');
  el.className = 'st' + (state ? ' ' + state : '');
  el.innerHTML = state === 'saved' ? '&#10003;' : state === 'saving' ? '&#8230;' : state === 'err' ? '!' : '';
  el.title = state === 'err' ? 'Not saved, check connection and type again' : '';
}
async function saveMoneyRow(row) {
  const person = row.dataset.person, slot = Number(row.dataset.slot);
  const desc = row.querySelector('.desc').value.trim();
  const src = row.dataset.src === 'BRL' ? 'BRL' : (row.dataset.src === 'USD' ? 'USD' : '');
  const srcEl = src === 'BRL' ? row.querySelector('.amt.brl') : row.querySelector('.amt.usd');
  const raw = src ? srcEl.value.trim() : '';
  const amount = raw === '' ? null : Number(raw);
  try {
    if (!desc && amount === null) {
      await store.deleteCharge(person, slot);
      setSt(row, '');
    } else {
      await store.upsertCharge({ person, slot, description: desc, amount: amount === null || isNaN(amount) ? null : amount, currency: src || 'USD' });
      setSt(row, 'saved');
    }
    CHARGES = await store.listCharges();
    const paid = personPaidUsd(person);
    const tot = document.getElementById('ptotal-' + person);
    if (tot) tot.textContent = money(paid);
    const totB = document.getElementById('ptotalbrl-' + person);
    if (totB) totB.textContent = reais(paid * RATE);
    // refresh the per-person subtab totals without rebuilding the inputs
    document.querySelectorAll('#money .subtab[data-sub]').forEach(s => {
      const p = PEOPLE.find(x => x.key === s.dataset.sub);
      if (p) { const sm = s.querySelector('small'); if (sm) sm.textContent = money(personPaidUsd(p.key)); }
    });
  } catch (e) {
    setSt(row, 'err');
  }
}

// Trash button on a money row: wipe the boxes and remove the saved entry
window.clearMoneyRow = async function(btn) {
  const row = btn.closest('.mrow');
  if (!row) return;
  const desc = row.querySelector('.desc'), brl = row.querySelector('.amt.brl'), usd = row.querySelector('.amt.usd');
  const hadContent = desc.value.trim() || brl.value.trim() || usd.value.trim();
  if (!hadContent) return;
  if (!confirm('Delete this entry for everyone?' + (desc.value.trim() ? '\n\n' + desc.value.trim() : ''))) return;
  clearTimeout(row._t);
  desc.value = ''; brl.value = ''; usd.value = '';
  brl.classList.remove('derived'); usd.classList.remove('derived');
  row.dataset.src = '';
  await saveMoneyRow(row);
};

/* ===== Pack list ===== */
function packFor(owner) {
  const map = new Map();
  for (const r of PACKING) if (r.owner === owner) map.set(Number(r.slot), r);
  return map;
}
function packCounts(owner) {
  let total = 0, packed = 0;
  for (const r of PACKING) if (r.owner === owner && (r.item || '').trim()) { total++; if (r.packed) packed++; }
  return { total, packed };
}
function renderPack() {
  const el = document.getElementById('pack');
  const subs = PACK_OWNERS.map(o => {
    const c = packCounts(o.key);
    return `<div class="subtab${packSub === o.key ? ' active' : ''}" data-sub="${o.key}">${esc(o.name)}<small>${c.packed}/${c.total} packed</small></div>`;
  }).join('');
  const o = PACK_OWNERS.find(x => x.key === packSub) || PACK_OWNERS[0];
  const map = packFor(o.key);
  let rows = '';
  for (let i = 1; i <= PACK_SLOTS; i++) {
    const r = map.get(i);
    const item = r ? r.item || '' : '';
    const packed = !!(r && r.packed);
    rows += `<div class="prow${packed ? ' packed' : ''}" data-owner="${o.key}" data-slot="${i}">
      <div class="n">${i}</div>
      <input type="checkbox" class="chk"${packed ? ' checked' : ''} title="Packed" aria-label="Packed">
      <input class="item" placeholder="${o.key === 'group' ? 'Something we bring as a group' : 'Something to bring'}" value="${esc(item)}" autocomplete="off">
      <span class="st${r ? ' saved' : ''}">${r ? '&#10003;' : ''}</span>
      <button class="ibtn del" title="Delete this item" aria-label="Delete" onclick="clearPackRow(this)">&#10005;</button>
    </div>`;
  }
  const c = packCounts(o.key);
  const title = o.key === 'group'
    ? `<h2>Bring <span class="d">together</span></h2><div class="meta">Shared stuff for the house and the group. One person grabs it, everyone uses it.</div>`
    : `<h2><span class="who ${o.key}">${esc(o.name)}</span> is packing</h2><div class="meta">Write it down now so you remember it later. Tick the box once it is in the bag.</div>`;
  el.innerHTML = `<div class="subtabs">${subs}</div>
    <div class="card">
      ${title}
      <div class="stripe"></div>
      ${rows}
      <div class="packbar"><span class="meta" style="margin:0">Packed</span><span class="big" id="packcount-${o.key}">${c.packed} / ${c.total}</span></div>
    </div>`;
  el.querySelectorAll('.subtab').forEach(s => s.addEventListener('click', () => { packSub = s.dataset.sub; renderPack(); }));
  el.querySelectorAll('.prow').forEach(row => {
    const handler = () => {
      clearTimeout(row._t);
      setSt(row, 'saving');
      row.classList.toggle('packed', row.querySelector('.chk').checked);
      row._t = setTimeout(() => savePackRow(row), SAVE_DEBOUNCE_MS);
    };
    row.querySelector('.item').addEventListener('input', handler);
    row.querySelector('.chk').addEventListener('change', handler);
  });
}
async function savePackRow(row) {
  const owner = row.dataset.owner, slot = Number(row.dataset.slot);
  const item = row.querySelector('.item').value.trim();
  const packed = row.querySelector('.chk').checked;
  try {
    if (!item) {
      await store.deletePacking(owner, slot);
      setSt(row, '');
      row.classList.remove('packed');
    } else {
      await store.upsertPacking({ owner, slot, item, packed });
      setSt(row, 'saved');
    }
    PACKING = await store.listPacking();
    const c = packCounts(owner);
    const big = document.getElementById('packcount-' + owner);
    if (big) big.textContent = c.packed + ' / ' + c.total;
    document.querySelectorAll('#pack .subtab[data-sub]').forEach(s => {
      const cc = packCounts(s.dataset.sub);
      const sm = s.querySelector('small'); if (sm) sm.textContent = cc.packed + '/' + cc.total + ' packed';
    });
  } catch (e) {
    setSt(row, 'err');
  }
}

// Trash button on a pack row: wipe the item and remove the saved entry
window.clearPackRow = async function(btn) {
  const row = btn.closest('.prow');
  if (!row) return;
  const item = row.querySelector('.item'), chk = row.querySelector('.chk');
  if (!item.value.trim()) return;
  if (!confirm('Delete this item for everyone?\n\n' + item.value.trim())) return;
  clearTimeout(row._t);
  item.value = ''; chk.checked = false; row.classList.remove('packed');
  await savePackRow(row);
};

/* ===== Boot + quiet refresh ===== */
let refreshing = false;
async function quietRefresh() {
  if (refreshing || document.hidden || store.mode !== 'live') return;
  // Never yank inputs out from under someone typing on the money sheet
  if (activeTab === 'money' && moneySub !== 'subtotal' && document.activeElement && document.activeElement.closest('.mrow')) return;
  if (activeTab === 'pack' && document.activeElement && document.activeElement.closest('.prow')) return;
  if (editingId !== null) return;
  refreshing = true;
  try { await loadAll(); render(); } finally { refreshing = false; }
}
(async function boot() {
  await store.probe();
  showBanner();
  await loadAll();
  render();
  setInterval(quietRefresh, 45000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) quietRefresh(); });
})();
</script>
