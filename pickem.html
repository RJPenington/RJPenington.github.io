        bar.appendChild(document.createTextNode(msg));
    }

    // Fetch every current-season row and rebuild SEASONS[RAW.season] in the
    // same weeks shape the renderers already read. Each pick keeps its DB id
    // as _id (plus outcome) so the grading and delete buttons can target it.
    // Pass quiet=true to update the data and toolbar WITHOUT re-rendering the
    // active panel. Autosave uses that so a save never wipes the enter form
    // mid-typing; the other tabs pick up fresh data on their next render.
    async function refreshLiveSeason(quiet) {
        let rows;
        try {
            rows = await sb('/rest/v1/pickem_picks?season=eq.' + encodeURIComponent(RAW.season)
                            + '&select=*&order=week.asc,id.asc');
        } catch (e) {
            showLiveWarn('Live picks unavailable, check Supabase setup. ('
                         + (e && e.message ? e.message : e) + ')');
            return;
        }
        const byWeek = new Map();
        for (const r of rows || []) {
            const wk = Number(r.week);
            if (!byWeek.has(wk)) {
                byWeek.set(wk, { week: wk,
                                 nick: { picks: [], total_net: 0 },
                                 rj:   { picks: [], total_net: 0 } });
            }
            const who = r.person === 'nick' ? 'nick' : 'rj';
            byWeek.get(wk)[who].picks.push({
                _id: r.id,
                pick: r.pick,
                units: Number(r.units),
                net: (r.net === null || r.net === undefined) ? null : Number(r.net),
                mortal_lock: !!r.mortal_lock,
                bet_type: r.bet_type,
                outcome: r.outcome || null,
                // Structured form state (jsonb), present once the fields
                // column exists; hydration restores it verbatim
                fields: (r.fields && typeof r.fields === 'object') ? r.fields : null,
                // Creation time decides the pick's lock window
                created_at: r.created_at || null,
            });
        }
        const weeks = padCurrentSeasonWeeks([...byWeek.values()]);
        for (const w of weeks) {
            for (const who of ['nick', 'rj']) {
                // Ungraded picks (net null) count as 0, they are pending
                w[who].total_net = w[who].picks.reduce(
                    (sum, p) => sum + (p.net === null ? 0 : Number(p.net)), 0);
            }
        }
        SEASONS[RAW.season] = weeks;
        buildAllSeasonsWeeks();
        // Repaint when viewing the current season or the All view (both fold
        // in the fresh data); archived views never need it.
        if (seasonSel.value === RAW.season || seasonSel.value === ALL_SEASONS) {
            const prevWeek = weekSel.value;
            fillWeekSelector();
            if (prevWeek !== '' && [...weekSel.options].some(o => o.value === prevWeek)) {
                weekSel.value = prevWeek;
            }
            weekSelAccepted = weekSel.value;
            if (quiet) { renderSummary(); rehydrateEnterIfIdle(); updateEnterLockSlots(); }
            else renderAll();
        }
    }

    // ===== Utility: parse team name(s) out of a pick string =====
    // Common abbreviations RJ uses in the sheet, so short forms match FBS names.
    const TEAM_ABBR = {
        'wsu':'Washington State','asu':'Arizona State','ucf':'UCF','usf':'South Florida',
        'ksu':'Kansas State','ku':'Kansas','osu':'Ohio State','msu':'Michigan State',
        'vt':'Virginia Tech','uva':'Virginia','uw':'Washington','gt':'Georgia Tech',
        'lsu':'LSU','tcu':'TCU','byu':'BYU','smu':'SMU','nd':'Notre Dame',
        'ecu':'East Carolina','fsu':'Florida State','ttu':'Texas Tech',
        'k state':'Kansas State','nc state':'NC State','miss st':'Mississippi State',
        'iowa st':'Iowa State','iowa state':'Iowa State','ole miss':'Ole Miss',
        'sam houston':'Sam Houston','wku':'Western Kentucky','unm':'New Mexico',
        'uab':'UAB','nmsu':'New Mexico State','usc':'USC','fiu':'FIU',
        'a&m':'Texas A&M','texas a&m':'Texas A&M','uw':'Washington','uofa':'Arizona',
        'kent st':'Kent State','ball st':'Ball State','shsu':'Sam Houston',
        'jmu':'James Madison','niu':'Northern Illinois','ltech':'Louisiana Tech',
        'unlv':'UNLV','utep':'UTEP','utsa':'UTSA', 'usa':'South Alabama',
    };
    // Given a raw pick string, return every FBS team name mentioned.
    // Also matches common abbreviations RJ types in the sheet.
    function matchFBSTeamsIn(s) {
        const lower = ' ' + s.toLowerCase() + ' ';
        const found = [];
        // Match full official FBS names first (longest names win, so sort by length)
        const sorted = [...FBS_TEAMS].sort((a,b) => b.length - a.length);
        let scratch = lower;
        for (const t of sorted) {
            const needle = ' ' + t.toLowerCase() + ' ';
            if (scratch.includes(needle)) {
                found.push(t);
                scratch = scratch.replace(needle, ' ___ ');   // consume so partials don't rematch
            }
        }
        // Then abbreviations, longest first (so 'k state' matches before 'k')
        const abbrSorted = Object.entries(TEAM_ABBR).sort((a,b) => b[0].length - a[0].length);
        for (const [ab, canon] of abbrSorted) {
            const needle = ' ' + ab + ' ';
            if (scratch.includes(needle) && !found.includes(canon)) {
                found.push(canon);
                scratch = scratch.replace(needle, ' ___ ');
            }
        }
        return found;
    }

    // Legacy single-team extractor — kept for the "picked team" case on
    // ML/Spread/TTO where we only care about the primary side.
    function extractTeam(pickStr) {
        if (!pickStr || typeof pickStr !== 'string') return null;
        let s = pickStr.trim();
        s = s.replace(/\s+(Over|Under|O|U)\s+\d+(\.\d+)?.*/i, ' [total]');
        s = s.replace(/\s+([+\-−]?\d+(\.\d+)?).*$/, '');
        s = s.replace(/\s*Team\s+Total.*$/i, '');
        s = s.trim();
        if (!s || s.includes('[total]') || s.includes('/')) return null;
        return s;
    }

    // Return { picked: [team...], opponents: [team...] } for a pick.
    //   ML/Spread/TTO → one picked team, opponent = form's p.opponent when present
    //   O/U          → both teams in the game count as picked (they share the outcome)
    // Uses p.home / p.away / p.side from form-saved picks when available.
    function extractTeamsFromPick(p) {
        if (!p || !p.pick) return { picked: [], opponents: [] };
        // Prefer explicit fields from the form when they exist
        if (p.home || p.away) {
            const side = p.side;
            const picked = [], opponents = [];
            if (p.bet_type === 'O/U') {
                if (p.home) picked.push(p.home);
                if (p.away) picked.push(p.away);
            } else if (side === 'H') {
                if (p.home) picked.push(p.home);
                if (p.away) opponents.push(p.away);
            } else if (side === 'A') {
                if (p.away) picked.push(p.away);
                if (p.home) opponents.push(p.home);
            } else {
                if (p.home) picked.push(p.home);
                if (p.away) opponents.push(p.away);
            }
            return { picked, opponents };
        }
        // Fallback: parse the pick string itself
        if (p.bet_type === 'O/U') {
            const teams = matchFBSTeamsIn(p.pick);
            return { picked: teams.slice(0, 2), opponents: [] };
        }
        const one = extractTeam(p.pick);
        return { picked: one ? [one] : [], opponents: [] };
    }
    function numOrZero(v) { return typeof v === 'number' ? v : (Number(v) || 0); }
    function fmtNet(v) {
        if (v === null || v === undefined || v === '') return '—';
        const n = Number(v);
        if (isNaN(n)) return String(v);
        const s = (n >= 0 ? '+' : '') + n.toFixed(2).replace(/\.?0+$/, '');
        return s.endsWith('.') ? s + '0' : s;
    }
    function classForNet(v) {
        const n = Number(v);
        if (!v && v !== 0) return 'net-zero';
        if (isNaN(n) || n === 0) return 'net-zero';
        return n > 0 ? 'net-good' : 'net-bad';
    }

    /* ===== Toolbar wiring ===== */
    const seasonSel = document.getElementById('seasonSel');
    const weekSel = document.getElementById('weekSel');
    const seasonTabs = document.getElementById('seasonTabs');
    // Last accepted week selection, for rolling back a declined week switch
    let weekSelAccepted = null;
    Object.keys(SEASONS).forEach((name, i) => {
        const opt = document.createElement('option');
        opt.value = name; opt.textContent = name;
        seasonSel.appendChild(opt);
        const btn = document.createElement('button');
        btn.className = 'season-tab' + (i === 0 ? ' active' : '');
        btn.textContent = name;
        btn.addEventListener('click', () => {
            seasonSel.value = name;
            seasonTabs.querySelectorAll('.season-tab').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            seasonSel.dispatchEvent(new Event('change'));
        });
        seasonTabs.appendChild(btn);
    });
    // The old empty-season banner is gone. The current season always carries
    // weeks 0..14 now, so the empty person cards on Week Picks are all the
    // signal a fresh year needs.
    function fillWeekSelector() {
        const weeks = SEASONS[seasonSel.value] || [];
        const isAll = seasonSel.value === ALL_SEASONS;
        weekSel.innerHTML = '';
        weeks.forEach((w, i) => {
            const opt = document.createElement('option');
            // The All view needs unique option values because week numbers
            // repeat across seasons, so it selects by array index instead
            opt.value = isAll ? String(i) : w.week;
            opt.textContent = w.label || weekDisplayName(w.week);
            weekSel.appendChild(opt);
        });
        if (!weeks.length) return;
        // Default: the current season lands on the auto-computed week (ticks
        // forward each Monday); All and archived seasons land on their latest
        // week. A manual week choice is preserved across quiet autosave
        // refreshes by refreshLiveSeason's save-and-restore around this call.
        if (isAll) weekSel.value = String(weeks.length - 1);
        else if (seasonSel.value === RAW.season) weekSel.value = String(computeCurrentWeek());
        else weekSel.value = weeks[weeks.length - 1].week;
        weekSelAccepted = weekSel.value;
    }

    // Resolve the week object the selector points at. On the All view the
    // selector value is an array index; everywhere else it is a week number.
    function findSelectedWeek(weeks) {
        if (seasonSel.value === ALL_SEASONS) return weeks[Number(weekSel.value)] || null;
        return weeks.find(x => x.week === Number(weekSel.value)) || null;
    }
    fillWeekSelector();

    seasonSel.addEventListener('change', () => { fillWeekSelector(); updateEnterTabsForSeason(); renderAll(); });
    // Week-driven entry: the global selector is the single source of truth
    // for the Enter tab, so switching weeks re-renders the form for the new
    // week. If unsaved typing would be discarded, confirm first and roll the
    // selector back on decline (safer than a silent wipe, and less annoying
    // than hard-blocking the switch).
    weekSel.addEventListener('change', () => {
        const activeTab = document.querySelector('.tab.active');
        if (activeTab && activeTab.dataset.panel === 'enter'
            && seasonSel.value === RAW.season && enterPanelHasUnsavedWork()) {
            if (!confirm('You have unsaved picks typed for this week. Switch weeks and discard them?')) {
                if (weekSelAccepted !== null) weekSel.value = weekSelAccepted;
                return;
            }
        }
        weekSelAccepted = weekSel.value;
        renderAll();
    });

    /* ===== Tab wiring ===== */
    document.querySelectorAll('.tab').forEach(t => {
        t.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === t));
            document.querySelectorAll('section.panel').forEach(p =>
                p.classList.toggle('active', p.id === t.dataset.panel));
            renderAll();
        });
    });

    // Entering picks is only allowed for the CURRENT season. On archived
    // seasons and the All view hide the Enter tab; if it was active, jump
    // the view over to Week Picks.
    function updateEnterTabsForSeason() {
        const isCur = seasonSel.value === RAW.season;
        document.querySelectorAll('.tab').forEach(t => {
            if (t.dataset.panel === 'enter') t.style.display = isCur ? '' : 'none';
        });
        const active = document.querySelector('.tab.active');
        if (!isCur && active && active.dataset.panel === 'enter') {
            const picksTab = document.querySelector('.tab[data-panel="picks"]');
            if (picksTab) picksTab.click();
        }
    }

    /* ===== Render — Week Picks tab ===== */
    function renderPicks() {
        const weeks = SEASONS[seasonSel.value] || [];
        const w = findSelectedWeek(weeks);
        const el = document.getElementById('picks');
        if (!w) { el.innerHTML = '<div class="panel-card">No picks for that week.</div>'; return; }

        // Grading buttons only appear on the CURRENT season, whose picks come
        // from Supabase and carry a _id. Archived rows render read-only.
        const liveSeason = seasonSel.value === RAW.season;

        // W/L/P/X button strip for every pick row, locks included (the
        // manual fallback for anything the morning auto-grader skips).
        // Lock slots stay pure display.
        const gradeBtnsFor = (p) => {
            const u = numOrZero(p.units);
            const lk = p.mortal_lock ? 'true' : 'false';
            const btn = (act, txt, title, on) =>
                `<button class="grade-btn ${act.toLowerCase()}${on ? ' on' : ''}" title="${title}" onclick="gradePick('${p._id}','${act}',${u},${lk})">${txt}</button>`;
            return btn('W', 'W', 'Mark win',   p.outcome === 'W')
                 + btn('L', 'L', 'Mark loss',  p.outcome === 'L')
                 + btn('P', 'P', 'Mark push',  p.outcome === 'push')
                 + btn('X', 'X', 'Clear grade (back to pending)', false);
        };

        // Result state for a lock: live picks carry outcome; archived locks
        // derive it from their net so old seasons' slots still show results.
        const lockStateOf = (p) => {
            if (p.outcome === 'W') return 'W';
            if (p.outcome === 'L') return 'L';
            if (p.outcome === 'push') return 'P';
            if (p.net === null || p.net === undefined) return null;
            const n = Number(p.net);
            if (isNaN(n)) return null;
            return n > 0 ? 'W' : (n < 0 ? 'L' : 'P');
        };

        // Designated mortal lock slot: finds the person's lock for this week
        // straight from the week's pick list. Pure display on every season;
        // the morning auto-grader sets lock outcomes, so no buttons here.
        const slotFor = (who, label) => {
            const lock = (w[who].picks || []).find(p => p.mortal_lock);
            if (!lock) {
                return `<div class="lock-slot ${who}">
                    <div class="slot-title">${label} Mortal Lock ${LOCK_ICON}</div>
                    <div class="slot-empty">no lock yet</div>
                </div>`;
            }
            const state = lockStateOf(lock);
            const cls = state === 'W' ? ' graded-w' : state === 'L' ? ' graded-l' : state === 'P' ? ' graded-p' : '';
            const stateWord = state === 'W' ? 'Won' : state === 'L' ? 'Lost' : state === 'P' ? 'Push' : 'Pending';
            return `<div class="lock-slot ${who}${cls}">
                <div class="slot-title">${label} Mortal Lock ${LOCK_ICON}</div>
                <div class="slot-pick">${lock.pick}</div>
                <div class="slot-meta">${lock.units ?? '—'} u · ${stateWord} · ${fmtNet(lock.net)}</div>
            </div>`;
        };

        const personCard = (label, person) => {
            const net = person.total_net;
            const netCls = classForNet(net);
            const netTag = (net === null || net === undefined || net === '' || Number(net) === 0)
                ? '' : (Number(net) > 0 ? 'good' : 'bad');
            const cols = liveSeason ? 4 : 3;
            let rows = '';
            for (const p of person.picks) {
                const netHtml = `<span class="${classForNet(p.net)}">${fmtNet(p.net)}</span>`;
                const isLock = !!p.mortal_lock;
                let actions = '';
                if (liveSeason && p._id !== undefined && p._id !== null) {
                    // Every row grades here, lock rows included (gradePick
                    // pays lock nets at 1.5x, same math as the auto-grader).
                    // The trash disappears once the pick's lock time passes
                    // (Saturday noon ET, or Sunday night for Gameday adds);
                    // deletePick double-checks against stale DOM.
                    const lockMs = pickLockTime(p, w.week);
                    const delBtn = Date.now() > lockMs ? ''
                        : `<button class="grade-btn del" title="Delete pick" onclick="deletePick('${p._id}', ${lockMs})">${TRASH_ICON}</button>`;
                    actions = `<td class="grade-cell"><span class="grade-btns">`
                        + gradeBtnsFor(p)
                        + delBtn
                        + `</span></td>`;
                } else if (liveSeason) {
                    actions = `<td class="grade-cell"></td>`;
                }
                // Outcome only exists on live current-season picks, so
                // archived rows never pick up a grade class. Lock rows keep
                // their blue glow instead of the result tint; a small badge
                // carries the W/L/P story in the list.
                const gradeCls = isLock ? '' : (
                    p.outcome === 'W' ? ' graded-w'
                    : p.outcome === 'L' ? ' graded-l'
                    : p.outcome === 'push' ? ' graded-p' : '');
                const lockBadge = isLock && p.outcome
                    ? `<span class="lock-badge ${p.outcome === 'push' ? 'p' : p.outcome.toLowerCase()}">${p.outcome === 'push' ? 'P' : p.outcome}</span>`
                    : '';
                rows += `<tr class="${isLock ? 'mortal-lock' : ''}${gradeCls}">
                    <td>${p.pick}${lockBadge}</td>
                    <td>${p.units ?? '—'}</td>
                    <td>${netHtml}</td>${actions}
                </tr>`;
            }
            return `<div class="person-card">
                <div class="person-head">
                    <span class="who">${label}</span>
                    <span class="net ${netTag}">${fmtNet(net)} u</span>
                </div>
                <table>
                    <thead><tr><th>Pick</th><th>Units</th><th>Net</th>${liveSeason ? '<th>Grade</th>' : ''}</tr></thead>
                    <tbody>${rows || `<tr><td colspan="${cols}" style="color:var(--dim); text-align:center; padding:1rem;">No picks entered.</td></tr>`}</tbody>
                </table>
            </div>`;
        };

        el.innerHTML = `
        <div class="lock-slots">
            ${slotFor('rj', 'RJ')}
            ${slotFor('nick', 'Nick')}
        </div>
        <div class="picks-grid">
            ${personCard('Nick', w.nick)}
            ${personCard('RJ',   w.rj)}
        </div>`;
    }

    /* ===== Render — Head to Head tab ===== */
    // Aggregate picks in `weeks` by the field returned by keyFn(pick, week).
    // Returns [{key, picks, wins, losses, pushes, net, uWon, uLost}, ...].
    //   net   = signed sum of every pick's Total column (profit/loss)
    //   uWon  = sum of the *positive* nets — gross units earned on winners
    //   uLost = absolute sum of the *negative* nets — gross units surrendered on losers
    // So `net === uWon - uLost` by construction.
    function aggregatePicksBy(weeks, who, keyFn) {
        const buckets = {};
        for (const w of weeks) {
            for (const p of w[who].picks) {
                const key = keyFn(p, w);
                if (key == null) continue;
                if (!buckets[key]) buckets[key] = {key, picks:0, wins:0, losses:0, pushes:0, net:0, uWon:0, uLost:0};
                const b = buckets[key];
                b.picks++;
                const n = numOrZero(p.net);
                b.net += n;
                if (n > 0) { b.wins++;   b.uWon  += n; }
                else if (n < 0) { b.losses++; b.uLost += -n; }
                else b.pushes++;
            }
        }
        return Object.values(buckets);
    }

    function renderH2H() {
        const weeks = SEASONS[seasonSel.value] || [];
        let nickTotal = 0, rjTotal = 0;
        let nickWeekWins = 0, rjWeekWins = 0, ties = 0;
        const weeklyRows = [];
        for (const w of weeks) {
            const n = numOrZero(w.nick.total_net);
            const r = numOrZero(w.rj.total_net);
            nickTotal += n; rjTotal += r;
            let winner = '—';
            if (n > r) { nickWeekWins++; winner = 'Nick'; }
            else if (r > n) { rjWeekWins++; winner = 'RJ'; }
            else if (n !== 0 || r !== 0) { ties++; winner = 'Tie'; }
            weeklyRows.push({week: w.week, label: w.label, n, r, winner, diff: n - r});
        }

        // Bet-type breakdown: order ML / Spread / O/U / TTO / (unknown)
        const BET_ORDER = ['ML', 'Spread', 'O/U', 'TTO'];
        const nickByType = aggregatePicksBy(weeks, 'nick', p => p.bet_type || null);
        const rjByType   = aggregatePicksBy(weeks, 'rj',   p => p.bet_type || null);

        function betTypeTable(label, buckets) {
            const rows = BET_ORDER.map(bt => {
                const b = buckets.find(x => x.key === bt) || {key:bt, picks:0, wins:0, losses:0, pushes:0, net:0, uWon:0, uLost:0};
                const g = b.wins + b.losses;
                const pct = g > 0 ? Math.round(b.wins/g * 100) + '%' : '—';
                return `<tr>
                    <td>${bt}</td>
                    <td class="num">${b.picks}</td>
                    <td class="num">${b.wins}-${b.losses}${b.pushes ? '-' + b.pushes : ''}</td>
                    <td class="num"><span class="net-good">+${b.uWon.toFixed(2)}</span> / <span class="net-bad">-${b.uLost.toFixed(2)}</span></td>
                    <td class="num">${pct}</td>
                    <td class="num ${classForNet(b.net)}">${fmtNet(b.net)}</td>
                </tr>`;
            }).join('');
            return `<div class="panel-card">
                <h3>${label} — By Bet Type</h3>
                <table class="data">
                    <thead><tr>
                        <th>Bet Type</th>
                        <th class="num">Picks</th>
                        <th class="num">W-L-P</th>
                        <th class="num" title="Gross units won on winners / gross units lost on losers">Units W / L</th>
                        <th class="num">Hit %</th>
                        <th class="num" title="Won minus lost — net profit/loss in units">Net (u)</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div style="color:var(--dim); font-size:0.78rem; margin-top:0.5rem;">
                    <strong>Units W/L</strong> = gross units won on winning picks / gross units lost on losing picks (from the sheet's Total column).
                    <strong>Net (u)</strong> = Won − Lost, the actual profit/loss for that bet type.
                </div>
            </div>`;
        }

        // Weekday vs weekend split by bet type.
        //   p.game_date is present on new form-saved picks (Phase 2) → we can
        //   bucket into Weekday / Weekend. Historical picks lack a date and
        //   land in "Date unknown".
        function isWeekend(dateStr) {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            if (isNaN(d)) return null;
            const dow = d.getDay();     // 0 Sun, 6 Sat
            return dow === 0 || dow === 5 || dow === 6;   // Fri/Sat/Sun = "gameday weekend"
        }
        function wdCrossTable(label, weeks, who) {
            const cell = {WD:{}, WE:{}, '?':{}};
            for (const bucket of ['WD','WE','?'])
                for (const bt of BET_ORDER) cell[bucket][bt] = {picks:0, wins:0, losses:0, pushes:0, net:0, uWon:0, uLost:0};
            for (const w of weeks) for (const p of w[who].picks) {
                const bt = p.bet_type; if (!bt || !BET_ORDER.includes(bt)) continue;
                const we = isWeekend(p.game_date);
                const bucket = we === true ? 'WE' : (we === false ? 'WD' : '?');
                const c = cell[bucket][bt];
                c.picks++;
                const n = numOrZero(p.net);
                c.net += n;
                if (n > 0) { c.wins++;   c.uWon  += n; }
                else if (n < 0) { c.losses++; c.uLost += -n; }
                else c.pushes++;
            }
            const rowLabel = {WD:'Weekday (Mon–Thu)', WE:'Weekend (Fri–Sun)', '?':'Date unknown (historical)'};
            const rows = ['WD','WE','?'].map(bucket => {
                const tds = BET_ORDER.map(bt => {
                    const c = cell[bucket][bt];
                    if (c.picks === 0) return `<td class="num" style="color:var(--dim)">—</td>`;
                    const g = c.wins + c.losses;
                    const pct = g > 0 ? Math.round(c.wins/g*100) + '%' : '—';
                    return `<td class="num">${c.wins}-${c.losses} · <span class="${classForNet(c.net)}">${fmtNet(c.net)}u</span> · ${pct}</td>`;
                }).join('');
                // Row total across all bet types
                const totals = BET_ORDER.reduce((acc, bt) => {
                    const c = cell[bucket][bt];
                    acc.picks += c.picks; acc.wins += c.wins; acc.losses += c.losses; acc.net += c.net;
                    return acc;
                }, {picks:0, wins:0, losses:0, net:0});
                const gT = totals.wins + totals.losses;
                const pctT = gT > 0 ? Math.round(totals.wins/gT*100) + '%' : '—';
                const totalCell = totals.picks === 0
                    ? `<td class="num" style="color:var(--dim)">—</td>`
                    : `<td class="num"><strong>${totals.wins}-${totals.losses} · <span class="${classForNet(totals.net)}">${fmtNet(totals.net)}u</span> · ${pctT}</strong></td>`;
                return `<tr><td>${rowLabel[bucket]}</td>${tds}${totalCell}</tr>`;
            }).join('');
            return `<div class="panel-card">
                <h3>${label} — By Weekday vs Weekend</h3>
                <table class="data">
                    <thead><tr>
                        <th></th>${BET_ORDER.map(bt => `<th class="num">${bt}</th>`).join('')}<th class="num">All</th>
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div style="color:var(--dim); font-size:0.78rem; margin-top:0.5rem;">Each cell shows <em>W-L · Net · Hit %</em>. Historical picks land in "Date unknown" until the new form saves game dates.</div>
            </div>`;
        }

        // Home vs Away split — pick.side is 'H' or 'A' once the new form saves it.
        // Historical picks are null → shown under a "no side" row.
        function haCrossTable(label, weeks, who) {
            // rows: side ('H'/'A'/'—') × cols: bet types
            const cell = {H:{}, A:{}, '—':{}};
            for (const side of ['H','A','—']) for (const bt of BET_ORDER) cell[side][bt] = {picks:0, wins:0, losses:0, pushes:0, net:0};
            for (const w of weeks) for (const p of w[who].picks) {
                const bt = p.bet_type; if (!bt || !BET_ORDER.includes(bt)) continue;
                const side = p.side === 'H' ? 'H' : (p.side === 'A' ? 'A' : '—');
                const c = cell[side][bt];
                c.picks++;
                const n = numOrZero(p.net);
                c.net += n;
                if (n > 0) c.wins++; else if (n < 0) c.losses++; else c.pushes++;
            }
            const sideLabel = {H:'Home side', A:'Away side', '—':'Side unknown (historical)'};
            const rows = ['H','A','—'].map(side => {
                const tds = BET_ORDER.map(bt => {
                    const c = cell[side][bt];
                    if (c.picks === 0) return `<td class="num" style="color:var(--dim)">—</td>`;
                    const g = c.wins + c.losses;
                    const pct = g > 0 ? Math.round(c.wins/g*100) + '%' : '—';
                    return `<td class="num">${c.wins}-${c.losses} · <span class="${classForNet(c.net)}">${fmtNet(c.net)}u</span> · ${pct}</td>`;
                }).join('');
                return `<tr><td>${sideLabel[side]}</td>${tds}</tr>`;
            }).join('');
            return `<div class="panel-card">
                <h3>${label} — By Home vs Away</h3>
                <table class="data">
                    <thead><tr>
                        <th></th>${BET_ORDER.map(bt => `<th class="num">${bt}</th>`).join('')}
                    </tr></thead>
                    <tbody>${rows}</tbody>
                </table>
                <div style="color:var(--dim); font-size:0.78rem; margin-top:0.5rem;">Each cell shows <em>W-L · Net · Hit %</em>. Historical picks are grouped under "Side unknown" until the new form starts saving H/A.</div>
            </div>`;
        }

        const el = document.getElementById('h2h');
        el.innerHTML = `
            <div class="stat-row">
                <div class="stat-tile"><div class="value" style="color:${nickTotal >= rjTotal ? 'var(--good)' : 'var(--bad)'}">${fmtNet(nickTotal)} u</div><div class="label">Nick — Season Net</div></div>
                <div class="stat-tile"><div class="value" style="color:${rjTotal >= nickTotal ? 'var(--good)' : 'var(--bad)'}">${fmtNet(rjTotal)} u</div><div class="label">RJ — Season Net</div></div>
                <div class="stat-tile"><div class="value">${nickWeekWins}-${rjWeekWins}${ties ? '-' + ties : ''}</div><div class="label">Weekly Head-to-Head</div></div>
                <div class="stat-tile"><div class="value">${fmtNet(nickTotal - rjTotal)} u</div><div class="label">Nick − RJ (season)</div></div>
            </div>
            <div class="panel-card">
                <h3>Week-by-Week (Nick − RJ)</h3>
                <table class="data">
                    <thead><tr>
                        <th>Week</th>
                        <th class="num">Nick</th>
                        <th class="num">RJ</th>
                        <th class="num">Diff (N-R)</th>
                        <th>Weekly Winner</th>
                    </tr></thead>
                    <tbody>
                        ${weeklyRows.map(w => `<tr>
                            <td>${w.label || weekDisplayName(w.week)}</td>
                            <td class="num ${classForNet(w.n)}">${fmtNet(w.n)}</td>
                            <td class="num ${classForNet(w.r)}">${fmtNet(w.r)}</td>
                            <td class="num ${classForNet(w.diff)}">${fmtNet(w.diff)}</td>
                            <td style="color:${w.winner === 'Nick' ? 'var(--accent)' : w.winner === 'RJ' ? 'var(--accent)' : 'var(--dim)'}; font-weight:700;">${w.winner}</td>
                        </tr>`).join('')}
                    </tbody>
                </table>
            </div>
            ${betTypeTable('Nick', nickByType)}
            ${betTypeTable('RJ',   rjByType)}
            ${mlLineTable('Nick', weeks, 'nick')}
            ${mlLineTable('RJ',   weeks, 'rj')}
            ${haCrossTable('Nick', weeks, 'nick')}
            ${haCrossTable('RJ',   weeks, 'rj')}
            ${wdCrossTable('Nick', weeks, 'nick')}
            ${wdCrossTable('RJ',   weeks, 'rj')}`;
    }

    // ML line-range buckets — used by the ML performance breakdown on the
    // Breakdown tab. Bucket edges are inclusive on both ends.
    const ML_BUCKETS = [
        {label: '-130 to -121', min: -130, max: -121},
        {label: '-120 to -116', min: -120, max: -116},
        {label: '-115 to -111', min: -115, max: -111},
        {label: '-110 to -101', min: -110, max: -101},
        {label: '+100 to +110', min:  100, max:  110},
        {label: '+111 to +120', min:  111, max:  120},
        {label: '+121 to +130', min:  121, max:  130},
        {label: '+131 to +140', min:  131, max:  140},
        {label: '+141 to +149', min:  141, max:  149},
        {label: '+150+',        min:  150, max: Infinity},
    ];
    // Compute the signed ML line for a pick, or null if not determinable.
    // Form-saved picks store the sign ('+' or '-') and the positive line value.
    function pickMlLine(p) {
        if (p.line != null && !isNaN(Number(p.line))) return Number(p.line);
        if (p.sign && p.points != null) {
            const val = Math.abs(Number(p.points));
            if (!isNaN(val)) return p.sign === '-' ? -val : val;
        }
        return null;
    }
    function mlLineTable(label, weeks, who) {
        const buckets = ML_BUCKETS.map(b => ({...b, picks:0, wins:0, losses:0, pushes:0, net:0, uWon:0, uLost:0}));
        const unknown = {label: 'Line unknown (historical)', picks:0, wins:0, losses:0, pushes:0, net:0, uWon:0, uLost:0};
        for (const w of weeks) for (const p of w[who].picks) {
            if (p.bet_type !== 'ML') continue;
            const line = pickMlLine(p);
            let bucket = unknown;
            if (line !== null) {
                const hit = buckets.find(b => line >= b.min && line <= b.max);
                if (hit) bucket = hit;
                // Lines outside the tracked ranges (e.g. -140 or +200) also
                // land in "unknown" for now — could add "off-scale" bucket later.
                else bucket = unknown;
            }
            bucket.picks++;
            const n = numOrZero(p.net);
            bucket.net += n;
            if (n > 0) { bucket.wins++;   bucket.uWon  += n; }
            else if (n < 0) { bucket.losses++; bucket.uLost += -n; }
            else bucket.pushes++;
        }
        const rows = [...buckets, unknown].map(b => {
            const g = b.wins + b.losses;
            const pct = g > 0 ? Math.round(b.wins/g*100) + '%' : '—';
            if (b.picks === 0) {
                return `<tr>
                    <td>${b.label}</td>
                    <td class="num" style="color:var(--dim)">—</td>
                    <td class="num" style="color:var(--dim)">—</td>
                    <td class="num" style="color:var(--dim)">—</td>
                    <td class="num" style="color:var(--dim)">—</td>
                    <td class="num" style="color:var(--dim)">—</td>
                </tr>`;
            }
            return `<tr>
                <td>${b.label}</td>
                <td class="num">${b.picks}</td>
                <td class="num">${b.wins}-${b.losses}${b.pushes ? '-' + b.pushes : ''}</td>
                <td class="num"><span class="net-good">+${b.uWon.toFixed(2)}</span> / <span class="net-bad">-${b.uLost.toFixed(2)}</span></td>
                <td class="num">${pct}</td>
                <td class="num ${classForNet(b.net)}">${fmtNet(b.net)}</td>
            </tr>`;
        }).join('');
        return `<div class="panel-card">
            <h3>${label} — ML Performance by Line Range</h3>
            <table class="data">
                <thead><tr>
                    <th>ML Line Range</th>
                    <th class="num">Picks</th>
                    <th class="num">W-L-P</th>
                    <th class="num">Units W / L</th>
                    <th class="num">Hit %</th>
                    <th class="num">Net (u)</th>
                </tr></thead>
                <tbody>${rows}</tbody>
            </table>
            <div style="color:var(--dim); font-size:0.78rem; margin-top:0.5rem;">Line derived from the pick's ± bubble + Pts value on new form-saved picks. Historical picks land under "Line unknown".</div>
        </div>`;
    }

    /* ===== Render — Teams tab (best + worst) =====
       O/U picks credit BOTH teams involved in the game — winning
       "Alabama FSU Over" gives Alabama and FSU each +1 W. ML/Spread/TTO
       still credit only the one picked team. */
    function computeTeamStats(who) {
        const weeks = SEASONS[seasonSel.value] || [];
        const map = {};
        for (const w of weeks) {
            for (const p of w[who].picks) {
                const { picked } = extractTeamsFromPick(p);
                for (const team of picked) {
                    if (!map[team]) map[team] = { team, picks: 0, wins: 0, losses: 0, pushes: 0, net: 0, units: 0 };
                    const rec = map[team];
                    rec.picks += 1;
                    rec.units += numOrZero(p.units);
                    const n = numOrZero(p.net);
                    rec.net += n;
                    if (n > 0) rec.wins++;
                    else if (n < 0) rec.losses++;
                    else rec.pushes++;
                }
            }
        }
        return Object.values(map).map(t => ({
            ...t,
            hit_pct: (t.wins + t.losses) > 0 ? t.wins / (t.wins + t.losses) : null,
        }));
    }

    // O/U record per team, split by whether the team was HOME or AWAY in the
    // matchup. Requires form-saved picks with p.home / p.away — historical
    // O/U picks lack home-vs-away info and are excluded from this table.
    function computeTeamOUHomeAway(who) {
        const weeks = SEASONS[seasonSel.value] || [];
        const map = {};   // team -> { team, home: {picks,W,L,net}, away: {picks,W,L,net} }
        const empty = () => ({picks:0, wins:0, losses:0, pushes:0, net:0});
        for (const w of weeks) for (const p of w[who].picks) {
            if (p.bet_type !== 'O/U') continue;
            if (!p.home || !p.away) continue;   // need explicit sides
            const n = numOrZero(p.net);
            for (const [team, role] of [[p.home, 'home'], [p.away, 'away']]) {
                if (!map[team]) map[team] = {team, home: empty(), away: empty()};
                const r = map[team][role];
                r.picks++;
                r.net += n;
                if (n > 0) r.wins++;
                else if (n < 0) r.losses++;
                else r.pushes++;
            }
        }
        return Object.values(map);
    }

    // Track our record against each team as an opponent.
    // Only meaningful when the opponent is known — that's:
    //   - Form-saved ML/Spread/TTO where opponent is explicit
    //   - Historical O/U picks (the "other" team is by convention the opponent
    //     of the "first" team, though O/U isn't really "against" anyone; we
    //     still show it because it's the closest signal we have)
    function computeVsOpponentStats(who) {
        const weeks = SEASONS[seasonSel.value] || [];
        const map = {};
        for (const w of weeks) {
            for (const p of w[who].picks) {
                const { opponents } = extractTeamsFromPick(p);
                for (const team of opponents) {
                    if (!map[team]) map[team] = { team, picks: 0, wins: 0, losses: 0, pushes: 0, net: 0 };
                    const rec = map[team];
                    rec.picks += 1;
                    const n = numOrZero(p.net);
                    rec.net += n;
                    if (n > 0) rec.wins++;
                    else if (n < 0) rec.losses++;
                    else rec.pushes++;
                }
            }
        }
        return Object.values(map).map(t => ({
            ...t,
            hit_pct: (t.wins + t.losses) > 0 ? t.wins / (t.wins + t.losses) : null,
        }));
    }
    function renderTeams() {
        const el = document.getElementById('teams');
        const nickTeams = computeTeamStats('nick');
        const rjTeams = computeTeamStats('rj');
        const nickVsOpp = computeVsOpponentStats('nick');
        const rjVsOpp = computeVsOpponentStats('rj');
        const nickOUHA = computeTeamOUHomeAway('nick');
        const rjOUHA   = computeTeamOUHomeAway('rj');

        function table(rows, title, mode) {
            // mode = 'best' → sort by net desc; 'worst' → sort by net asc, only negatives
            let sorted;
            if (mode === 'best') {
                sorted = [...rows].sort((a,b) => (b.net || 0) - (a.net || 0)).slice(0, 15);
            } else {
                sorted = [...rows].filter(t => t.net < 0).sort((a,b) => a.net - b.net).slice(0, 15);
            }
            return `<div class="panel-card">
                <h3>${title}</h3>
                <table class="data">
                    <thead><tr>
                        <th>Team</th>
                        <th class="num">Picks</th>
                        <th class="num">W-L-P</th>
                        <th class="num">Hit %</th>
                        <th class="num">Net (u)</th>
                    </tr></thead>
                    <tbody>
                        ${sorted.map(t => `<tr>
                            <td>${t.team}</td>
                            <td class="num">${t.picks}</td>
                            <td class="num">${t.wins}-${t.losses}-${t.pushes}</td>
                            <td class="num">${t.hit_pct === null ? '—' : (t.hit_pct*100).toFixed(0) + '%'}</td>
                            <td class="num ${classForNet(t.net)}">${fmtNet(t.net)}</td>
                        </tr>`).join('') || '<tr><td colspan="5" style="text-align:center; color:var(--dim); padding:1rem;">Nothing here.</td></tr>'}
                    </tbody>
                </table>
            </div>`;
        }

        const OU_NOTE = `<div style="color:var(--dim); font-size:0.78rem; margin:-0.35rem 0 0.9rem 0.2rem;">O/U picks credit both teams in the game (e.g. "Alabama FSU Over" → Alabama +1 W and FSU +1 W). ML/Spread/TTO credit only the picked team.</div>`;
        const VS_NOTE = `<div style="color:var(--dim); font-size:0.78rem; margin:-0.35rem 0 0.9rem 0.2rem;">Record when a team was the opponent. Historical picks only supply an opponent on O/U bets; ML/Spread/TTO opponents appear as new picks come in from the form.</div>`;

        // O/U-by-team broken out into Home vs Away — only meaningful for
        // form-saved picks that carry p.home / p.away.
        function ouHomeAwayTable(label, rows) {
            const sorted = [...rows].sort((a,b) => (b.home.net + b.away.net) - (a.home.net + a.away.net));
            const body = sorted.length ? sorted.slice(0, 15).map(t => {
                function cellFor(r) {
                    if (r.picks === 0) return `<td class="num" style="color:var(--dim)">—</td>`;
                    const g = r.wins + r.losses;
                    const pct = g > 0 ? Math.round(r.wins/g*100) + '%' : '—';
                    return `<td class="num">${r.wins}-${r.losses}${r.pushes ? '-'+r.pushes : ''} · <span class="${classForNet(r.net)}">${fmtNet(r.net)}u</span> · ${pct}</td>`;
                }
                return `<tr>
                    <td>${t.team}</td>
                    ${cellFor(t.home)}
                    ${cellFor(t.away)}
                </tr>`;
            }).join('') : '<tr><td colspan="3" style="text-align:center; color:var(--dim); padding:1rem;">No O/U picks with home/away recorded yet — populates as form-saved picks land.</td></tr>';
            return `<div class="panel-card">
                <h3>${label} — O/U Record by Team When Home vs Away</h3>
                <table class="data">
                    <thead><tr>
                        <th>Team</th>
                        <th class="num">Home O/U (W-L · Net · Hit %)</th>
                        <th class="num">Away O/U (W-L · Net · Hit %)</th>
                    </tr></thead>
                    <tbody>${body}</tbody>
                </table>
            </div>`;
        }

        el.innerHTML =
            `<h2 style="color:var(--accent); text-transform:uppercase; letter-spacing:0.06em; font-size:0.95rem; margin:0.5rem 0 0.75rem;">Nick's Teams</h2>` +
            OU_NOTE +
            table(nickTeams, "Nick — Best Teams (top 15 by Net Units)", 'best') +
            table(nickTeams, "Nick — Worst Teams (top 15 by lowest Net Units)", 'worst') +
            VS_NOTE +
            table(nickVsOpp, "Nick — Vs Opponents (top 15 by Net Units)", 'best') +
            ouHomeAwayTable('Nick', nickOUHA) +
            `<h2 style="color:var(--accent); text-transform:uppercase; letter-spacing:0.06em; font-size:0.95rem; margin:1.5rem 0 0.75rem;">RJ's Teams</h2>` +
            OU_NOTE +
            table(rjTeams,   "RJ — Best Teams (top 15 by Net Units)", 'best') +
            table(rjTeams,   "RJ — Worst Teams (top 15 by lowest Net Units)", 'worst') +
            VS_NOTE +
            table(rjVsOpp,   "RJ — Vs Opponents (top 15 by Net Units)", 'best') +
            ouHomeAwayTable('RJ', rjOUHA);
    }

    /* ===== Render — Mortal Locks tab ===== */
    function renderLocks() {
        const el = document.getElementById('locks');
        const weeks = SEASONS[seasonSel.value] || [];
        const empty = () => ({picks:0, wins:0, losses:0, pushes:0, net:0});
        const stats = {
            nick: {picks:0, wins:0, losses:0, pushes:0, net:0, rows:[],
                   wd: empty(), we: empty(), unk: empty()},
            rj:   {picks:0, wins:0, losses:0, pushes:0, net:0, rows:[],
                   wd: empty(), we: empty(), unk: empty()},
        };
        function isWkndDate(dateStr) {
            if (!dateStr) return null;
            const d = new Date(dateStr);
            if (isNaN(d)) return null;
            const dow = d.getDay();
            return dow === 0 || dow === 5 || dow === 6;   // Fri/Sat/Sun
        }
        for (const w of weeks) {
            for (const who of ['nick', 'rj']) {
                for (const p of w[who].picks) {
                    if (!p.mortal_lock) continue;
                    const s = stats[who];
                    s.picks++;
                    const n = numOrZero(p.net);
                    s.net += n;
                    if (n > 0) s.wins++;
                    else if (n < 0) s.losses++;
                    else s.pushes++;
                    s.rows.push({week: w.week, label: w.label, pick: p.pick, units: p.units, net: p.net, game_date: p.game_date});
                    // WD/WE bucketing — historical picks have no date → 'unk'
                    const we = isWkndDate(p.game_date);
                    const bucket = we === true ? 'we' : (we === false ? 'wd' : 'unk');
                    const b = s[bucket];
                    b.picks++;
                    b.net += n;
                    if (n > 0) b.wins++;
                    else if (n < 0) b.losses++;
                    else b.pushes++;
                }
            }
        }

        function personLockCard(label, s) {
            const pct = (s.wins + s.losses) > 0 ? Math.round(s.wins / (s.wins + s.losses) * 100) : null;
            return `<div class="stat-tile">
                <div class="value">${s.wins}-${s.losses}${s.pushes ? '-' + s.pushes : ''}</div>
                <div class="label">${label} — Lock record${pct !== null ? ' · ' + pct + '%' : ''}</div>
            </div>
            <div class="stat-tile">
                <div class="value ${s.net >= 0 ? '' : ''}" style="color:${s.net >= 0 ? 'var(--good)' : 'var(--bad)'}">${fmtNet(s.net)} u</div>
                <div class="label">${label} — Lock net units</div>
            </div>`;
        }

        function lockTable(label, s) {
            return `<div class="panel-card">
                <h3>${label}'s Mortal Locks</h3>
                <table class="data">
                    <thead><tr>
                        <th>Week</th><th>Pick</th><th class="num">Units</th><th class="num">Net</th>
                    </tr></thead>
                    <tbody>${s.rows.map(r => `<tr>
                        <td>${r.label || weekDisplayName(r.week)}</td>
                        <td>${r.pick}</td>
                        <td class="num">${r.units ?? '—'}</td>
                        <td class="num ${classForNet(r.net)}">${fmtNet(r.net)}</td>
                    </tr>`).join('') || '<tr><td colspan="4" style="text-align:center; color:var(--dim); padding:1rem;">No mortal locks recorded.</td></tr>'}</tbody>
                </table>
            </div>`;
        }

        function wdWeTable(label, s) {
            function cell(b) {
                if (b.picks === 0) return `<td class="num" style="color:var(--dim)">—</td>`;
                const g = b.wins + b.losses;
                const pct = g > 0 ? Math.round(b.wins/g*100) + '%' : '—';
                return `<td class="num">${b.wins}-${b.losses}${b.pushes ? '-'+b.pushes : ''} · <span class="${classForNet(b.net)}">${fmtNet(b.net)}u</span> · ${pct}</td>`;
            }
            return `<div class="panel-card">
                <h3>${label} — Lock Record by Weekday vs Weekend</h3>
                <table class="data">
                    <thead><tr>
                        <th></th>
                        <th class="num">Weekday (Mon–Thu)</th>
                        <th class="num">Weekend (Fri–Sun)</th>
                        <th class="num">Date unknown (historical)</th>
                        <th class="num">All</th>
                    </tr></thead>
                    <tbody>
                        <tr>
                            <td>Mortal Locks</td>
                            ${cell(s.wd)}
                            ${cell(s.we)}
                            ${cell(s.unk)}
                            ${cell({picks: s.picks, wins: s.wins, losses: s.losses, pushes: s.pushes, net: s.net})}
                        </tr>
                    </tbody>
                </table>
                <div style="color:var(--dim); font-size:0.78rem; margin-top:0.5rem;">Each cell shows <em>W-L · Net · Hit %</em>. Historical picks have no game date and land under "Date unknown"; new picks entered via the form (once Phase 2 saves dates) auto-populate the Weekday/Weekend columns.</div>
            </div>`;
        }

        el.innerHTML = `<div class="stat-row">${personLockCard('Nick', stats.nick)}${personLockCard('RJ', stats.rj)}</div>
            ${wdWeTable('Nick', stats.nick)}
            ${wdWeTable('RJ',   stats.rj)}
            ${lockTable('Nick', stats.nick)}
            ${lockTable('RJ', stats.rj)}`;
    }
