    /* ===== Render — Enter Picks tab =====
       Bet types:
         ML       — team only
         Spread   — team + sign (-/+) + points
         O/U      — team (game reference OK) + O/U + total points
         TTO      — team + O/U + team-total points
       Every bet has an Opponent so we can track "how well do we do vs Team X". */
    function renderEnter() {
        const el = document.getElementById('enter');
        // Team inputs use the custom typeahead dropdown (see the Team
        // typeahead section), wired globally to every .team-input.

        // One row belongs to one person; the card's data-person attribute is
        // what autosave reads, so attribution can never depend on where the
        // row sits. RJ cards keep the dark look, Nick cards go steel via the
        // person-nick class. Every card carries a required timeframe tag
        // (weekday, main slate, gameday add) that sets its lock window and
        // persists in fields.section.
        function formRow(person, i) {
            const personLabel = person === 'nick' ? 'Nick' : 'RJ';
            // Scope uid by person so RJ's row #1 does not collide with Nick's row #1
            const uid = `${person}-slate-${i}`;
            return `<div class="form-row${person === 'nick' ? ' person-nick' : ''}" data-uid="${uid}" data-person="${person}">
                <label class="lock-cell" title="Mortal Lock — pays 1.5× units on win/loss. Only one per week.">
                    <input type="checkbox" class="lock" aria-label="Mortal lock" onchange="onMortalLockChange(this)" />
                </label>
                <select class="bet-type" aria-label="Bet type" onchange="onBetTypeChange('${uid}')">
                    <option value="ML">ML</option>
                    <option value="Spread">Spread</option>
                    <option value="O/U">O/U</option>
                    <option value="TTO">TTO</option>
                </select>
                <span class="sign-group timeframe" title="Timeframe, decides the pick's lock time">
                    <label title="Weekday game (locks Saturday noon ET)"><input type="radio" name="tf-${uid}" value="weekday" />${TF_WEEKDAY_ICON}</label>
                    <label title="Main Slate, Saturday (locks Saturday noon ET)"><input type="radio" name="tf-${uid}" value="main" />${TF_MAIN_ICON}</label>
                    <label title="Gameday Addition (locks Sunday night)"><input type="radio" name="tf-${uid}" value="gameday" />${TF_GAMEDAY_ICON}</label>
                </span>
                <span class="sign-group side-h" title="Bet on home team">
                    <label><input type="radio" name="side-${uid}" value="H" />H</label>
                </span>
                <input class="home team-input" placeholder="home team" aria-label="Home team" autocomplete="off" title="Home team — type to filter FBS teams" />
                <span class="sign-group side-a" title="Bet on away team">
                    <label><input type="radio" name="side-${uid}" value="A" />A</label>
                </span>
                <input class="away team-input" placeholder="away team" aria-label="Away team" autocomplete="off" title="Away team — type to filter FBS teams" />
                <span class="sign-group sign-slot">
                    <label><input type="radio" name="sign-${uid}" value="-" />−</label>
                    <label><input type="radio" name="sign-${uid}" value="+" />+</label>
                    <label><input type="radio" name="sign-${uid}" value="O" />O</label>
                    <label><input type="radio" name="sign-${uid}" value="U" />U</label>
                </span>
                <input class="points" placeholder="Pts" aria-label="Points or line" type="number" step="0.5" />
                <input class="units" placeholder="Units" aria-label="Units" type="number" step="0.5" min="0.5" />
                <span class="idx">${personLabel} #${i}</span>
                <span class="row-status"></span>
            </div>`;
        }

        // One continuous slate: 25 cards per person, alternating RJ #1,
        // Nick #1, RJ #2, ... with per-person numbering.
        function slateSection() {
            let rows = '';
            for (let i = 1; i <= 25; i++) {
                rows += formRow('rj', i) + formRow('nick', i);
            }
            const header = `<div class="form-col-header">
                <span title="Mortal Lock">${LOCK_ICON}</span>
                <span>Bet Type</span>
                <span>When</span>
                <span>H</span>
                <span>Home Team</span>
                <span>A</span>
                <span>Away Team</span>
                <span>±/OU</span>
                <span>Pts</span>
                <span>Units</span>
                <span>Who #</span>
                <span></span>
            </div>`;
            return `<div class="panel-card form-section-card">
                <div class="form-section-title">Week Slate<span class="lock">Each pick's timeframe tag sets its lock time</span></div>
                ${header}
                ${rows}
            </div>`;
        }

        // The two note cards render once, at the bottom of the single slate
        const enterNotes = `
            <div class="section-notes">
                <div class="banner-warn">
                    <strong>Live:</strong> picks save automatically as you type. Cards alternate person, <strong>RJ on the dark cards, Nick on the steel cards</strong> (each card is tagged). Cards save to the <strong>week selected at the top of the page</strong>. A card saves once it is complete for its bet type (team, units, timeframe, plus any line or total); it shows a red ✕ until complete and a green check once saved. Edits to a saved card update it in place, and clearing a saved card's teams deletes that pick. <strong>Save all now</strong> is a backstop that pushes anything unsaved.
                </div>
                <div class="banner-warn">
                    <strong>${LOCK_ICON} Mortal Lock rules:</strong> pays 1.5× the units placed on either a win or a loss. <strong>Only one mortal lock per person per week</strong> — checking a new one auto-unchecks that person's previous lock.
                </div>
            </div>`;

        el.innerHTML = `
            <h2 style="color:var(--accent); text-transform:uppercase; letter-spacing:0.08em; font-size:1.05rem; margin:0.25rem 0 0.75rem;">Enter Picks</h2>
            <div class="lock-slots" id="enter-lock-slots"></div>
            ${slateSection()}
            ${enterNotes}
            <div class="panel-card">
                <div class="save-bar">
                    <button class="btn-save" id="save-btn" onclick="savePicks()">Save all now</button>
                    <span class="save-status" id="save-status"></span>
                </div>
            </div>`;

        // Initialize every row's visible fields to match its default bet type.
        el.querySelectorAll('.form-row').forEach(r => onBetTypeChange(r.dataset.uid));

        // Autosave wiring: one delegated listener pair for the merged panel
        // (assigned as properties so re-renders never stack duplicates). Any
        // typing (input) or field commit (change: selects, radios, the lock
        // checkbox, blur of a text field) schedules that row's own debounced
        // save; the row itself knows its person, and the week comes from the
        // global selector at save time. Every event also repaints the live
        // lock slots (cheap, pure display).
        el.oninput = (e) => {
            const row = e.target.closest('.form-row');
            if (row) scheduleRowSave(row);
            updateEnterLockSlots();
        };
        el.onchange = (e) => {
            const row = e.target.closest('.form-row');
            if (row) scheduleRowSave(row);
            updateEnterLockSlots();
        };
        // Populate the cards with the selected week's saved picks (also
        // paints the live lock slots), so returning never shows blank cards.
        hydrateEnterForm();
    }

    // ===== Spread / O-U / TTO grading rules =====
    // Reference implementation for Phase 2 — grading each pick after games
    // finalize. Not wired to anything yet, but centralized here so backend
    // grading has one source of truth.
    //
    // Spread convention (from RJ):
    //   Favorite line is negative (-N) — team must WIN by MORE than N.
    //     -6 → team wins by 7+ = WIN; wins by exactly 6 = PUSH; anything else = LOSS.
    //   Underdog line is positive (+N) — team must LOSE by LESS than N (or win outright).
    //     +8.5 → team loses by 8 or fewer / wins = WIN; loses by 9+ = LOSS. (No push on .5 lines.)
    //
    // O/U grading: totals over/under game total.
    //   O 55.5 → combined final points > 55.5 = WIN; < 55.5 = LOSS; equal = PUSH (only on whole lines).
    //
    // TTO grading: same as O/U but scored on ONE team's final points.
    //
    // Payout: unit-neutral bets pay 1× units on win, lose 1× units on loss.
    // Mortal locks pay 1.5× units on either.
    window.grade = {
        spread(pickedTeamScore, opponentScore, line) {
            // `line` is signed as recorded (e.g. -6 or +8.5)
            const margin = pickedTeamScore - opponentScore + Number(line);
            if (margin > 0) return 'win';
            if (margin < 0) return 'loss';
            return 'push';
        },
        overUnder(gameTotal, line, isOver) {
            const diff = gameTotal - Number(line);
            if (diff === 0) return 'push';
            const over = diff > 0;
            return over === isOver ? 'win' : 'loss';
        },
        teamTotalOver(teamScore, line, isOver) {
            return window.grade.overUnder(teamScore, line, isOver);
        },
        moneyline(pickedTeamScore, opponentScore) {
            if (pickedTeamScore > opponentScore) return 'win';
            if (pickedTeamScore < opponentScore) return 'loss';
            return 'push';
        },
        // Compute net units given grade + units + isMortalLock
        netUnits(grade, units, isMortalLock) {
            const multiplier = isMortalLock ? 1.5 : 1;
            if (grade === 'win')  return  units * multiplier;
            if (grade === 'loss') return -units * multiplier;
            return 0;
        },
    };

    // The week every enter-tab read and write uses: the global selector.
    // Enter is only reachable on the current season, where option values are
    // plain week numbers.
    function enterWeek() {
        return Math.max(0, Math.floor(Number(weekSel.value) || 0));
    }

    // Enforce one mortal lock per week PER PERSON — clicking a new lock
    // unchecks all other rows across every section in the SAME panel
    // (RJ's picks and Nick's picks are independent).
    window.onMortalLockChange = function(inputEl) {
        if (!inputEl.checked) return;   // unchecking is always allowed
        const panel = inputEl.closest('.panel');
        const ownRow = inputEl.closest('.form-row');
        if (!panel || !ownRow) return;
        // One lock per PERSON: only sweep cards belonging to the same person
        // as the card that was just locked, across all three sections.
        const person = ownRow.dataset.person;
        panel.querySelectorAll('.form-row').forEach(r => {
            if (r === ownRow || r.dataset.person !== person) return;
            const cb = r.querySelector('.lock-cell input.lock');
            if (cb && cb.checked) {
                cb.checked = false;
                // A programmatic uncheck fires no change event, so schedule
                // that row's autosave here to keep its saved pick in sync.
                scheduleRowSave(r);
            }
        });
    };

    // Toggle the visible fields per bet type. Kept globally callable so the
    // inline onchange handler works after the form is re-rendered.
    window.onBetTypeChange = function(uid) {
        const row = document.querySelector(`.form-row[data-uid="${uid}"]`);
        if (!row) return;
        const bt = row.querySelector('.bet-type').value;
        // Per-type class so the desktop grid can reflow the row per bet type
        // exactly like the phone flex layout does
        row.classList.remove('bt-ml', 'bt-spread', 'bt-ou', 'bt-tto');
        row.classList.add(bt === 'O/U' ? 'bt-ou' : 'bt-' + bt.toLowerCase());
        const signGroup = row.querySelector('.sign-slot');
        const sideH = row.querySelector('.side-h');
        const sideA = row.querySelector('.side-a');
        const points = row.querySelector('.points');

        const signLabels = signGroup.querySelectorAll('label');
        // signLabels: 0=−, 1=+, 2=O, 3=U
        const showSign = (idx, on) => signLabels[idx].classList.toggle('hidden-field', !on);
        // H/A bubbles: shown for ML/Spread/TTO (single-side bets),
        // hidden for O/U (both sides bet the total together — no "side" concept).
        sideH.classList.toggle('hidden-field', bt === 'O/U');
        sideA.classList.toggle('hidden-field', bt === 'O/U');

        if (bt === 'ML') {
            // ML now takes an actual line: -/+ bubble + line value (e.g. -110, +145)
            showSign(0,true); showSign(1,true); showSign(2,false); showSign(3,false);
            points.classList.remove('hidden-field');
            points.placeholder = 'Line';
        } else if (bt === 'Spread') {
            showSign(0,true); showSign(1,true); showSign(2,false); showSign(3,false);
            points.classList.remove('hidden-field');
            points.placeholder = 'Spread';
        } else if (bt === 'O/U') {
            showSign(0,false); showSign(1,false); showSign(2,true); showSign(3,true);
            points.classList.remove('hidden-field');
            points.placeholder = 'Total';
        } else if (bt === 'TTO') {
            showSign(0,false); showSign(1,false); showSign(2,true); showSign(3,true);
            points.classList.remove('hidden-field');
            points.placeholder = 'Team total';
        }
    };

    /* ===== Team typeahead =====
       One reusable dropdown for every .team-input (home and away, all rows,
       both people). Typing 1+ characters filters FBS_TEAMS live; the
       TEAM_ABBR shorthand map is searched too (typing "asu" surfaces
       "Arizona State"). Selecting an option fills the input and dispatches a
       real bubbling input event, so the delegated autosave wiring fires
       exactly as if the name had been typed. */
    const TA_MAX_RESULTS = 8;

    // Ranked matcher: name-prefix hits first, then abbreviation-prefix, then
    // name-contains, then abbreviation-contains. Deduped, capped at 8.
    function teamMatches(raw) {
        const q = (raw || '').trim().toLowerCase();
        if (!q) return [];
        const namePrefix = [], nameContains = [], abbrPrefix = [], abbrContains = [];
        for (const t of FBS_TEAMS) {
            const lower = t.toLowerCase();
            if (lower.startsWith(q)) namePrefix.push(t);
            else if (lower.includes(q)) nameContains.push(t);
        }
        for (const [ab, canon] of Object.entries(TEAM_ABBR)) {
            if (ab.startsWith(q)) abbrPrefix.push(canon);
            else if (ab.includes(q)) abbrContains.push(canon);
        }
        const out = [];
        for (const t of [...namePrefix, ...abbrPrefix, ...nameContains, ...abbrContains]) {
            if (!out.includes(t)) out.push(t);
            if (out.length === TA_MAX_RESULTS) break;
        }
        return out;
    }

    const teamDropdown = document.createElement('div');
    teamDropdown.className = 'team-typeahead';
    document.body.appendChild(teamDropdown);
    let taInput = null;        // the input the dropdown is currently attached to
    let taOptions = [];
    let taActiveIdx = -1;      // keyboard-highlighted row
    let taSuppress = false;    // ignore the input event we dispatch ourselves

    function taVisible() { return teamDropdown.style.display === 'block'; }

    // Position in document coordinates (rect + page scroll), directly under
    // the field. Absolute positioning rides the page's natural scroll, which
    // is what keeps it aligned while the iOS keyboard is up; no fixed or
    // visual-viewport tricks needed.
    function positionTeamDropdown(input) {
        const r = input.getBoundingClientRect();
        teamDropdown.style.left = (r.left + window.scrollX) + 'px';
        teamDropdown.style.top = (r.bottom + window.scrollY + 2) + 'px';
        teamDropdown.style.width = Math.max(200, r.width) + 'px';
    }

    function hideTeamDropdown() {
        teamDropdown.style.display = 'none';
        teamDropdown.innerHTML = '';
        taInput = null; taOptions = []; taActiveIdx = -1;
    }

    function taMarkActive(idx) {
        taActiveIdx = idx;
        [...teamDropdown.children].forEach((c, i) => c.classList.toggle('active', i === idx));
        const el = teamDropdown.children[idx];
        if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    }

    function pickTeam(name) {
        const input = taInput;
        hideTeamDropdown();
        if (!input) return;
        input.value = name;
        // Real bubbling input event: the panel's delegated autosave handler
        // (and anything else listening) reacts exactly as if typed. The
        // suppress flag keeps our own listener from instantly reopening.
        taSuppress = true;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        taSuppress = false;
    }

    function updateTeamDropdown(input) {
        const matches = teamMatches(input.value);
        if (!matches.length) { hideTeamDropdown(); return; }
        taInput = input;
        taOptions = matches;
        taActiveIdx = -1;
        teamDropdown.innerHTML = '';
        matches.forEach((name, i) => {
            const row = document.createElement('div');
            row.className = 'tt-option';
            row.textContent = name;
            // pointerdown fires BEFORE the input's blur, and preventDefault
            // stops the focus change entirely, so a finger tap on an option
            // always lands (the classic touch race with blur-to-close).
            row.addEventListener('pointerdown', (e) => { e.preventDefault(); pickTeam(name); });
            row.addEventListener('mouseenter', () => taMarkActive(i));
            teamDropdown.appendChild(row);
        });
        positionTeamDropdown(input);
        teamDropdown.style.display = 'block';
    }

    // Typing in any team input (re)filters the dropdown; switching to the
    // other team input moves the dropdown to it on the first keystroke.
    document.addEventListener('input', (e) => {
        const t = e.target;
        if (!t.classList || !t.classList.contains('team-input')) return;
        if (taSuppress) return;
        updateTeamDropdown(t);
    });

    // Desktop keys: arrows move the highlight, Enter selects (never submits
    // while the dropdown is open), Escape closes.
    document.addEventListener('keydown', (e) => {
        if (!taVisible() || e.target !== taInput) return;
        if (e.key === 'ArrowDown') {
            e.preventDefault();
            taMarkActive((taActiveIdx + 1) % taOptions.length);
        } else if (e.key === 'ArrowUp') {
            e.preventDefault();
            taMarkActive((taActiveIdx - 1 + taOptions.length) % taOptions.length);
        } else if (e.key === 'Enter') {
            e.preventDefault();
            pickTeam(taOptions[taActiveIdx >= 0 ? taActiveIdx : 0]);
        } else if (e.key === 'Escape') {
            hideTeamDropdown();
        }
    });

    // Tap or click anywhere outside closes it (taps on options are inside
    // the dropdown, so they never match this).
    document.addEventListener('pointerdown', (e) => {
        if (!taVisible()) return;
        if (teamDropdown.contains(e.target) || e.target === taInput) return;
        hideTeamDropdown();
    });

    // Blur closes it after a short delay as a fallback for environments
    // without pointer events; the delay lets an option tap land first.
    document.addEventListener('focusout', (e) => {
        const t = e.target;
        if (!t.classList || !t.classList.contains('team-input')) return;
        setTimeout(() => {
            if (taInput === t && document.activeElement !== t) hideTeamDropdown();
        }, 150);
    });

    // Keep the panel glued to its input if the window resizes while open
    window.addEventListener('resize', () => {
        if (taVisible() && taInput) positionTeamDropdown(taInput);
    });

    /* ===== Saving picks to Supabase ===== */
    // Turn one form row into {pick, bet_type, units, mortal_lock} the way a
    // human would write the pick string in the sheet:
    //   Spread: "K State -3"
    //   O/U:    "Sam Houston/WKU Over 60.5"
    //   TTO:    "UNLV Over 48.5 Team Total"
    //   ML:     "Stanford"
    // Returns null when the row has no team at all (never saves an empty pick).
    function buildPickFromRow(row) {
        const bt = row.querySelector('.bet-type').value;
        const home = (row.querySelector('.home').value || '').trim();
        const away = (row.querySelector('.away').value || '').trim();
        if (!home && !away) return null;

        const sideEl = row.querySelector('input[name^="side-"]:checked');
        const side = sideEl ? sideEl.value : null;
        const signEl = row.querySelector('.sign-slot input:checked');
        const sign = signEl ? signEl.value : null;
        const ptsRaw = (row.querySelector('.points').value || '').trim();
        const pts = ptsRaw === '' ? null : Number(ptsRaw);
        const hasPts = pts !== null && !isNaN(pts);
        const units = Number(row.querySelector('.units').value);
        const lock = row.querySelector('.lock-cell input.lock').checked;

        // Picked team: follow the H/A bubble; degrade to whichever field is filled
        let team;
        if (side === 'A') team = away || home;
        else team = home || away;

        let pick = '';
        if (bt === 'ML') {
            pick = team;
        } else if (bt === 'Spread') {
            if (!hasPts) pick = team;
            else if (sign === '-' || sign === '+') pick = team + ' ' + sign + Math.abs(pts);
            else pick = team + ' ' + (pts >= 0 ? '+' : '') + pts;   // no bubble chosen, keep the typed sign
        } else if (bt === 'O/U') {
            const teams = [home, away].filter(Boolean).join('/');
            const ou = sign === 'U' ? 'Under' : 'Over';
            pick = teams + ' ' + ou + (hasPts ? ' ' + pts : '');
        } else if (bt === 'TTO') {
            const ou = sign === 'U' ? 'Under' : 'Over';
            pick = team + ' ' + ou + (hasPts ? ' ' + pts : '') + ' Team Total';
        }
        pick = pick.trim();
        if (!pick) return null;
        return { pick, bet_type: bt, units: isNaN(units) ? 0 : units, mortal_lock: lock };
    }

    // Completeness per bet type. Every pick needs a team, units, and a
    // timeframe tag; Spread also needs a signed line, O/U and TTO need a
    // direction and points. Only complete rows earn the green check and only
    // complete rows autosave; until then the status shows a red X.
    function isRowComplete(row) {
        const built = buildPickFromRow(row);
        if (!built || !(built.units > 0)) return false;
        if (!row.querySelector('.timeframe input:checked')) return false;
        const bt = built.bet_type;
        if (bt === 'ML') return true;
        const signEl = row.querySelector('.sign-slot input:checked');
        const ptsRaw = (row.querySelector('.points').value || '').trim();
        const hasPts = ptsRaw !== '' && !isNaN(Number(ptsRaw));
        if (!hasPts) return false;
        if (bt === 'Spread') {
            // The sign can come from the bubble or be typed into the number
            return (signEl && (signEl.value === '-' || signEl.value === '+'))
                || ptsRaw.startsWith('-') || ptsRaw.startsWith('+');
        }
        // O/U and TTO need an explicit Over or Under direction
        return !!signEl && (signEl.value === 'O' || signEl.value === 'U');
    }

    /* ===== Structured fields persistence =====
       The pick STRING is lossy (an ML pick never mentions the away team, so
       side and opponent information cannot round-trip through it). Every
       write therefore also stores the raw form state in a jsonb column
       named fields, and hydration restores it verbatim. Feature-detected so
       the site keeps working in legacy mode until the column exists. */
    let FIELDS_COLUMN_OK = false;
    async function probeFieldsColumn() {
        try {
            await sb('/rest/v1/pickem_picks?select=fields&limit=1');
            FIELDS_COLUMN_OK = true;
        } catch (e) {
            FIELDS_COLUMN_OK = false;   // column missing: omit fields from writes
        }
    }

    // The raw row state exactly as the form holds it right now. The
    // timeframe tag rides along as fields.section, no schema change needed.
    function captureRowFields(row) {
        const sideEl = row.querySelector('input[name^="side-"]:checked');
        const signEl = row.querySelector('.sign-slot input:checked');
        const tfEl = row.querySelector('.timeframe input:checked');
        return {
            bet_type: row.querySelector('.bet-type').value,
            section: tfEl ? tfEl.value : null,
            side: sideEl ? sideEl.value : null,
            home: row.querySelector('.home').value,
            away: row.querySelector('.away').value,
            sign: signEl ? signEl.value : null,
            points: row.querySelector('.points').value,
            units: row.querySelector('.units').value,
            lock: row.querySelector('.lock-cell input.lock').checked,
        };
    }

    /* ===== Autosave engine =====
       A row saves itself once it is COMPLETE (at least one team + units),
       debounced per row so mid-typing never fires a request. The first save
       POSTs and remembers the DB id on the row (data-saved-id); every later
       edit to that row PATCHes the same id, so tweaking a field can never
       duplicate a pick. Clearing a saved row's team fields DELETEs it.
       Saves refresh SEASONS quietly (no panel re-render), so typing in one
       row never wipes another row's in-progress input; Week Picks and the
       analytics tabs pick up the new data next time they render. */
    const AUTOSAVE_DEBOUNCE_MS = 800;

    function setRowStatus(row, state) {
        const el = row.querySelector('.row-status');
        if (!el) return;
        el.classList.remove('saving', 'saved', 'retry', 'incomplete');
        el.onclick = null;
        el.title = '';
        if (state === 'saving') {
            el.textContent = 'saving...';
            el.classList.add('saving');
        } else if (state === 'saved') {
            el.textContent = '✓';
            el.classList.add('saved');
            el.title = 'Saved';
        } else if (state === 'retry') {
            el.textContent = 'retry';
            el.classList.add('retry');
            el.title = 'Save failed, tap to try again';
            el.onclick = () => autosaveRow(row);
        } else if (state === 'locked') {
            el.textContent = 'locked';
            el.title = 'Lock time passed, this pick can no longer be edited';
        } else if (state === 'incomplete') {
            // Status indicator only, deliberately not clickable
            el.textContent = '✕';
            el.classList.add('incomplete');
            el.title = 'Pick incomplete, fill every field for its bet type to save';
        } else {
            el.textContent = '';
        }
    }

    // The person a row belongs to comes from the card itself (data-person),
    // never from panel context, so alternating RJ/Nick cards can never
    // cross-attribute a save.
    function rowPerson(row) {
        return row.dataset.person === 'nick' ? 'nick' : 'rj';
    }

    // Debounce is per row: each row carries its own timer, so typing in row 3
    // never delays or triggers row 5. Never schedules on archived seasons or
    // on rows hydrated as locked (past their lock time).
    function scheduleRowSave(row) {
        if (seasonSel.value !== RAW.season) return;
        if (row.dataset.locked) return;
        row._pendingSave = true;
        clearTimeout(row._saveTimer);
        row._saveTimer = setTimeout(() => autosaveRow(row), AUTOSAVE_DEBOUNCE_MS);
    }

    // Save one row now. Returns true on success, false on failure, null when
    // there was nothing to do. Serialized per row: if a save is already in
    // flight the new edit is marked dirty and re-runs when the first finishes,
    // so an in-flight POST can never race a second POST into a duplicate.
    async function autosaveRow(row) {
        if (seasonSel.value !== RAW.season) return null;
        if (row.dataset.locked) return null;   // past lock time: read-only
        if (row._saving) { row._dirty = true; return null; }
        row._pendingSave = false;
        clearTimeout(row._saveTimer);

        const built = buildPickFromRow(row);
        const savedId = row.dataset.savedId || '';

        if (!built && !savedId) { setRowStatus(row, ''); return null; }   // empty, never saved
        if (built && !isRowComplete(row)) {
            // Incomplete for its bet type: red X, no save. A previously
            // saved row keeps its DB copy until it is complete again
            // (PATCH) or its teams are fully cleared (DELETE).
            setRowStatus(row, 'incomplete');
            return null;
        }

        row._saving = true;
        setRowStatus(row, 'saving');
        let ok = false;
        try {
            if (!built) {
                // Saved row whose team fields were cleared: that is the
                // natural way to remove a just-entered pick, so delete it.
                await sb('/rest/v1/pickem_picks?id=eq.' + encodeURIComponent(savedId), { method: 'DELETE' });
                delete row.dataset.savedId;
                // Phantom-lock fix: fully disarm the cleared card. A checked
                // lock left behind here would silently ride along on the
                // NEXT pick typed into this same card.
                const lockCb = row.querySelector('.lock-cell input.lock');
                if (lockCb) lockCb.checked = false;
                setRowStatus(row, '');
                updateEnterLockSlots();
            } else if (savedId) {
                // Later edit of an already-saved row: PATCH the same id.
                // Week and person never change here; only new saves use the
                // current Week box value.
                const patchBody = { pick: built.pick, bet_type: built.bet_type,
                                    units: built.units, mortal_lock: built.mortal_lock };
                if (FIELDS_COLUMN_OK) patchBody.fields = captureRowFields(row);
                await sb('/rest/v1/pickem_picks?id=eq.' + encodeURIComponent(savedId), {
                    method: 'PATCH',
                    body: patchBody,
                });
                setRowStatus(row, 'saved');
            } else {
                // First save of this row: POST with the card's own person and
                // remember the returned id.
                const week = enterWeek();
                const postBody = { season: RAW.season, week: week, person: rowPerson(row),
                                   pick: built.pick, bet_type: built.bet_type,
                                   units: built.units, mortal_lock: built.mortal_lock };
                if (FIELDS_COLUMN_OK) postBody.fields = captureRowFields(row);
                const res = await sb('/rest/v1/pickem_picks', {
                    method: 'POST',
                    body: [postBody],
                });
                const id = res && res[0] && res[0].id;
                if (id !== undefined && id !== null) row.dataset.savedId = String(id);
                setRowStatus(row, 'saved');
            }
            ok = true;
            refreshLiveSeason(true);   // quiet: update data + toolbar, no panel re-render
        } catch (e) {
            setRowStatus(row, 'retry');
        } finally {
            row._saving = false;
            if (row._dirty) { row._dirty = false; scheduleRowSave(row); }
        }
        return ok;
    }

    // Backstop button ("Save all now"): force-saves every complete card that
    // has not saved yet (both people's), flushes cards with pending debounced
    // edits, and re-attempts cards sitting in the red retry state.
    window.savePicks = async function() {
        if (seasonSel.value !== RAW.season) return;
        const panel = document.getElementById('enter');
        const saveBtn = document.getElementById('save-btn');
        const setStatus = (msg, cls) => {
            const el = document.getElementById('save-status');
            if (el) { el.textContent = msg; el.className = 'save-status' + (cls ? ' ' + cls : ''); }
        };

        if (saveBtn) saveBtn.disabled = true;
        setStatus('Saving...', '');
        let saved = 0, failed = 0, skippedIncomplete = 0;
        for (const row of panel.querySelectorAll('.form-row')) {
            const built = buildPickFromRow(row);
            const savedId = row.dataset.savedId || '';
            if (!built && !savedId) continue;                              // empty row
            if (built && !isRowComplete(row)) {
                if (!savedId) skippedIncomplete++;                         // started but incomplete
                continue;
            }
            const statusEl = row.querySelector('.row-status');
            const needsSave = !savedId || row._pendingSave || !built
                              || (statusEl && statusEl.classList.contains('retry'));
            if (!needsSave) continue;                                      // saved and clean
            const ok = await autosaveRow(row);
            if (ok === true) saved++;
            else if (ok === false) failed++;
        }
        if (saveBtn) saveBtn.disabled = false;
        if (saved || failed) {
            setStatus('Saved ' + saved + ' pick(s).'
                + (failed ? ' ' + failed + ' failed, tap retry on the row or press again.' : '')
                + (skippedIncomplete ? ' ' + skippedIncomplete + ' row(s) incomplete.' : ''),
                failed ? 'err' : 'ok');
        } else {
            setStatus(skippedIncomplete
                ? skippedIncomplete + ' row(s) are incomplete for their bet type.'
                : 'Everything is already saved.', skippedIncomplete ? 'err' : 'ok');
        }
    };

    /* ===== Enter form hydration =====
       The form used to rebuild BLANK on every visit, so returning to the
       Enter tab after a save showed empty cards even though the picks were
       safe in the DB. Hydration rebuilds the single slate from the saved
       picks for the week chosen in the global selector, sequentially per
       person. Every hydrated card carries its data-saved-id, so edits PATCH
       and clearing DELETEs, and a re-typed pick can never duplicate. */

    // Best-effort inverse of buildPickFromRow. Strings our own builder wrote
    // round-trip exactly; anything unrecognized lands raw in the home field,
    // which ML rebuilds verbatim and other types keep visible and editable.
    function parsePickToFields(pick, betType) {
        const s = (pick || '').trim();
        if (betType === 'Spread') {
            const m = s.match(/^(.+?)\s+([+-])(\d+(?:\.\d+)?)$/);
            if (m) return { home: m[1], sign: m[2], pts: m[3] };
            return { home: s };
        }
        if (betType === 'O/U') {
            const m = s.match(/^(.+?)\s+(Over|Under)(?:\s+(\d+(?:\.\d+)?))?$/i);
            if (m) {
                const teams = m[1].split('/');
                return { home: (teams[0] || '').trim(), away: (teams[1] || '').trim(),
                         sign: m[2].toLowerCase() === 'under' ? 'U' : 'O', pts: m[3] || '' };
            }
            return { home: s };
        }
        if (betType === 'TTO') {
            const m = s.match(/^(.+?)\s+(Over|Under)(?:\s+(\d+(?:\.\d+)?))?\s+Team\s+Total$/i);
            if (m) return { home: m[1], sign: m[2].toLowerCase() === 'under' ? 'U' : 'O', pts: m[3] || '' };
            return { home: s };
        }
        return { home: s };   // ML: the whole string is the team
    }

    // Blank one card completely: fields, radios, lock, saved id, timers.
    // Programmatic value changes fire no events, so this never autosaves.
    // Every editable control in one card, for enabling and disabling
    function rowControls(row) {
        return [row.querySelector('.bet-type'), row.querySelector('.home'),
                row.querySelector('.away'), row.querySelector('.points'),
                row.querySelector('.units'), row.querySelector('.lock-cell input.lock')]
            .concat([...row.querySelectorAll('input[type="radio"]')])
            .filter(Boolean);
    }

    function resetFormRow(row) {
        delete row.dataset.savedId;
        delete row.dataset.locked;
        row._pendingSave = false;
        row._dirty = false;
        clearTimeout(row._saveTimer);
        rowControls(row).forEach(c => { c.disabled = false; });
        row.querySelector('.bet-type').value = 'ML';
        row.querySelector('.home').value = '';
        row.querySelector('.away').value = '';
        row.querySelector('.points').value = '';
        row.querySelector('.units').value = '';
        row.querySelector('.lock-cell input.lock').checked = false;
        row.querySelectorAll('input[type="radio"]').forEach(r => { r.checked = false; });
        onBetTypeChange(row.dataset.uid);
        setRowStatus(row, '');
    }

    // Marks a hydrated card read-only once its lock time has passed: inputs
    // disabled (so no events, so autosave cannot PATCH), card dimmed, and a
    // small locked note in the status column. The save path also refuses
    // rows carrying data-locked as a second line of defense.
    function applyRowLockState(row, locked) {
        if (!locked) return;
        row.dataset.locked = '1';
        rowControls(row).forEach(c => { c.disabled = true; });
        setRowStatus(row, 'locked');
    }

    function fillFormRowFromPick(row, p, locked) {
        if (p._id !== undefined && p._id !== null) row.dataset.savedId = String(p._id);
        const betSel = row.querySelector('.bet-type');

        // Preferred path: the stored structured fields restore every input
        // verbatim, home and away teams included, so nothing can shift
        // columns. Legacy rows without fields fall back to text parsing.
        const sf = (p.fields && typeof p.fields === 'object') ? p.fields : null;
        if (sf) {
            betSel.value = ['ML', 'Spread', 'O/U', 'TTO'].includes(sf.bet_type) ? sf.bet_type : 'ML';
            onBetTypeChange(row.dataset.uid);
            row.querySelector('.home').value = sf.home || '';
            row.querySelector('.away').value = sf.away || '';
            if (sf.side === 'H' || sf.side === 'A') {
                const sideRadio = row.querySelector(sf.side === 'A' ? '.side-a input' : '.side-h input');
                if (sideRadio) sideRadio.checked = true;
            }
            if (sf.sign) {
                const signRadio = row.querySelector('.sign-slot input[value="' + sf.sign + '"]');
                if (signRadio) signRadio.checked = true;
            }
            if (sf.section) {
                const tfRadio = row.querySelector('.timeframe input[value="' + sf.section + '"]');
                if (tfRadio) tfRadio.checked = true;
            }
            row.querySelector('.points').value = sf.points || '';
            row.querySelector('.units').value = sf.units || '';
            row.querySelector('.lock-cell input.lock').checked = !!sf.lock;
            // Green check only for complete picks; a legacy row missing its
            // timeframe tag shows the red X until someone tags it
            setRowStatus(row, isRowComplete(row) ? 'saved' : 'incomplete');
            applyRowLockState(row, locked);
            return;
        }

        const bt = ['ML', 'Spread', 'O/U', 'TTO'].includes(p.bet_type) ? p.bet_type : 'ML';
        betSel.value = bt;
        onBetTypeChange(row.dataset.uid);
        const f = parsePickToFields(p.pick, bt);
        row.querySelector('.home').value = f.home || '';
        row.querySelector('.away').value = f.away || '';
        if (f.sign) {
            const radio = row.querySelector('.sign-slot input[value="' + f.sign + '"]');
            if (radio) radio.checked = true;
        }
        row.querySelector('.points').value = f.pts || '';
        row.querySelector('.units').value = (p.units === null || p.units === undefined) ? '' : p.units;
        row.querySelector('.lock-cell input.lock').checked = !!p.mortal_lock;
        setRowStatus(row, isRowComplete(row) ? 'saved' : 'incomplete');
        applyRowLockState(row, locked);
    }

    function hydrateEnterForm() {
        const panel = document.getElementById('enter');
        if (!panel) return;
        const wk = enterWeek();
        const wData = (SEASONS[RAW.season] || []).find(x => x.week === wk);
        panel.querySelectorAll('.form-row').forEach(resetFormRow);
        if (wData) {
            // Single slate: saved picks fill each person's cards in order
            for (const who of ['rj', 'nick']) {
                const rows = panel.querySelectorAll('.form-row[data-person="' + who + '"]');
                const picks = wData[who].picks;
                for (let i = 0; i < picks.length && i < rows.length; i++) {
                    fillFormRowFromPick(rows[i], picks[i], pickIsLocked(picks[i], wk));
                }
            }
        }
        updateEnterLockSlots();
    }

    // True when the cards already show exactly the saved ids the data holds
    // for that week. Stops the form from reshuffling right after one of our
    // own autosaves (the new id is already sitting on its card).
    function enterFormMatchesData(wData) {
        const panel = document.getElementById('enter');
        if (!panel) return true;
        const domIds = [...panel.querySelectorAll('.form-row')]
            .map(r => r.dataset.savedId).filter(Boolean).sort();
        const dataIds = [];
        if (wData) {
            for (const who of ['rj', 'nick']) {
                for (const p of wData[who].picks) {
                    if (p._id !== undefined && p._id !== null) dataIds.push(String(p._id));
                }
            }
        }
        dataIds.sort();
        return domIds.length === dataIds.length && domIds.every((v, i) => v === dataIds[i]);
    }

    // After fresh data lands: rebuild the form only when the Enter tab is
    // active, nothing is unsaved (never clobber in-progress typing), and the
    // data actually differs from what the cards already show.
    function rehydrateEnterIfIdle() {
        const activeTab = document.querySelector('.tab.active');
        if (!activeTab || activeTab.dataset.panel !== 'enter') return;
        if (enterPanelHasUnsavedWork()) return;
        const wk = enterWeek();
        const wData = (SEASONS[RAW.season] || []).find(x => x.week === wk);
        if (!enterFormMatchesData(wData)) hydrateEnterForm();
    }

    /* ===== Live lock slots on the Enter tab =====
       Pure status display, never any grading buttons. Priority per person:
       1) a lock CHECKED on a form card right now, shown live from the row's
          current fields (however partial) and rebuilt on every keystroke;
       2) otherwise the already-saved lock for the week in the Week box;
       3) otherwise "no lock yet". */
    function enterSlotHtml(who, label) {
        const panel = document.getElementById('enter');
        let bodyHtml = null;
        if (panel) {
            for (const row of panel.querySelectorAll('.form-row[data-person="' + who + '"]')) {
                const cb = row.querySelector('.lock-cell input.lock');
                if (!cb || !cb.checked) continue;
                const built = buildPickFromRow(row);
                const pickHtml = built ? built.pick : '<span class="slot-empty">no team yet</span>';
                const uVal = (row.querySelector('.units').value || '').trim();
                bodyHtml = `<div class="slot-pick">${pickHtml}</div>
                    <div class="slot-meta">${uVal ? uVal + ' u' : 'no units yet'}</div>`;
                break;
            }
        }
        if (bodyHtml === null) {
            const wk = enterWeek();
            const wData = (SEASONS[RAW.season] || []).find(x => x.week === wk);
            const saved = wData ? wData[who].picks.find(p => p.mortal_lock) : null;
            if (saved) {
                bodyHtml = `<div class="slot-pick">${saved.pick}</div>
                    <div class="slot-meta">${saved.units ?? '—'} u · saved</div>`;
            }
        }
        if (bodyHtml === null) bodyHtml = '<div class="slot-empty">no lock yet</div>';
        return `<div class="lock-slot ${who}">
            <div class="slot-title">${label} Mortal Lock ${LOCK_ICON}</div>
            ${bodyHtml}
        </div>`;
    }
    function updateEnterLockSlots() {
        const box = document.getElementById('enter-lock-slots');
        if (!box) return;
        box.innerHTML = enterSlotHtml('rj', 'RJ') + enterSlotHtml('nick', 'Nick');
    }

    /* ===== Grading picks (Week Picks tab, current season only) ===== */
    // W and L pay 1x the units, or 1.5x on a mortal lock. P is a push, net 0.
    // X clears the grade back to pending (outcome and net both null).
    window.gradePick = async function(id, action, units, isLock) {
        const mult = isLock ? 1.5 : 1;
        let body;
        if (action === 'W') body = { outcome: 'W', net: units * mult };
        else if (action === 'L') body = { outcome: 'L', net: -units * mult };
        else if (action === 'P') body = { outcome: 'push', net: 0 };
        else body = { outcome: null, net: null };
        try {
            await sb('/rest/v1/pickem_picks?id=eq.' + encodeURIComponent(id), { method: 'PATCH', body: body });
            await refreshLiveSeason();
        } catch (e) {
            showLiveWarn('Could not save the grade: ' + (e && e.message ? e.message : e));
        }
    };

    window.deletePick = async function(id, lockMs) {
        // Refuse past the pick's lock time even if a stale tab still shows
        // the trash button
        if (lockMs && Date.now() > lockMs) {
            alert('Locked since ' + new Date(lockMs).toLocaleString() + '. Picks cannot be deleted after their lock time.');
            return;
        }
        if (!confirm('Delete this pick? This removes it from the database for both of you.')) return;
        try {
            await sb('/rest/v1/pickem_picks?id=eq.' + encodeURIComponent(id), { method: 'DELETE' });
            await refreshLiveSeason();
        } catch (e) {
            showLiveWarn('Could not delete the pick: ' + (e && e.message ? e.message : e));
        }
    };

    /* ===== Summary badge in toolbar (updates with week change) =====
       Layout left-to-right: Week Winner  ·  Season Tally (cumulative)  ·  Week Stats */
    function renderSummary() {
        const weeks = SEASONS[seasonSel.value] || [];
        const w = findSelectedWeek(weeks);
        const el = document.getElementById('summary');
        if (!w) { el.innerHTML = ''; return; }
        const n = numOrZero(w.nick.total_net);
        const r = numOrZero(w.rj.total_net);
        // A week with no picks at all has no winner yet (archived seasons
        // never hit this, every archived week has at least one pick)
        const hasPicks = (w.nick.picks.length + w.rj.picks.length) > 0;
        const winner = !hasPicks ? '—' : (n > r ? 'Nick' : (r > n ? 'RJ' : 'Tie'));
        // Season-to-date tallies (all weeks in the season, not just current)
        let nSeason = 0, rSeason = 0;
        for (const wk of weeks) {
            nSeason += numOrZero(wk.nick.total_net);
            rSeason += numOrZero(wk.rj.total_net);
        }
        // Tidy stacked rows: winner, season totals, week totals. Each row is
        // guaranteed a single line; nothing wraps into orphan pills. The old
        // "Wk N" pill is gone (it duplicated the week selector, which still
        // gets its default from the Monday auto-advance).
        el.innerHTML = `
            <div class="sum-row">Week winner: <strong style="color:var(--accent)">${winner}</strong></div>
            <div class="sum-row">Season:
                <strong class="${nSeason >= 0 ? 'net-good' : 'net-bad'}">Nick ${fmtNet(nSeason)}u</strong>
                <span class="sum-sep">|</span>
                <strong class="${rSeason >= 0 ? 'net-good' : 'net-bad'}">RJ ${fmtNet(rSeason)}u</strong>
            </div>
            <div class="sum-row">Week:
                <strong class="${n >= 0 ? 'net-good' : 'net-bad'}">Nick ${fmtNet(n)}u</strong>
                <span class="sum-sep">|</span>
                <strong class="${r >= 0 ? 'net-good' : 'net-bad'}">RJ ${fmtNet(r)}u</strong>
            </div>`;
    }

    function renderAll() {
        renderSummary();
        const active = document.querySelector('.tab.active').dataset.panel;
        if (active === 'picks') renderPicks();
        else if (active === 'h2h') renderH2H();
        else if (active === 'teams') renderTeams();
        else if (active === 'locks') renderLocks();
        else if (active === 'rules') renderRules();
        else if (active === 'enter') renderEnter();
        makeCollapsible(document.querySelector('.panel.active'));
    }

    // Wire every panel-card with an <h3> so you can click the header to
    // collapse/expand the card body. Idempotent — safe to call after re-renders.
    function makeCollapsible(root) {
        if (!root) return;
        root.querySelectorAll('.panel-card > h3:first-child').forEach(h => {
            if (h.dataset.collapsibleReady) return;
            h.dataset.collapsibleReady = '1';
            h.classList.add('collapsible-h3');
            const chev = document.createElement('span');
            chev.className = 'chev';
            chev.textContent = '▾';
            h.prepend(chev);
            h.addEventListener('click', () => {
                const card = h.parentElement;
                card.classList.toggle('collapsed');
            });
        });
    }
    /* ===== Stale tab defense =====
       Phone browsers keep serving days-old tabs (bfcache and frozen tabs),
       which resurrects retired versions of this page. When an old tab comes
       back after more than 6 hours we hard-reload it once to pick up the
       latest published page, UNLESS the enter form holds unsaved work, in
       which case we only refresh data quietly and never risk the input.
       Every return to visibility also quietly refreshes so the other
       person's fresh picks appear. */
    const PAGE_LOADED_AT = Date.now();
    const STALE_PAGE_MS = 6 * 60 * 60 * 1000;
    let stalePageReloaded = false;   // one attempt ever, so no reload loop

    // True when any enter-form row has content that never saved, a pending
    // debounced save, a save in flight, or a failed save waiting on retry.
    function enterPanelHasUnsavedWork() {
        for (const row of document.querySelectorAll('#enter .form-row')) {
            if (row._pendingSave || row._saving) return true;
            const statusEl = row.querySelector('.row-status');
            if (statusEl && statusEl.classList.contains('retry')) return true;
            if (!row.dataset.savedId && buildPickFromRow(row)) return true;
        }
        return false;
    }

    // Refresh data without ever wiping form input: quiet (no panel render)
    // when an Enter tab is active, full otherwise. renderAll only re-renders
    // the ACTIVE panel, so a hidden enter panel's rows are safe either way.
    function refreshRespectingEnterPanel() {
        const active = document.querySelector('.tab.active');
        const onEnter = !!active && active.dataset.panel === 'enter';
        refreshLiveSeason(onEnter);
    }

    function maybeReloadStalePage() {
        if (stalePageReloaded) return;
        if (Date.now() - PAGE_LOADED_AT <= STALE_PAGE_MS) return;
        if (enterPanelHasUnsavedWork()) { refreshRespectingEnterPanel(); return; }
        stalePageReloaded = true;
        location.reload();
    }

    window.addEventListener('pageshow', (e) => {
        // Only bfcache restores matter here; on a normal load PAGE_LOADED_AT
        // was just set, so there is nothing to do.
        if (!e.persisted) return;
        maybeReloadStalePage();
        refreshRespectingEnterPanel();
    });
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState !== 'visible') return;
        maybeReloadStalePage();
        refreshRespectingEnterPanel();
    });

    updateEnterTabsForSeason();
    renderAll();
    // Kick off the live fetch for the current season. When it resolves it
    // swaps SEASONS[RAW.season] and re-renders; archived seasons never fetch.
    // The fields-column probe runs alongside so writes know whether the
    // structured fields column exists yet.
    probeFieldsColumn();
    refreshLiveSeason();
</script>
</body>
</html>
