<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick'em | RJ & Nick — Head to Head</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- Page-only favicon: a simple leather football with laces, inline SVG so
     no shared favicon file lands in the repo -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cg transform='rotate(-30 16 16)'%3E%3Cellipse cx='16' cy='16' rx='13' ry='8.5' fill='%238B4A2B' stroke='%235C2E14' stroke-width='1'/%3E%3Cpath d='M10 16h12' stroke='white' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M12 13.5v5M14.7 13.5v5M17.3 13.5v5M20 13.5v5' stroke='white' stroke-width='1.2' stroke-linecap='round'/%3E%3C/g%3E%3C/svg%3E">
<style>
    :root {
        --bg: #07100f;
        --surface: #0f151d;
        --card: #0d1218;
        --line: #1c2732;
        --ink: #f1f3f5;
        --dim: #8b96a5;
        --accent: #42e58a;
        --accent-bright: #5ff2a4;
        --accent-glow: rgba(66, 229, 138, 0.55);
        --accent-glow-strong: rgba(95, 242, 164, 0.75);
        --good: #42e58a;
        --bad: #ef4444;
        --lock-blue: #2563eb;        /* deep royal blue, the mortal lock family */
        --lock-blue-deep: #1e40af;   /* deepest shade, used for card washes */
        --lock-blue-bright: #60a5fa; /* readable light blue for lock text on dark */
        /* Nick's cards: muted steel gray with a cool cast, clearly apart
           from RJ's near-black cards but still in the dark family */
        --nick-bg: #182532;
        --nick-line: #30465a;
        /* Monochrome padlock shape for CSS pseudo-elements, painted through
           a mask so it always renders in the current context's color */
        --lock-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3H9z"/></svg>');
    }
    .lock-icon, .trash-icon { width: 1em; height: 1em; display: inline-block; vertical-align: -0.12em; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.55; color: var(--ink); background: var(--bg);
        background-image:
            radial-gradient(ellipse at 0% 0%,   rgba(66, 229, 138, 0.08) 0%, transparent 45%),
            radial-gradient(ellipse at 100% 0%, rgba(66, 229, 138, 0.06) 0%, transparent 45%),
            radial-gradient(ellipse at 50% 100%,rgba(66, 229, 138, 0.10) 0%, transparent 50%);
        background-attachment: fixed;
        min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 1.25rem 1.25rem 4rem; }

    /* HEADER — football field + helmet collision animation */
    header {
        position: relative; overflow: hidden;
        height: 260px;
        background: #0a0d12;
        border-radius: 12px;
        border: 1px solid rgba(66, 229, 138, 0.4);
        box-shadow:
            0 0 28px rgba(66, 229, 138, 0.20),
            0 0 60px rgba(66, 229, 138, 0.10),
            inset 0 0 60px rgba(0, 0, 0, 0.5);
        margin-bottom: 1.25rem;
    }
    header canvas {
        position: absolute; inset: 0; width: 100%; height: 100%;
    }
    header .title-stack {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        z-index: 2; text-align: center; pointer-events: none;
    }
    /* Header title, painted on the field like a stadium midfield logo:
       bold yellow with a heavy dark stroke for grass-paint depth. */
    header h1 {
        font-family: 'Copperplate Gothic Bold', 'Copperplate', 'Bank Gothic', 'Trajan Pro', 'Optima', Georgia, serif;
        font-size: 5rem; font-weight: 900;
        letter-spacing: 0.12em; text-transform: uppercase;
        color: #fee11a;
        background: linear-gradient(180deg, #fff2a0 0%, #fee11a 55%, #c99c00 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        -webkit-text-stroke: 2px rgba(0, 0, 0, 0.55);
        text-shadow: 0 3px 6px rgba(0, 0, 0, 0.45);
        line-height: 1;
    }
    header h1 .apostrophe { -webkit-text-fill-color: #fff; color: #fff; }

    /* Notes at the bottom of each enter section */
    .section-notes { margin-top: 1.1rem; }
    .section-notes .banner-warn:last-child { margin-bottom: 0; }

    /* Rules tab prose: rules cards stay left-aligned per convention */
    .rules-prose { text-align: left; }
    .rules-prose ul { margin: 0.2rem 0 0 1.3rem; }
    .rules-prose li { margin: 0.35rem 0; }
    .rules-prose strong { color: #f7f9fb; }

    /* Toolbar */
    .season-tabs { display: inline-flex; gap: 6px; margin-right: 12px; }
    .season-tab {
        padding: 6px 16px; border-radius: 6px 6px 0 0; cursor: pointer;
        border: 1px solid var(--line, #3a4152); border-bottom: 2px solid transparent;
        background: #232937; color: #9aa3b5; font-weight: 600; font-size: .95rem;
    }
    .season-tab.active { background: #2e3648; color: var(--accent, #ffd54a); border-bottom-color: var(--accent, #ffd54a); }
    .season-tab:hover { color: #e6e9f0; }
    /* Season tab row: the tabs plus the week selector inline at the end */
    .season-row { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .season-row select {
        background: var(--card); color: var(--ink); border: 1px solid var(--accent);
        padding: 7px 12px; border-radius: 6px; font-size: 0.92rem; cursor: pointer;
        white-space: nowrap; font-weight: 600;
        text-align: center; text-align-last: center;
        box-shadow: 0 0 8px rgba(66, 229, 138, 0.25);
    }
    .season-row select:focus { outline: 1px solid var(--accent); }
    /* Scoreboard card: nothing but the three stat rows, centered */
    .toolbar {
        display: flex; justify-content: center;
        background: var(--surface); padding: 0.9rem 1rem;
        border-radius: 8px; margin-bottom: 1rem;
        /* Scoreboard identity: glowing green frame using the site accent */
        border: 1px solid var(--accent);
        box-shadow: 0 0 12px var(--accent-glow),
                    0 0 30px rgba(66, 229, 138, 0.18),
                    inset 0 0 10px rgba(66, 229, 138, 0.06);
    }
    /* Summary: tidy stacked rows (winner, season totals, week totals),
       each locked to a single line, centered, scaled up as the page's
       headline numbers with the winner row largest */
    .toolbar .summary {
        display: flex; flex-direction: column;
        gap: 5px; align-items: center;
        color: var(--dim); font-size: 1.08rem;
    }
    .summary .sum-row { white-space: nowrap; }
    .summary .sum-row:first-child { font-size: 1.3rem; }
    .summary .sum-sep { color: var(--dim); margin: 0 7px; }

    /* Tabs */
    .tabs { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 1rem; }
    .tab {
        padding: 8px 14px; background: var(--surface); color: var(--dim);
        border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
        font-size: 0.85rem; font-weight: 600; letter-spacing: 0.04em;
        text-transform: uppercase; transition: all 0.15s;
    }
    .tab:hover { background: #1a1d24; color: var(--ink); }
    .tab.active {
        background: linear-gradient(135deg, #0d3b1e, #164a2b);
        color: var(--accent-bright); border-color: var(--accent);
        box-shadow: 0 0 14px rgba(66, 229, 138, 0.45);
    }

    section.panel { display: none; }
    section.panel.active { display: block; }

    .panel-card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem;
    }
    .panel-card h3 {
        color: var(--accent); font-size: 1.05rem; letter-spacing: 0.06em;
        text-transform: uppercase; margin-bottom: 0.7rem;
        border-left: 3px solid var(--accent); padding-left: 0.6rem;
    }
    /* Collapsible header — click the h3 to hide/show the card body */
    .panel-card h3.collapsible-h3 {
        cursor: pointer; user-select: none;
        display: flex; align-items: center; gap: 0.5rem;
    }
    .panel-card h3.collapsible-h3 .chev {
        display: inline-block; color: var(--accent);
        font-size: 0.9em; transition: transform 0.18s ease;
    }
    .panel-card h3.collapsible-h3:hover { color: #7ff2a5; }
    .panel-card.collapsed > *:not(h3) { display: none; }
    .panel-card.collapsed h3 { margin-bottom: 0; }
    .panel-card.collapsed h3 .chev { transform: rotate(-90deg); }

    /* Two-column picks (Nick | RJ) */
    .picks-grid {
        display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;
    }
    @media (max-width: 720px) { .picks-grid { grid-template-columns: 1fr; } }
    .person-card {
        background: var(--surface); border: 1px solid var(--line);
        border-radius: 8px; overflow: hidden;
    }
    .person-card .person-head {
        padding: 0.75rem 1rem;
        background: linear-gradient(135deg, #101519, #0b0f13);
        border-bottom: 1px solid var(--line);
        display: flex; align-items: baseline; gap: 0.75rem;
    }
    .person-card .who {
        font-family: 'Copperplate Gothic Bold', 'Copperplate', serif;
        font-size: 1.3rem; color: var(--ink); letter-spacing: 0.1em;
    }
    .person-card .net {
        margin-left: auto; font-weight: 800; font-size: 1.15rem;
        font-variant-numeric: tabular-nums;
    }
    .person-card .net.good { color: var(--good); text-shadow: 0 0 10px rgba(66, 229, 138, 0.5); }
    .person-card .net.bad  { color: var(--bad);  text-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    .person-card table {
        width: 100%; border-collapse: collapse; font-size: 0.88rem;
    }
    .person-card th {
        text-align: left; padding: 0.5rem 1rem; color: var(--dim);
        font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
        border-bottom: 1px solid var(--line);
    }
    .person-card td {
        padding: 0.55rem 1rem; border-bottom: 1px solid #12161d;
        color: var(--ink); font-variant-numeric: tabular-nums;
    }
    /* Mortal lock rows glow BLUE (works over both the dark RJ rows and the
       light Nick rows). Locks keep this blue even after grading; the result
       shows in the lock slot and as a small W/L badge on the row. */
    .person-card tr.mortal-lock {
        background: rgba(37, 99, 235, 0.14);
        box-shadow: inset 3px 0 0 0 var(--lock-blue), 0 0 12px rgba(37, 99, 235, 0.22);
        position: relative;
        animation: lock-pulse 2.4s ease-in-out infinite;
    }
    .person-card tr.mortal-lock td { color: #d6e6ff; }
    .person-card tr.mortal-lock td:first-child::before {
        content: "";
        display: inline-block;
        width: 0.85em; height: 0.85em;
        margin-right: 5px;
        vertical-align: -0.06em;
        background-color: var(--lock-blue-bright);
        -webkit-mask: var(--lock-mask) center / contain no-repeat;
        mask: var(--lock-mask) center / contain no-repeat;
    }
    @keyframes lock-pulse {
        0%,100% { box-shadow: inset 3px 0 0 0 var(--lock-blue), 0 0 8px  rgba(37, 99, 235, 0.20); }
        50%     { box-shadow: inset 3px 0 0 0 var(--lock-blue), 0 0 18px rgba(37, 99, 235, 0.40); }
    }
    /* Graded pick rows (current season, once an outcome is set): the whole
       row glows green for a win, red for a loss, soft amber for a push.
       Ungraded rows keep the default look. Defined after the mortal-lock
       rules so a graded lock shows its result color, not the idle pulse. */
    .person-card tr.graded-w,
    .person-card tr.graded-l,
    .person-card tr.graded-p { animation: none; }
    .person-card tr.graded-w {
        background: rgba(66, 229, 138, 0.10);
        box-shadow: inset 3px 0 0 0 var(--good), 0 0 12px rgba(66, 229, 138, 0.25);
    }
    .person-card tr.graded-l {
        background: rgba(239, 68, 68, 0.10);
        box-shadow: inset 3px 0 0 0 var(--bad), 0 0 12px rgba(239, 68, 68, 0.22);
    }
    .person-card tr.graded-p {
        background: rgba(255, 200, 90, 0.08);
        box-shadow: inset 3px 0 0 0 rgba(255, 200, 90, 0.55);
    }
    /* Small result badge on lock rows (the row itself stays blue) */
    .lock-badge {
        display: inline-block; margin-left: 8px; padding: 0 6px;
        border-radius: 4px; font-size: 0.7rem; font-weight: 800;
    }
    .lock-badge.w { background: rgba(66, 229, 138, 0.18); color: var(--good); border: 1px solid var(--good); }
    .lock-badge.l { background: rgba(239, 68, 68, 0.16); color: var(--bad); border: 1px solid var(--bad); }
    .lock-badge.p { background: rgba(255, 200, 90, 0.16); color: #d3a63f; border: 1px solid #b48a2f; }

    /* Designated mortal lock slots */
    .lock-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem; }
    .lock-slot {
        background: var(--surface); border: 1px solid var(--lock-blue);
        border-radius: 8px; padding: 0.7rem 0.9rem;
        box-shadow: 0 0 10px rgba(37, 99, 235, 0.20);
    }
    .lock-slot .slot-title {
        font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
        letter-spacing: 0.07em; color: var(--lock-blue-bright); margin-bottom: 0.35rem;
    }
    .lock-slot .slot-pick { font-weight: 600; }
    .lock-slot .slot-meta { font-size: 0.8rem; color: var(--dim); margin-top: 2px; }
    .lock-slot .slot-empty { color: var(--dim); font-style: italic; }
    /* Graded slot takes the result treatment (the row keeps its blue) */
    .lock-slot.graded-w { background: rgba(66, 229, 138, 0.10); border-color: var(--good); box-shadow: 0 0 12px rgba(66, 229, 138, 0.28); }
    .lock-slot.graded-l { background: rgba(239, 68, 68, 0.10); border-color: var(--bad); box-shadow: 0 0 12px rgba(239, 68, 68, 0.25); }
    .lock-slot.graded-p { background: rgba(255, 200, 90, 0.08); border-color: #b48a2f; box-shadow: 0 0 10px rgba(255, 200, 90, 0.18); }
    .net-good { color: var(--good); font-weight: 700; }
    .net-bad  { color: var(--bad);  font-weight: 700; }
    .net-zero { color: var(--dim); }

    /* Stat tiles for H2H, team analysis */
    .stat-row {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 0.75rem; margin-bottom: 1.25rem;
    }
    .stat-tile {
        background: var(--card); border: 1px solid var(--line);
        border-radius: 8px; padding: 0.9rem; text-align: center;
        border-top: 3px solid var(--accent);
    }
    .stat-tile .value {
        font-size: 1.7rem; font-weight: 800; color: var(--accent);
        font-variant-numeric: tabular-nums;
    }
    .stat-tile .label {
        font-size: 0.72rem; color: var(--dim); text-transform: uppercase;
        letter-spacing: 0.05em; margin-top: 0.25rem;
    }

    table.data {
        width: 100%; border-collapse: collapse; font-size: 0.88rem;
        background: var(--card); border-radius: 6px; overflow: hidden;
    }
    table.data th {
        text-align: left; padding: 0.6rem 0.8rem; color: var(--dim);
        font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em;
        background: #0d1116; border-bottom: 1px solid var(--line);
    }
    table.data th.num { text-align: right; }
    table.data td { padding: 0.55rem 0.8rem; border-bottom: 1px solid #12161d; }
    table.data td.num { text-align: right; font-variant-numeric: tabular-nums; }
    table.data tr:hover { background: #121620; }

    /* Fixed column widths so the header grid + row grids stay perfectly aligned.
       Widths: lock | bet-type | H | Home | A | Away | ±/OU | Pts | Units | who# | save status */
    .form-row {
        display: grid;
        grid-template-columns: 28px 80px 82px 30px 1fr 30px 1fr 60px 75px 65px 56px 58px;
        gap: 0.45rem; align-items: center; margin: 0.45rem 0;
    }
    /* Nick's cards: steel gray, so the alternating RJ (near-black) / Nick
       (steel) rhythm is obvious at a glance. Text, bubbles, lock circle,
       and status colors keep the site's normal light-on-dark styling; the
       inputs just sit a touch lighter than the steel so fields stay visible. */
    .form-row.person-nick {
        background: var(--nick-bg);
        border-radius: 6px; padding: 3px 0;
    }
    .form-row.person-nick select, .form-row.person-nick input {
        background: #111c29; border-color: #30465a;
    }
    .form-row.person-nick .idx { color: #a7aebb; }
    /* Text centers inside the enter card controls. Selects rely on
       text-align-last, which a few mobile browsers ignore; that is the
       best CSS can do short of replacing the native control. */
    .form-row input { text-align: center; }
    .form-row select { text-align: center; text-align-last: center; }
    /* Hydrated cards past their lock time render read-only and dimmed */
    .form-row[data-locked] { opacity: 0.55; }
    /* Pin every row item to its explicit column so display:none on a hidden
       cell (e.g. H/A bubbles on O/U bets, Pts input on ML bets) doesn't cause
       subsequent items to auto-place and shift the layout left. */
    .form-row > .lock-cell  { grid-column: 1; }
    .form-row > .bet-type   { grid-column: 2; }
    .form-row > .timeframe  { grid-column: 3; }
    .form-row > .side-h     { grid-column: 4; }
    .form-row > .home       { grid-column: 5; }
    .form-row > .side-a     { grid-column: 6; }
    .form-row > .away       { grid-column: 7; }
    .form-row > .sign-slot  { grid-column: 8; }
    .form-row > .points     { grid-column: 9; }
    .form-row > .units      { grid-column: 10; }
    .form-row > .idx        { grid-column: 11; }
    .form-row > .row-status { grid-column: 12; }
    /* Desktop adaptivity: O/U rows hide the H/A side bubbles, so their grid
       drops those two tracks and re-pins the later cells. The row reflows
       exactly like the phone layout does when fields hide. The mobile flex
       layout ignores grid templates, so phone behavior is untouched. */
    .form-row.bt-ou {
        grid-template-columns: 28px 80px 82px minmax(0, 1fr) minmax(0, 1fr) 60px 75px 65px 56px 58px;
    }
    .form-row.bt-ou > .home       { grid-column: 4; }
    .form-row.bt-ou > .away       { grid-column: 5; }
    .form-row.bt-ou > .sign-slot  { grid-column: 6; }
    .form-row.bt-ou > .points     { grid-column: 7; }
    .form-row.bt-ou > .units      { grid-column: 8; }
    .form-row.bt-ou > .idx        { grid-column: 9; }
    .form-row.bt-ou > .row-status { grid-column: 10; }
    /* Per-row autosave indicator: idle (empty), saving (dim), saved (green
       check), retry (red, tappable to re-attempt the save) */
    .row-status {
        font-size: 0.72rem; text-align: center; justify-self: center;
        min-height: 24px; display: inline-flex; align-items: center;
        justify-content: center; padding: 2px 4px;
    }
    .row-status.saving { color: var(--dim); }
    .row-status.saved  { color: var(--good); font-size: 0.95rem; text-shadow: 0 0 6px rgba(66, 229, 138, 0.6); }
    .row-status.retry  {
        color: var(--bad); cursor: pointer; font-weight: 700;
        text-decoration: underline; text-underline-offset: 2px;
    }
    /* Red X: the pick is started but incomplete for its bet type. Styled
       like the saved check, indicator only, never clickable. */
    .row-status.incomplete { color: var(--bad); font-size: 0.95rem; font-weight: 700; }
    /* Timeframe tag icons inside their bubbles */
    .tf-icon { width: 12px; height: 12px; display: block; }
    .lock-cell {
        display: inline-flex; align-items: center; justify-content: center;
        width: 28px; height: 28px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.55);
        cursor: pointer;
        transition: all 0.12s ease;
        position: relative;
        justify-self: center;      /* Center inside its grid cell */
    }
    .lock-cell:hover { background: rgba(0, 0, 0, 0.35); }
    /* Hide the native checkbox — the lock-cell circle itself is the control */
    .lock-cell input[type="checkbox"] {
        appearance: none; -webkit-appearance: none;
        width: 100%; height: 100%; margin: 0;
        border: none; background: transparent; cursor: pointer;
    }
    /* Keyboard hardening: the styled checkbox is otherwise invisible when
       focused, so a stray Space could toggle a lock with zero feedback */
    .lock-cell input[type="checkbox"]:focus-visible {
        outline: 2px solid var(--lock-blue-bright);
        outline-offset: 2px;
        border-radius: 50%;
    }
    .lock-cell:has(input:checked) {
        background: rgba(37, 99, 235, 0.40);
        border-color: var(--lock-blue);
        box-shadow: 0 0 12px rgba(37, 99, 235, 0.80);
    }
    .lock-cell:has(input:checked)::after {
        content: "";
        position: absolute;
        width: 14px; height: 14px;
        background-color: #eaf2ff;
        -webkit-mask: var(--lock-mask) center / contain no-repeat;
        mask: var(--lock-mask) center / contain no-repeat;
        pointer-events: none;
    }
    /* The locked card SHOULD pop: deep royal-blue wash, highlighted edges
       (a 2px ring drawn with box-shadow so the grid never shifts), and a
       layered outer glow. Text stays the site's light ink over the deep blue. */
    .form-row:has(.lock-cell input:checked) {
        background: rgba(30, 64, 175, 0.30);
        border-left: 3px solid var(--lock-blue);
        padding-left: 3px;
        border-radius: 6px;
        box-shadow: 0 0 0 2px var(--lock-blue),
                    0 0 14px rgba(37, 99, 235, 0.65),
                    0 0 32px rgba(30, 64, 175, 0.45);
    }
    /* Lock-checked Nick card: the steel deepens toward royal blue */
    .form-row.person-nick:has(.lock-cell input:checked) { background: #2f3d61; }
    .form-col-header {
        display: grid;
        grid-template-columns: 28px 80px 82px 30px 1fr 30px 1fr 60px 75px 65px 56px 58px;
        gap: 0.45rem; align-items: center;
        color: var(--dim); font-size: 0.72rem; text-transform: uppercase;
        letter-spacing: 0.08em; padding: 0 0 0.35rem;
        border-bottom: 1px solid var(--line); margin-bottom: 0.4rem;
    }
    .form-col-header span { text-align: center; }
    .form-row .idx {
        color: var(--dim); font-family: 'Copperplate Gothic Bold', serif;
        font-size: 0.8rem; width: 30px; text-align: right;
    }
    .form-row select, .form-row input {
        background: var(--card); color: var(--ink); border: 1px solid var(--line);
        padding: 6px 9px; border-radius: 4px; font-size: 0.88rem; min-width: 0;
    }
    .form-row select:focus, .form-row input:focus { outline: 1px solid var(--accent); }
    .sign-group {
        display: inline-flex; gap: 0.25rem; align-items: center;
        justify-content: center;
        justify-self: center;   /* Center this bubble group inside its grid cell */
        border: 1px solid transparent; border-radius: 4px; padding: 2px;
        background: transparent;
    }
    .sign-group label {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 22px; height: 22px; padding: 0 6px;
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 4px;
        color: var(--dim); font-size: 0.82rem; cursor: pointer;
        font-family: 'Copperplate Gothic Bold', serif;
        transition: background 0.12s ease, color 0.12s ease,
                    border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .sign-group label:hover { background: rgba(0, 0, 0, 0.35); color: var(--ink); }
    .sign-group input[type="radio"] { display: none; }
    .sign-group label:has(input:checked) {
        background: rgba(66, 229, 138, 0.22);
        border-color: var(--accent);
        color: var(--accent);
        box-shadow: 0 0 8px rgba(66, 229, 138, 0.45);
    }
    .hidden-field { display: none !important; }
    .form-section-title {
        color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em;
        font-size: 0.85rem; font-weight: 700; margin: 1.25rem 0 0.5rem 0;
        display: flex; align-items: baseline; gap: 0.75rem;
    }
    .form-section-title .lock {
        color: var(--dim); font-size: 0.72rem; font-weight: 500; letter-spacing: 0.05em; text-transform: none;
    }

    /* Rules and note cards are fully neutral: standard card background and
       border, standard ink, and emphasis rendered as the strongest neutral
       ink the dark scheme has (near-white bold), never an accent color */
    .banner-warn {
        background: var(--surface);
        border: 1px solid var(--line);
        color: var(--ink); padding: 0.9rem 1.1rem;
        border-radius: 8px; margin-bottom: 1rem;
        font-size: 0.88rem;
    }
    .banner-warn strong { color: #f7f9fb; }

    /* Grading buttons on the Week Picks table (current season only):
       compact, all five controls on one row that never wraps, so every
       pick reads as a single dense line */
    .grade-cell { white-space: nowrap; }
    .grade-btns { display: inline-flex; gap: 3px; align-items: center; flex-wrap: nowrap; }
    .grade-btn {
        min-width: 24px; height: 24px; padding: 0 5px;
        background: var(--card); color: var(--dim);
        border: 1px solid var(--line); border-radius: 5px;
        font-size: 0.72rem; font-weight: 700; cursor: pointer;
        line-height: 1; transition: all 0.12s;
    }
    .grade-btn:hover { color: var(--ink); border-color: var(--accent); }
    .grade-btn.w.on { background: rgba(66, 229, 138, 0.22); color: var(--good); border-color: var(--accent); box-shadow: 0 0 8px rgba(66, 229, 138, 0.4); }
    .grade-btn.l.on { background: rgba(239, 68, 68, 0.20); color: var(--bad); border-color: var(--bad); box-shadow: 0 0 8px rgba(239, 68, 68, 0.35); }
    .grade-btn.p.on { background: rgba(255, 255, 255, 0.10); color: var(--ink); border-color: #6b7280; }
    .grade-btn.del:hover { color: var(--bad); border-color: var(--bad); }

    /* Save bar on the Enter Picks panels */
    .save-bar { display: flex; gap: 0.7rem; align-items: center; flex-wrap: wrap; }
    .save-bar label {
        color: var(--dim); font-size: 0.85rem; font-weight: 600;
        letter-spacing: 0.05em; text-transform: uppercase;
    }
    .save-bar input[type="number"] {
        width: 72px; background: var(--card); color: var(--ink);
        border: 1px solid var(--line); padding: 7px 9px; border-radius: 4px;
        font-size: 0.95rem;
    }
    .save-bar input[type="number"]:focus { outline: 1px solid var(--accent); }
    .btn-save {
        background: linear-gradient(135deg, #0d3b1e, #164a2b);
        color: var(--accent-bright); border: 1px solid var(--accent);
        padding: 9px 20px; border-radius: 6px; cursor: pointer;
        font-size: 0.85rem; font-weight: 700; letter-spacing: 0.05em;
        text-transform: uppercase;
        box-shadow: 0 0 14px rgba(66, 229, 138, 0.35);
    }
    .btn-save:hover { box-shadow: 0 0 20px rgba(66, 229, 138, 0.55); }
    .btn-save:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
    .save-status { color: var(--dim); font-size: 0.85rem; }
    .save-status.ok { color: var(--good); }
    .save-status.err { color: var(--bad); }

    /* Dismissible live-data warning bar */
    .live-warn {
        position: relative;
        background: rgba(239, 68, 68, 0.10);
        border: 1px solid rgba(239, 68, 68, 0.45);
        color: var(--ink); padding: 0.65rem 2.4rem 0.65rem 1rem;
        border-radius: 8px; margin-bottom: 1rem; font-size: 0.85rem;
    }
    .live-warn .dismiss {
        position: absolute; right: 6px; top: 4px;
        background: none; border: none; color: var(--dim);
        font-size: 1.05rem; cursor: pointer; padding: 4px 8px;
    }
    .live-warn .dismiss:hover { color: var(--ink); }

    /* ===== Centered card text, per RJ =====
       Text inside cards centers site-wide. Deliberate exclusions: the House
       Rules card, the mortal lock rules banner, the autosave note, and the
       small dim footnotes stay left-aligned for readability, and the enter
       form rows keep their layout because they are controls, not prose. */
    .panel-card h3 { text-align: center; justify-content: center; }
    section.panel h2 { text-align: center; }
    .form-section-title { justify-content: center; }
    table.data th, table.data td { text-align: center; }
    table.data th.num, table.data td.num { text-align: center; }
    .person-card th, .person-card td { text-align: center; }
    .person-card .person-head { justify-content: center; gap: 1rem; }
    .person-card .net { margin-left: 0; }
    .lock-slot { text-align: center; }

    /* Team typeahead dropdown: one reusable panel, absolutely positioned in
       document coordinates under whichever team input is active, so it rides
       the page's natural scroll (iOS keyboard included) and never gets
       clipped by the form card borders. */
    .team-typeahead {
        position: absolute; display: none; z-index: 1000;
        background: var(--surface);
        border: 1px solid var(--accent);
        border-radius: 6px;
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.6), 0 0 12px rgba(66, 229, 138, 0.25);
        max-height: 240px; overflow-y: auto;
        min-width: 200px;
    }
    .tt-option {
        display: flex; align-items: center;
        min-height: 40px; padding: 0 12px;
        color: var(--ink); font-size: 0.95rem; cursor: pointer;
        border-bottom: 1px solid #12161d;
        user-select: none; -webkit-user-select: none;
    }
    .tt-option:last-child { border-bottom: none; }
    .tt-option:hover, .tt-option.active {
        background: rgba(66, 229, 138, 0.16);
        color: var(--accent-bright);
    }

    /* ===== Mobile layout (phones are the primary device) =====
       Everything below only applies under 720px, desktop is untouched. */
    @media (max-width: 720px) {
        /* General: the page body must never scroll sideways; wide content
           scrolls inside its own card instead */
        body { overflow-x: hidden; }
        .container { padding: 0.75rem 0.75rem 3rem; }
        header { height: 170px; }
        header h1 { font-size: 2.6rem; -webkit-text-stroke: 1.5px rgba(0, 0, 0, 0.55); }

        /* Toolbar and tabs: wrap cleanly, tap-friendly, summary drops below */
        .toolbar { padding: 0.6rem 0.7rem; gap: 0.5rem; }
        /* Small font keeps even "26-27 W14" on one line; selects open the
           native picker on phones so the sub-16px zoom quirk does not apply */
        .season-row select { min-height: 42px; font-size: 14px; padding: 6px 9px; }
        .toolbar .summary { font-size: 1rem; }
        .toolbar .summary .sum-row:first-child { font-size: 1.2rem; }
        .season-tabs { flex-wrap: wrap; margin-right: 6px; }
        .season-tab { padding: 8px 12px; font-size: 0.9rem; }
        .tab { padding: 10px 8px; font-size: 0.75rem; flex: 1 1 auto; text-align: center; }

        /* Cards and tables: tighter padding; dense tables keep their natural
           width (nowrap cells) and scroll horizontally inside the card */
        .panel-card { padding: 0.85rem; overflow-x: auto; }
        .person-card { overflow-x: auto; }
        table.data th, table.data td { white-space: nowrap; }

        /* Grade buttons stay one compact single-line row on phones too;
           26px is still comfortably tappable for this use */
        .grade-btn { min-width: 26px; height: 26px; }

        /* Enter form: the 11-column grid cannot fit a phone, so each row
           reflows into a two-line card.
           Line 1: bet type, H bubble + home team, A bubble + away team.
           Line 2: sign group, points, units, lock, save status.
           The ::before pseudo item (defined only in this media query, so the
           desktop grid never sees it) forces the break between the lines. */
        .form-col-header { display: none; }
        .form-row {
            display: flex; flex-wrap: wrap; align-items: center;
            gap: 8px;
            border: 1px solid var(--line); border-radius: 8px;
            background: var(--card);
            padding: 8px; margin: 0.55rem 0;
        }
        /* Three-line phone card.
           Line 1: timeframe icons, bet type, then the H and A bubbles
           (H before A, matching home-left and away-right below).
           Line 2: home and away inputs side by side, an even half each.
           Line 3: sign group, points, units, lock, status.
           The two pseudo items force the line breaks; they exist only in
           this media query, so the desktop grid never sees them. With H/A
           hidden on O/U rows, line 1 is just timeframe plus bet type and
           line 2 still splits the teams evenly. */
        .form-row::before { content: ''; flex-basis: 100%; height: 0; order: 5; }
        .form-row::after  { content: ''; flex-basis: 100%; height: 0; order: 8; }
        .form-row > .timeframe  { order: 1; }
        .form-row > .bet-type   { order: 2; flex: 0 0 auto; }
        .form-row > .side-h     { order: 3; }
        .form-row > .side-a     { order: 4; }
        .form-row > .home       { order: 6; flex: 1 1 40%; min-width: 0; }
        .form-row > .away       { order: 7; flex: 1 1 40%; min-width: 0; }
        .form-row > .sign-slot  { order: 9; }
        .form-row > .points     { order: 10; flex: 1 1 64px; max-width: 110px; }
        .form-row > .units      { order: 11; flex: 1 1 64px; max-width: 100px; }
        .form-row > .lock-cell  { order: 12; width: 40px; height: 40px; }
        .form-row > .row-status { order: 13; margin-left: auto; }
        /* Timeframe bubbles slim down so line 1 keeps room for team names */
        .form-row > .timeframe label { min-width: 26px; height: 34px; padding: 0 4px; }
        /* Row number as a small notch badge riding the card's top border.
           Absolutely positioned, so it takes no space from either line and
           never crowds the inputs at 390px. */
        .form-row { position: relative; }
        .form-row > .idx {
            display: block; position: absolute; top: -9px; right: 10px;
            width: auto; padding: 0 5px;
            font-size: 0.65rem; text-align: center;
            color: var(--dim); background: var(--surface);
        }
        /* 42px tall + 16px font: comfortable taps, and iOS Safari does not
           auto-zoom on focus at 16px or larger */
        .form-row select, .form-row .home, .form-row .away,
        .form-row .points, .form-row .units { min-height: 42px; font-size: 16px; }
        .sign-group label { min-width: 32px; height: 38px; font-size: 0.95rem; }
        .lock-cell:has(input:checked)::after { width: 16px; height: 16px; }
        /* Keep the card padding even when the lock highlight adds its own
           left border (the base rule shrinks padding-left for the grid),
           and paint the card's own border in the deep lock blue too */
        .form-row:has(.lock-cell input:checked) { padding-left: 8px; border-color: var(--lock-blue); }
        /* Nick's steel cards, restated here because the mobile .form-row
           rule above resets the background later in the cascade */
        .form-row.person-nick { background: var(--nick-bg); border-color: var(--nick-line); }
        .form-row.person-nick:has(.lock-cell input:checked) { background: #2f3d61; border-color: var(--lock-blue); }

        /* Save bar */
        .save-bar input[type="number"] { min-height: 44px; font-size: 16px; }
        .btn-save { min-height: 44px; padding: 10px 22px; }
    }

    footer {
        margin-top: 3rem; text-align: center;
        color: var(--accent); font-size: 0.82rem;
        text-shadow: 0 0 10px rgba(66, 229, 138, 0.3);
    }
</style>

<script>
    /* ===== Football field + helmet collision animation ===== */
    (function () {
        const canvas = document.getElementById('hdrCanvas');
        const ctx = canvas.getContext('2d');
        let W = 0, H = 0, dpr = 1;
        function resize() {
            dpr = window.devicePixelRatio || 1;
            const rect = canvas.parentElement.getBoundingClientRect();
            W = rect.width; H = rect.height;
            canvas.width = Math.max(1, Math.floor(W * dpr));
            canvas.height = Math.max(1, Math.floor(H * dpr));
            canvas.style.width  = W + 'px';
            canvas.style.height = H + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        window.addEventListener('resize', resize);

        // Animation state — cycles: helmets approach, collide, explode, reset.
        const CYCLE_MS = 4500;   // one full cycle
        const APPROACH = 0.55;   // when they meet, as fraction of cycle
        const EXPLODE_LEN = 0.20;
        let start = performance.now();
        let particles = [];

        // Field layout constants — used by both drawField and the scenes below.
        // Keep them as a helper so scenes can position players in field-yard-units.
        function fieldGeom() {
            const marginX = 20;
            const marginY = 12;
            const fieldW = W - marginX * 2;
            const fieldH = H - marginY * 2;
            const unitsTotal = 120;                 // 100 yards + 2×10-yard endzones
            const uPx = fieldW / unitsTotal;        // px per yard-unit
            const x = (u) => marginX + u * uPx;     // convert yard-unit to canvas x
            return {marginX, marginY, fieldW, fieldH, unitsTotal, uPx, x};
        }

        function drawField() {
            // Base grass — deep field green with vertical mowed stripes
            const baseGrad = ctx.createLinearGradient(0, 0, 0, H);
            baseGrad.addColorStop(0, '#0d3b1f');
            baseGrad.addColorStop(1, '#0a2a17');
            ctx.fillStyle = baseGrad;
            ctx.fillRect(0, 0, W, H);
            // Mowed stripes — 5-yard-wide alternating light/dark bands
            const geom = fieldGeom();
            for (let u = 0; u < geom.unitsTotal; u += 5) {
                if ((u / 5) % 2 === 0) continue;
                ctx.fillStyle = 'rgba(255,255,255,0.035)';
                ctx.fillRect(geom.x(u), 0, geom.uPx * 5, H);
            }
            // Subtle grass texture — tiny random dots (deterministic-ish via sin)
            ctx.fillStyle = 'rgba(0,0,0,0.14)';
            for (let i = 0; i < 220; i++) {
                const gx = (i * 173.7) % W;
                const gy = (i * 91.3)  % H;
                ctx.fillRect(gx, gy, 1, 1);
            }
            ctx.fillStyle = 'rgba(255,255,255,0.06)';
            for (let i = 0; i < 140; i++) {
                const gx = (i * 219.1) % W;
                const gy = (i * 137.5) % H;
                ctx.fillRect(gx, gy, 1, 1);
            }
            // Soft top vignette so text remains readable at the top edge
            const vg = ctx.createLinearGradient(0, 0, 0, H * 0.35);
            vg.addColorStop(0, 'rgba(0,0,0,0.35)');
            vg.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = vg;
            ctx.fillRect(0, 0, W, H * 0.35);

            // Proper football field markings.
            // Layout: two 10-yard endzones + 100 yards playing field = 120 units.
            // Left to right: EZ | G | 10 | 20 | 30 | 40 | 50 | 40 | 30 | 20 | 10 | G | EZ
            const marginX = 20;
            const marginY = 12;
            const fieldW = W - marginX * 2;
            const fieldH = H - marginY * 2;
            const unitsTotal = 120;                 // 100 yards + 2×10-yard endzones
            const uPx = fieldW / unitsTotal;        // px per yard-unit

            // Sidelines (top + bottom) — bright white
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(marginX, marginY); ctx.lineTo(W - marginX, marginY); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(marginX, H - marginY); ctx.lineTo(W - marginX, H - marginY); ctx.stroke();

            // Endzones — solid Oregon green (deeper than the field)
            ctx.fillStyle = 'rgba(4, 46, 24, 0.85)';
            ctx.fillRect(marginX, marginY, uPx * 10, fieldH);
            ctx.fillRect(W - marginX - uPx * 10, marginY, uPx * 10, fieldH);

            // Goal lines (thick, bright white)
            ctx.strokeStyle = 'rgba(255,255,255,0.95)';
            ctx.lineWidth = 3;
            [10, 110].forEach(u => {
                const x = marginX + u * uPx;
                ctx.beginPath(); ctx.moveTo(x, marginY); ctx.lineTo(x, H - marginY); ctx.stroke();
            });

            // Yard-line markings every 10 yards (10 → 100 = the 10s across the playing field)
            // With 50 in the middle. Labels: G 10 20 30 40 50 40 30 20 10 G
            const yardMarks = [
                {u: 10,  label: 'G'},
                {u: 20,  label: '10'},
                {u: 30,  label: '20'},
                {u: 40,  label: '30'},
                {u: 50,  label: '40'},
                {u: 60,  label: '50'},
                {u: 70,  label: '40'},
                {u: 80,  label: '30'},
                {u: 90,  label: '20'},
                {u: 100, label: '10'},
                {u: 110, label: 'G'},
            ];
            // Draw hash marks — small ticks at 1-yard intervals across the field
            ctx.strokeStyle = 'rgba(255,255,255,0.7)';
            ctx.lineWidth = 1;
            for (let u = 11; u < 110; u++) {
                if (u % 5 === 0) continue;  // handled below
                const x = marginX + u * uPx;
                const hashLen = 5;
                [fieldH * 0.30 + marginY, fieldH * 0.70 + marginY].forEach(y => {
                    ctx.beginPath();
                    ctx.moveTo(x, y - hashLen / 2);
                    ctx.lineTo(x, y + hashLen / 2);
                    ctx.stroke();
                });
            }
            // 5-yard lines — short partial lines
            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 1.3;
            for (let u = 15; u < 110; u += 5) {
                if (u % 10 === 0) continue;
                const x = marginX + u * uPx;
                ctx.beginPath();
                ctx.moveTo(x, marginY + 3);
                ctx.lineTo(x, marginY + 12);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x, H - marginY - 12);
                ctx.lineTo(x, H - marginY - 3);
                ctx.stroke();
            }
            // Ten-yard lines — full-height white lines
            ctx.strokeStyle = 'rgba(255,255,255,0.95)';
            ctx.lineWidth = 1.8;
            for (const m of yardMarks) {
                if (m.label === 'G') continue;
                const x = marginX + m.u * uPx;
                ctx.beginPath(); ctx.moveTo(x, marginY + 2); ctx.lineTo(x, H - marginY - 2); ctx.stroke();
            }

            // Yard-line numbers — top and bottom rows, upright on both halves
            ctx.font = '800 13px "Helvetica Neue", system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            for (const m of yardMarks) {
                if (m.label === 'G') continue;
                if (m.u === 60) continue;  // midfield covered by PICK'EM logo
                const x = marginX + m.u * uPx;
                ctx.fillStyle = 'rgba(255, 255, 255, 0.88)';
                ctx.fillText(m.label, x, marginY + 16);
                ctx.fillText(m.label, x, H - marginY - 16);
            }

            // ---- Endzone team names — vertical, painted white, both endzones ----
            function endzoneText(label, uCenter) {
                const ex = marginX + uCenter * uPx;
                ctx.save();
                ctx.translate(ex, H / 2);
                // Text runs top-to-bottom on the left endzone (turned +90°),
                // and bottom-to-top on the right endzone (turned −90°) so both
                // read facing outward as at a real stadium.
                ctx.rotate(uCenter < 60 ? -Math.PI / 2 : Math.PI / 2);
                const ezPx = Math.min(fieldH * 0.55, 42);
                ctx.font = `900 ${ezPx}px 'Copperplate Gothic Bold', 'Impact', system-ui`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                // Outline for depth
                ctx.lineWidth = 3;
                ctx.strokeStyle = 'rgba(0,0,0,0.55)';
                ctx.strokeText(label, 0, 0);
                ctx.fillStyle = 'rgba(255,255,255,0.94)';
                ctx.fillText(label, 0, 0);
                ctx.restore();
            }
            endzoneText('R . J .',    5);   // left endzone  — spaced dotted initials
            endzoneText('N I C K',  115);   // right endzone — spaced letters

            // Note: the "PICK'EM" midfield text is painted by the h1 element
            // overlaid on top of this canvas via header .title-stack — kept in
            // HTML so it stays selectable + accessible + easily restyled.
        }

        // Draw a football helmet profile with a team-specific logo painted on
        // the side. `team` is one of 'WSU' or 'ASU'. Rendered as a right-facing
        // profile helmet with layered shading — shell base, ambient occlusion
        // rim, warm specular highlight, and painted stripe.
        function drawHelmet(cx, cy, facingRight, team) {
            const R = Math.min(H * 0.22, 60);
            ctx.save();
            ctx.translate(cx, cy);
            if (!facingRight) ctx.scale(-1, 1);

            const paint = team === 'WSU'
                ? { shell:'#f9f9f7', shellMid:'#dcdcd6', shellDark:'#8f8f8a',
                    trim:'#981e32', trimDark:'#5a1220',
                    mask:'#9a9da0', maskShadow:'#3a3d40',
                    chin:'#00b7a8', chinDark:'#00695f' }
                : { shell:'#ffcf3a', shellMid:'#e0a91b', shellDark:'#7a5a08',
                    trim:'#8c1d40', trimDark:'#4a0a1e',
                    mask:'#5c1128', maskShadow:'#2a0812',
                    chin:'#3d0916', chinDark:'#1a0308' };

            // Ground shadow ellipse
            ctx.fillStyle = 'rgba(0,0,0,0.55)';
            ctx.beginPath();
            ctx.ellipse(0, R * 1.00, R * 1.10, R * 0.14, 0, 0, Math.PI * 2);
            ctx.fill();

            // ---- Helmet shell silhouette ----
            // Anatomical football helmet outline: dome front-heavy, extended ear
            // flap in back, jaw pad wraps below the ear.
            function shellPath() {
                ctx.beginPath();
                ctx.moveTo(-R * 0.85,  R * 0.05);       // back-left ear flap edge
                // Sweep up the back of the head
                ctx.bezierCurveTo(-R * 0.95, -R * 0.25,  -R * 0.90, -R * 0.60, -R * 0.55, -R * 0.80);
                // Over the top of the crown
                ctx.bezierCurveTo(-R * 0.20, -R * 1.02,   R * 0.55, -R * 1.00,  R * 0.82, -R * 0.55);
                // Forehead down to eye level
                ctx.bezierCurveTo( R * 0.99, -R * 0.20,   R * 1.02,  R * 0.05,  R * 0.85,  R * 0.30);
                // Front lower jaw curve
                ctx.bezierCurveTo( R * 0.70,  R * 0.48,   R * 0.55,  R * 0.55,  R * 0.35,  R * 0.55);
                // Underside of jaw pad
                ctx.bezierCurveTo( R * 0.10,  R * 0.68,  -R * 0.20,  R * 0.75, -R * 0.45,  R * 0.70);
                // Ear-flap curve back to start
                ctx.bezierCurveTo(-R * 0.72,  R * 0.60,  -R * 0.85,  R * 0.35, -R * 0.85,  R * 0.05);
                ctx.closePath();
            }

            // Base fill (radial gradient — light hits from upper-right)
            const shellGrad = ctx.createRadialGradient(R * 0.20, -R * 0.55, R * 0.10,
                                                        R * 0.10, -R * 0.10, R * 1.30);
            shellGrad.addColorStop(0.00, paint.shell);
            shellGrad.addColorStop(0.55, paint.shellMid);
            shellGrad.addColorStop(1.00, paint.shellDark);
            ctx.fillStyle = shellGrad;
            shellPath();
            ctx.fill();

            // Specular gloss — soft white sheen on the crown/front
            const gloss = ctx.createRadialGradient(R * 0.15, -R * 0.65, R * 0.05,
                                                    R * 0.15, -R * 0.55, R * 0.75);
            gloss.addColorStop(0, 'rgba(255,255,255,0.55)');
            gloss.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gloss;
            shellPath();
            ctx.fill();

            // Rim ambient-occlusion — soft dark inner shadow along back and jaw
            ctx.save();
            shellPath();
            ctx.clip();
            const shade = ctx.createRadialGradient(-R * 0.55, R * 0.30, R * 0.05,
                                                    -R * 0.55, R * 0.30, R * 1.20);
            shade.addColorStop(0, 'rgba(0,0,0,0.35)');
            shade.addColorStop(0.6, 'rgba(0,0,0,0.08)');
            shade.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = shade;
            ctx.fillRect(-R * 1.2, -R * 1.2, R * 2.4, R * 2.4);
            ctx.restore();

            // Rim outline (very subtle)
            ctx.strokeStyle = 'rgba(0,0,0,0.25)';
            ctx.lineWidth = 1;
            shellPath();
            ctx.stroke();

            // ---- Center helmet stripe (front-to-back), with darker outline ----
            function stripePath() {
                ctx.beginPath();
                ctx.moveTo(-R * 0.55, -R * 0.80);
                ctx.bezierCurveTo(-R * 0.20, -R * 0.99,  R * 0.55, -R * 0.97,  R * 0.82, -R * 0.55);
                ctx.lineTo(R * 0.82, -R * 0.42);
                ctx.bezierCurveTo(R * 0.55, -R * 0.86, -R * 0.20, -R * 0.86, -R * 0.55, -R * 0.68);
                ctx.closePath();
            }
            ctx.fillStyle = paint.trim;
            stripePath();
            ctx.fill();
            ctx.strokeStyle = paint.trimDark;
            ctx.lineWidth = 0.8;
            stripePath();
            ctx.stroke();

            // ---- Team logo on the side ----
            if (team === 'WSU') {
                // Stylized crimson Coug head — angular, side profile facing right.
                // Not pixel-exact vs the real WSU mark (which is trademark art),
                // but reads unmistakably as WSU: crimson, angular cougar head with
                // pointy ears + jaw slash.
                ctx.save();
                ctx.translate(-R * 0.1, -R * 0.05);
                ctx.rotate(-0.05);
                ctx.fillStyle = paint.trim;   // crimson
                ctx.strokeStyle = paint.trim;
                ctx.lineJoin = 'miter';
                ctx.lineWidth = 1;
                const S = R * 0.55;   // logo bounding size
                // Cougar head outline (side profile, facing right)
                ctx.beginPath();
                ctx.moveTo(-S * 0.65,  S * 0.15);    // back of neck
                ctx.lineTo(-S * 0.75, -S * 0.10);    // up back of skull
                ctx.lineTo(-S * 0.55, -S * 0.55);    // back of ear base
                ctx.lineTo(-S * 0.35, -S * 0.30);    // ear notch dip
                ctx.lineTo(-S * 0.20, -S * 0.60);    // front ear tip
                ctx.lineTo(-S * 0.05, -S * 0.35);    // brow ridge
                ctx.lineTo( S * 0.30, -S * 0.30);    // top of nose bridge
                ctx.lineTo( S * 0.60, -S * 0.15);    // nose tip
                ctx.lineTo( S * 0.65,  S * 0.05);    // upper lip
                ctx.lineTo( S * 0.35,  S * 0.15);    // mouth line back
                ctx.lineTo( S * 0.55,  S * 0.30);    // fang / lower jaw
                ctx.lineTo( S * 0.15,  S * 0.40);    // jaw underside
                ctx.lineTo(-S * 0.15,  S * 0.55);    // neck front
                ctx.lineTo(-S * 0.55,  S * 0.55);    // neck bottom
                ctx.closePath();
                ctx.fill();
                // Negative-space eye slash — cut a thin diagonal white slit
                ctx.fillStyle = paint.shell;
                ctx.beginPath();
                ctx.moveTo( S * 0.05, -S * 0.20);
                ctx.lineTo( S * 0.30, -S * 0.10);
                ctx.lineTo( S * 0.28, -S * 0.02);
                ctx.lineTo( S * 0.03, -S * 0.12);
                ctx.closePath();
                ctx.fill();
                // Small mouth slit
                ctx.beginPath();
                ctx.moveTo( S * 0.35,  S * 0.05);
                ctx.lineTo( S * 0.55,  S * 0.10);
                ctx.lineTo( S * 0.55,  S * 0.15);
                ctx.lineTo( S * 0.35,  S * 0.12);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            } else {
                // ASU pitchfork — three-tined trident in maroon on gold shell
                ctx.save();
                ctx.translate(-R * 0.1, -R * 0.1);
                ctx.rotate(-0.05);
                ctx.fillStyle = paint.trim;   // maroon #8c1d40
                ctx.strokeStyle = '#4a0a1e';  // darker maroon outline
                ctx.lineWidth = 1;
                // Handle
                const w = R * 0.06, h = R * 0.55;
                ctx.beginPath();
                ctx.rect(-w / 2, 0, w, h);
                ctx.fill(); ctx.stroke();
                // Crossbar
                ctx.beginPath();
                ctx.rect(-R * 0.35, -R * 0.05, R * 0.7, w);
                ctx.fill(); ctx.stroke();
                // Three tines pointing up
                const tineH = R * 0.55;
                function tine(x) {
                    ctx.beginPath();
                    ctx.moveTo(x - w / 2, -R * 0.05);
                    ctx.lineTo(x + w / 2, -R * 0.05);
                    ctx.lineTo(x + w / 2, -R * 0.05 - tineH * 0.75);
                    ctx.lineTo(x, -R * 0.05 - tineH);       // point
                    ctx.lineTo(x - w / 2, -R * 0.05 - tineH * 0.75);
                    ctx.closePath();
                    ctx.fill(); ctx.stroke();
                }
                tine(-R * 0.28);
                tine(0);
                tine(R * 0.28);
                ctx.restore();
            }

            // ---- Ear hole with padding ring ----
            // Ring of shell-tinted padding around a dark ear cavity
            ctx.fillStyle = paint.shellDark;
            ctx.beginPath();
            ctx.arc(-R * 0.35, R * 0.12, R * 0.22, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0a0a0a';
            ctx.beginPath();
            ctx.arc(-R * 0.35, R * 0.12, R * 0.14, 0, Math.PI * 2);
            ctx.fill();
            // Small screw / vent dots
            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            [[-R*0.60,-R*0.35],[R*0.05,-R*0.75],[R*0.55,-R*0.55],[-R*0.10,R*0.40]].forEach(([x,y])=>{
                ctx.beginPath(); ctx.arc(x,y, R*0.03, 0, Math.PI*2); ctx.fill();
            });

            // ---- Face mask ----
            // Modern speed-cage — 3 horizontal bars + 2 vertical connectors,
            // painted with a subtle shadow underneath for depth.
            const maskBars = [
                // Upper eye bar
                { m: [R*0.28, -R*0.08], c: [R*1.02, -R*0.02], e: [R*0.98, R*0.18] },
                // Mid nose bar
                { m: [R*0.22,  R*0.15], c: [R*1.02,  R*0.22], e: [R*0.94, R*0.36] },
                // Lower mouth/chin bar
                { m: [R*0.24,  R*0.36], c: [R*0.96,  R*0.40], e: [R*0.72, R*0.55] },
            ];
            // Shadow under the mask for depth
            ctx.strokeStyle = paint.maskShadow;
            ctx.lineWidth = 3.6; ctx.lineCap = 'round';
            for (const b of maskBars) {
                ctx.beginPath();
                ctx.moveTo(b.m[0], b.m[1] + 1.5);
                ctx.bezierCurveTo(b.c[0], b.c[1] + 1.5,  b.c[0], b.c[1] + 1.5,  b.e[0], b.e[1] + 1.5);
                ctx.stroke();
            }
            // Mask itself
            ctx.strokeStyle = paint.mask;
            ctx.lineWidth = 2.8;
            for (const b of maskBars) {
                ctx.beginPath();
                ctx.moveTo(b.m[0], b.m[1]);
                ctx.bezierCurveTo(b.c[0], b.c[1],  b.c[0], b.c[1],  b.e[0], b.e[1]);
                ctx.stroke();
            }
            // Vertical connector bars between the horizontals
            ctx.beginPath();
            ctx.moveTo(R * 1.02, -R * 0.02);
            ctx.lineTo(R * 1.02,  R * 0.22);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(R * 0.94,  R * 0.36);
            ctx.lineTo(R * 0.98,  R * 0.18);
            ctx.stroke();
            // Center vertical (nose bar)
            ctx.beginPath();
            ctx.moveTo(R * 0.75, R * 0.05);
            ctx.lineTo(R * 0.72, R * 0.45);
            ctx.stroke();

            // ---- Chin strap ----
            // Two-strap arrangement + molded chin cup
            ctx.strokeStyle = paint.chinDark;
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-R * 0.30, R * 0.68);
            ctx.quadraticCurveTo(R * 0.05, R * 0.85, R * 0.38, R * 0.55);
            ctx.stroke();
            ctx.strokeStyle = paint.chin;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-R * 0.30, R * 0.66);
            ctx.quadraticCurveTo(R * 0.05, R * 0.82, R * 0.38, R * 0.53);
            ctx.stroke();
            // Molded chin cup — small rounded rect
            ctx.fillStyle = paint.chinDark;
            ctx.beginPath();
            ctx.ellipse(R * 0.32, R * 0.60, R * 0.14, R * 0.08, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = paint.chin;
            ctx.beginPath();
            ctx.ellipse(R * 0.32, R * 0.58, R * 0.10, R * 0.05, -0.2, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        function spawnExplosion(cx, cy) {
            particles = [];
            const N = 60;
            for (let i = 0; i < N; i++) {
                const a = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 5;
                const green = Math.random() < 0.6;
                particles.push({
                    x: cx, y: cy,
                    vx: Math.cos(a) * speed,
                    vy: Math.sin(a) * speed * 0.8,
                    life: 1.0,
                    color: green ? '#4ade80' : (Math.random() < 0.5 ? '#ffffff' : '#ffcc4d'),
                    size: 2 + Math.random() * 3,
                });
            }
        }

        // ---------- Field-goal-miss scene ----------
        // Nick's team kicking LEFT from the left-33 (u=43); holder+kicker on
        // the 40 (u=50). Ball snaps → hold → kick → flies toward the LEFT
        // uprights, drifts LEFT, misses wide left. "WIDE LEFT · NICK LOSES".
        // "WIDE LEFT" renders ABOVE the PICK'EM header, "NICK LOSES" below.
        function drawFieldGoal(p, t) {
            const geom = fieldGeom();
            const {marginX, marginY, fieldW, fieldH, uPx, x} = geom;
            const groundY = H * 0.62;

            // Uprights on the LEFT endzone at u≈5 (center of endzone)
            const upX = x(5);
            const upTop = H * 0.10;
            const upMid = H * 0.55;
            ctx.strokeStyle = '#ffea3c';
            ctx.lineWidth = 4; ctx.lineCap = 'square';
            ctx.beginPath();
            ctx.moveTo(upX, upMid); ctx.lineTo(upX, H - marginY - 4);
            ctx.stroke();
            const barW = uPx * 6;
            ctx.beginPath();
            ctx.moveTo(upX - barW/2, upMid);
            ctx.lineTo(upX + barW/2, upMid);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(upX - barW/2, upMid); ctx.lineTo(upX - barW/2, upTop);
            ctx.moveTo(upX + barW/2, upMid); ctx.lineTo(upX + barW/2, upTop);
            ctx.stroke();

            function player(px, py, colorFill, colorEdge) {
                ctx.fillStyle = 'rgba(0,0,0,0.35)';
                ctx.beginPath(); ctx.ellipse(px, py + 6, 6, 2, 0, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = colorFill;
                ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
                ctx.strokeStyle = colorEdge; ctx.lineWidth = 1;
                ctx.stroke();
            }

            // LOS at u=43 (left-side 33-yard line); kicking to the LEFT.
            const losX = x(43);
            // O-line (Nick's, blue) + D-line (dark) on the LOS
            for (let i = -2; i <= 2; i++) player(losX + i * 12, groundY, '#3b82f6', '#0d3b7a');
            for (let i = -2; i <= 2; i++) player(losX - 14 + i * 12, groundY, '#333', '#000');

            // Holder + kicker sit at u=50 (40-yard line, 7 yds behind LOS to the RIGHT
            // since we kick LEFT)
            const holderX = x(50);
            const holderY = groundY + 2;
            const kickerX = holderX + 24;   // kicker behind holder (right side)
            const kickerY = groundY - 6;

            let ballX, ballY, ballAngle = 0;
            const holderBallY = holderY - 4;

            if (p < 0.15) {
                ballX = losX; ballY = groundY - 2;
            } else if (p < 0.30) {
                const k = (p - 0.15) / 0.15;
                ballX = losX + (holderX - losX) * k;
                ballY = (groundY - 2) + (-12 * Math.sin(k * Math.PI)) + (holderBallY - (groundY - 2)) * k;
                ballAngle = k * 3;
            } else if (p < 0.42) {
                ballX = holderX; ballY = holderBallY;
            } else if (p < 0.75) {
                const k = (p - 0.42) / 0.33;
                const targetX = upX - barW * 0.85;   // WIDE LEFT of the left upright
                ballX = holderX + (targetX - holderX) * k;
                const arcApex = -Math.min(H * 0.55, 100);
                ballY = holderBallY + arcApex * Math.sin(k * Math.PI) + (upMid - holderBallY) * k * 0.4;
                ballAngle = k * 8;
            } else {
                // Freeze frame — ball settles just past the upright, on the ground
                const k = Math.min(1, (p - 0.75) / 0.25);
                ballX = upX - barW * 0.85 - 30 * k;
                ballY = Math.min(H - marginY - 6, upMid - 10 + 60 * k);
                ballAngle = 8 + k * 4;
            }

            if (p >= 0.15 && p < 0.42) {
                player(kickerX, kickerY, '#3b82f6', '#0d3b7a');
            } else if (p >= 0.42 && p < 0.75) {
                // Follow-through — kick leg extended forward (LEFT)
                player(kickerX - 8, kickerY - 8, '#3b82f6', '#0d3b7a');
                ctx.strokeStyle = '#ffea3c'; ctx.lineWidth = 3; ctx.lineCap='round';
                ctx.beginPath();
                ctx.moveTo(kickerX - 8, kickerY - 6);
                ctx.lineTo(kickerX + 12, kickerY + 4);
                ctx.stroke();
            } else {
                player(kickerX, kickerY, '#3b82f6', '#0d3b7a');
            }

            player(holderX, holderY + 2, '#1e40af', '#0d1f4a');

            // Football
            ctx.save();
            ctx.translate(ballX, ballY);
            ctx.rotate(ballAngle);
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.ellipse(0, 0, 6, 3.5, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.moveTo(-2, 0); ctx.lineTo(2, 0);
            for (let i = -1.5; i <= 1.5; i += 1) {
                ctx.moveTo(i, -0.8); ctx.lineTo(i, 0.8);
            }
            ctx.stroke();
            ctx.restore();

            // Post-miss text — "WIDE LEFT" above the header, "NICK LOSES" below.
            // The h1 PICK'EM sits near H/2, so we put text at ~14% and ~82%.
            if (p >= 0.72) {
                const k = Math.min(1, (p - 0.72) / 0.05);
                const flash = 0.5 + 0.5 * Math.sin(t * 0.02);
                ctx.globalAlpha = k;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                // "WIDE LEFT" above the header
                ctx.font = `900 ${Math.min(38, H * 0.18)}px 'Copperplate Gothic Bold', Impact, sans-serif`;
                ctx.fillStyle = '#fff';
                ctx.shadowColor = `rgba(239, 68, 68, ${0.7 + 0.3 * flash})`;
                ctx.shadowBlur = 25;
                ctx.fillText('WIDE LEFT', W / 2, H * 0.14);
                // "NICK LOSES" below the header
                ctx.font = `700 ${Math.min(32, H * 0.16)}px 'Copperplate Gothic Bold', Impact, sans-serif`;
                ctx.fillStyle = '#ef4444';
                ctx.shadowColor = 'rgba(239, 68, 68, 0.9)';
                ctx.fillText('NICK LOSES', W / 2, H * 0.86);
                ctx.globalAlpha = 1;
                ctx.shadowBlur = 0;
            }
        }

        // ---------- Animation loop — runs each scene ONCE then freezes ----------
        // Phase A (0 .. CYCLE_MS)          : helmet collision
        // Phase B (CYCLE_MS .. 2*CYCLE_MS) : field goal miss
        // Phase C (>= 2*CYCLE_MS)          : freeze on the final FG frame
        function drawCollision(p) {
            const cy = H * 0.5;
            const leftStart = -60, leftMid = W / 2 - 30;
            const rightStart = W + 60, rightMid = W / 2 + 30;

            let lx, rx;
            if (p < APPROACH) {
                const k = p / APPROACH;
                const ease = k * k;
                lx = leftStart + (leftMid - leftStart) * ease;
                rx = rightStart + (rightMid - rightStart) * ease;
            } else if (p < APPROACH + EXPLODE_LEN) {
                const k = (p - APPROACH) / EXPLODE_LEN;
                if (particles.length === 0) spawnExplosion(W / 2, cy);
                lx = leftMid - 40 * k;
                rx = rightMid + 40 * k;
            } else {
                const k = (p - APPROACH - EXPLODE_LEN) / (1 - APPROACH - EXPLODE_LEN);
                lx = leftMid - 40 - (leftMid + 100) * k;
                rx = rightMid + 40 + (W - rightMid + 100) * k;
                if (k > 0.85) particles = [];
            }

            for (const pt of particles) {
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.vy += 0.14;
                pt.life -= 0.018;
                if (pt.life > 0) {
                    ctx.globalAlpha = Math.max(0, pt.life);
                    ctx.fillStyle = pt.color;
                    ctx.shadowColor = pt.color;
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;
            particles = particles.filter(pt => pt.life > 0);

            drawHelmet(lx, cy, true,  'WSU');
            drawHelmet(rx, cy, false, 'ASU');
        }

        let frozen = false;
        function frame(t) {
            const dt = t - start;

            drawField();

            if (dt < CYCLE_MS) {
                // Phase A — collision plays out
                drawCollision(dt / CYCLE_MS);
                requestAnimationFrame(frame);
            } else if (dt < 2 * CYCLE_MS) {
                // Phase B — field goal plays out
                particles = [];   // clear collision debris before FG scene
                drawFieldGoal((dt - CYCLE_MS) / CYCLE_MS, t);
                requestAnimationFrame(frame);
            } else {
                // Phase C — freeze on the final field goal frame (ball landed
                // past the upright, "WIDE LEFT" / "NICK LOSES" flashing).
                // Keep drawing so the flashing sine wave keeps pulsing gently.
                drawFieldGoal(1.0, t);
                requestAnimationFrame(frame);
            }
        }
        requestAnimationFrame(frame);
    })();

    /* ===== Data + rendering ===== */
    const RAW = JSON.parse(document.getElementById('pickemData').textContent);
    const FBS_TEAMS = JSON.parse(document.getElementById('fbsTeams').textContent);
    // Monochrome padlock, inline SVG with currentColor so every context can
    // tint it via CSS. Replaces the emoji, which rendered gold on phones.
    const LOCK_ICON = '<svg class="lock-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 0 1 6 0v3H9z"/></svg>';
    // Minimal outline trash can, same currentColor approach as LOCK_ICON,
    // tinted per context by CSS. No emoji anywhere.
    const TRASH_ICON = '<svg class="trash-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>';
    // Timeframe tag icons: calendar for weekday games, football for the
    // Saturday main slate, plus sign for gameday additions. currentColor
    // like every other icon on the page.
    const TF_WEEKDAY_ICON = '<svg class="tf-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7zM5 10h14v10H5V10z"/></svg>';
    const TF_MAIN_ICON = '<svg class="tf-icon" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="12" rx="9.5" ry="6" transform="rotate(-30 12 12)"/><path d="M9.6 13.4l4.8-2.8" stroke-width="1.5"/></g></svg>';
    const TF_GAMEDAY_ICON = '<svg class="tf-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5z"/></svg>';
    // Multi-season: the pickemData tag holds the CURRENT season (refreshed by
    // the weekly pipeline); pickemArchive holds frozen past seasons. Current
    // season is selected by default; every view and tally already reads
    // SEASONS[seasonSel.value], so all tracking stays separate per season.
    const ARCHIVE = (() => {
        try { return JSON.parse(document.getElementById('pickemArchive').textContent); }
        catch (e) { return { seasons: [] }; }
    })();
    const SEASONS = {};
    SEASONS[RAW.season] = RAW.weeks;
    for (const s of ARCHIVE.seasons) {
        if (!(s.season in SEASONS)) SEASONS[s.season] = s.weeks;
    }

    /* ===== Current season week config =====
       The current season always shows the fixed slate of weeks 0 through 14,
       and the site's idea of "this week" advances automatically every Monday
       based on the visitor's local date, so no republish is ever needed as
       the season rolls on. Archived seasons keep deriving their week list
       purely from their embedded data. */
    const CURRENT_SEASON_TOTAL_WEEKS = 18;              // weeks 0 through 17, postseason included
    const CURRENT_SEASON_WEEK0_MONDAY = '2026-08-24';   // Monday starting CFB Week 0's game week
    // Weeks 15 to 17 are the postseason slots; the numeric week value stays
    // in the DB, only the display name changes.
    const SPECIAL_WEEK_NAMES = { 15: 'Conf. Champs', 16: 'Bowl Games', 17: 'CFP Playoff' };
    function weekDisplayName(week) { return SPECIAL_WEEK_NAMES[week] || ('Week ' + week); }
    function weekShortLabel(week) { return SPECIAL_WEEK_NAMES[week] || ('W' + week); }

    // floor(days since Week 0 Monday / 7), clamped to 0..14. Local time, so
    // it ticks over at the visitor's local midnight each Monday.
    function computeCurrentWeek() {
        const start = new Date(CURRENT_SEASON_WEEK0_MONDAY + 'T00:00:00');
        const days = Math.floor((Date.now() - start.getTime()) / 86400000);
        const wk = Math.floor(days / 7);
        return Math.min(CURRENT_SEASON_TOTAL_WEEKS - 1, Math.max(0, wk));
    }

    /* ===== Pick lock windows (house rules, current season only) =====
       A pick created BEFORE its week's Saturday 12:00 PM Eastern belongs to
       Weekday/Main Slate and locks at that Saturday noon; a pick created
       AFTER Saturday noon is a Gameday Addition and locks Sunday 11:59 PM
       Eastern. Cutoffs are built as UTC timestamps from the Eastern wall
       time; the CFB season runs on daylight time, so Eastern is UTC-4. */
    const ET_OFFSET_HOURS = 4;
    function weekLockTimes(week) {
        const parts = CURRENT_SEASON_WEEK0_MONDAY.split('-').map(Number);
        const week0MondayUtc = Date.UTC(parts[0], parts[1] - 1, parts[2]);
        const weekMondayUtc = week0MondayUtc + week * 7 * 86400000;
        return {
            // Saturday 12:00 PM ET, as UTC ms
            saturdayNoonEt: weekMondayUtc + 5 * 86400000 + (12 + ET_OFFSET_HOURS) * 3600000,
            // Sunday 11:59 PM ET, as UTC ms
            sundayNightEt: weekMondayUtc + 6 * 86400000 + (23 + ET_OFFSET_HOURS) * 3600000 + 59 * 60000,
        };
    }
    function pickLockTime(p, week) {
        const cut = weekLockTimes(week);
        // The pick's own timeframe tag (fields.section) is authoritative:
        // weekday and main lock Saturday noon, gameday locks Sunday night.
        const section = p && p.fields && p.fields.section;
        if (section === 'gameday') return cut.sundayNightEt;
        if (section === 'weekday' || section === 'main') return cut.saturdayNoonEt;
        // Legacy rows without a tag keep the created_at heuristic: created
        // after Saturday noon means a Gameday Addition with the later
        // cutoff. Missing/unparseable created_at falls back to the earlier
        // Saturday cutoff, the conservative choice.
        const created = p && p.created_at ? Date.parse(p.created_at) : NaN;
        if (!isNaN(created) && created > cut.saturdayNoonEt) return cut.sundayNightEt;
        return cut.saturdayNoonEt;
    }
    function pickIsLocked(p, week) {
        return Date.now() > pickLockTime(p, week);
    }

    // Ensure every week 0..14 exists in the current season's weeks array
    // (missing ones get empty pick lists), sorted ascending. Any week outside
    // the fixed range that somehow carries data is kept.
    function padCurrentSeasonWeeks(weeks) {
        const have = new Set(weeks.map(w => w.week));
        for (let n = 0; n < CURRENT_SEASON_TOTAL_WEEKS; n++) {
            if (!have.has(n)) {
                weeks.push({ week: n,
                             nick: { picks: [], total_net: 0 },
                             rj:   { picks: [], total_net: 0 } });
            }
        }
        weeks.sort((a, b) => a.week - b.week);
        return weeks;
    }
    padCurrentSeasonWeeks(SEASONS[RAW.season]);

    /* ===== All-seasons combined view =====
       SEASONS[ALL_SEASONS] holds every tracked season's weeks concatenated,
       oldest season first, so the analytics tabs can aggregate across years
       by simply iterating it like any other season. Each merged week is a
       shallow copy carrying a display label ("25-26 Wk 3") because week
       numbers repeat across seasons; the numeric week field stays untouched.
       Rebuilt from SEASONS on every live refresh, so autosaved picks flow in.
       The view is read-only: every write guard already checks for the
       current season by name, which "All" can never match. */
    const ALL_SEASONS = 'All';
    function seasonShortLabel(name) {
        return name.replace(/^20(\d\d)-20(\d\d)$/, '$1-$2');
    }
    function buildAllSeasonsWeeks() {
        const names = Object.keys(SEASONS).filter(n => n !== ALL_SEASONS).sort();
        const merged = [];
        for (const name of names) {
            const short = seasonShortLabel(name);
            for (const w of SEASONS[name] || []) {
                merged.push({ ...w, label: short + ' ' + weekShortLabel(w.week) });
            }
        }
        SEASONS[ALL_SEASONS] = merged;
    }
    buildAllSeasonsWeeks();

    /* ===== Supabase live layer (current season only) =====
       The CURRENT season's picks live in the pickem_picks table and are
       fetched fresh on every page load. Archived seasons stay embedded in
       the pickemArchive tag and are never fetched. Plain fetch(), no SDK. */
    const SUPABASE_URL = 'https://ewiklljunudxcqbmeobq.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_qHTNl7gE4gprLpP2j-IPIA_odkoPUSt';

    // Thin REST helper. Adds auth headers, JSON-encodes the body, throws on
    // any non-2xx response, and JSON-parses the reply (null when empty).
    async function sb(path, opts) {
        opts = opts || {};
        const res = await fetch(SUPABASE_URL + path, {
            method: opts.method || 'GET',
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation',
            },
            body: opts.body !== undefined ? JSON.stringify(opts.body) : undefined,
        });
        if (!res.ok) {
            let detail = '';
            try { detail = (await res.text()).slice(0, 200); } catch (e) { /* body unreadable */ }
            throw new Error('Supabase ' + res.status + (detail ? ': ' + detail : ''));
        }
        const text = await res.text();
        return text ? JSON.parse(text) : null;
    }

    // Small dismissible warning bar under the toolbar. One at a time.
    function showLiveWarn(msg) {
        let bar = document.getElementById('liveWarnBar');
        if (!bar) {
            bar = document.createElement('div');
            bar.id = 'liveWarnBar';
            bar.className = 'live-warn';

            toolbar.after(bar);
